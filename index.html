<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NEW ARENA</title>
<style>
:root{--bg:#f6f7fb;--fg:#12151c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--fg:#e8ecf4}}
:root[data-theme="dark"]{--bg:#0b0d12;--fg:#e8ecf4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.site{max-width:720px;margin:0 auto;padding:12vh 24px}
.site h1{font-size:clamp(28px,6vw,48px);margin:0 0 12px}
.site p{opacity:.75;line-height:1.6}

/* ===== INTRO LAYER (đã scope bằng #arena-intro) ===== */
#arena-intro{position:fixed;inset:0;z-index:2147483000;background:#000;overflow:hidden;touch-action:none;transition:opacity 1.8s ease;contain:strict;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#arena-intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ai-title{position:absolute;left:0;right:0;top:24%;transform:translateY(-50%);text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 5vw;font-weight:600;letter-spacing:.32em;text-indent:.32em;text-shadow:0 0 22px rgba(110,160,255,.65)}
#ai-title div:first-child{font-size:clamp(13px,3.2vw,26px);opacity:.85;margin-bottom:.9em}
#ai-title div:last-child{font-size:clamp(24px,7.4vw,72px);font-weight:700}
.ai-label{position:absolute;left:0;top:0;white-space:nowrap;color:#fff;font-weight:500;font-size:clamp(10px,.9vw + 6px,13px);line-height:14px;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 8px #000,0 0 3px #000;opacity:0;transition:opacity 1.4s;pointer-events:none;will-change:transform}
.ai-label.on{opacity:.95}
#ai-logo{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:52px;height:52px;opacity:0;animation:aiIn 1.6s ease 1.2s forwards;pointer-events:none}
#ai-logo svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(120,170,255,.8));animation:aiGlow 3.2s ease-in-out infinite}
#ai-logo .ring{transform-origin:26px 26px;animation:aiSpin 9s linear infinite}
#ai-logo .s{stroke-dasharray:100;animation:aiDraw 4.2s ease-in-out infinite}
#ai-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:11px;font-weight:500;letter-spacing:.6em;text-indent:.6em;color:#fff;opacity:0;animation:aiFoot 2.4s ease 2s forwards;pointer-events:none}
#ai-brand{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:76px;height:52px;display:flex;align-items:center;color:#fff;font-weight:600;font-size:13px;letter-spacing:.38em;opacity:0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 0 12px rgba(120,170,255,.6)}
#ai-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;color:#fff;font-size:10px;letter-spacing:.2em;line-height:1.7;padding:0 8vw;opacity:0;transition:opacity 1.6s;pointer-events:none}
#ai-brand.on{opacity:.9}#ai-hint.on{opacity:.5}
#ai-card{position:absolute;z-index:17;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);min-width:190px;max-width:86vw;padding:11px 18px;text-align:center;color:#fff;background:rgba(12,16,28,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:14px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#ai-card.on{opacity:1;transform:translate(-50%,0)}
#ai-card b{display:block;font-size:14px;letter-spacing:.3em;text-indent:.3em;margin-bottom:6px}
#ai-card span{font-size:12px;opacity:.8;line-height:1.5}
.ai-label.hot{opacity:1;text-shadow:0 0 12px rgba(160,200,255,.95),0 1px 8px #000}
#arena-intro{--a1:#7fe9ff;--a2:#b69cff}
#ai-logo{left:26px;top:calc(env(safe-area-inset-top,0px) + 26px)}
#ai-brand{left:88px;top:calc(env(safe-area-inset-top,0px) + 26px)}
#ai-hint{left:auto;right:26px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 30px);text-align:right;max-width:42vw;padding:0;line-height:1.9}
#ai-foot{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#ai-frame i{position:absolute;z-index:2;width:20px;height:20px;border:0 solid var(--a1);opacity:0;pointer-events:none;animation:aiFr 2s ease 2.4s forwards}
#ai-frame i:nth-child(1){top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;border-width:1.5px 0 0 1.5px;border-top-left-radius:7px}
#ai-frame i:nth-child(2){top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;border-width:1.5px 1.5px 0 0;border-top-right-radius:7px}
#ai-frame i:nth-child(3){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;border-width:0 0 1.5px 1.5px;border-bottom-left-radius:7px}
#ai-frame i:nth-child(4){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;border-width:0 1.5px 1.5px 0;border-bottom-right-radius:7px}
@keyframes aiFr{to{opacity:.55}}
#ai-side{position:absolute;z-index:5;right:14px;top:calc(env(safe-area-inset-top,0px) + 22px);opacity:0;pointer-events:none;transition:opacity 1s}
#ai-side.on{opacity:1;pointer-events:auto}
#ai-hint{top:calc(env(safe-area-inset-top,0px) + 74px);right:16px}

/* ----- Nút: hình chữ nhật bo góc vừa phải, đủ trạng thái hover / pressed / loading / success / error ----- */
.rb{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid transparent;background:linear-gradient(rgba(12,16,32,.62),rgba(12,16,32,.62)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#e6eeff;font-family:inherit;font-weight:600;font-size:10.5px;letter-spacing:.12em;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s,box-shadow .25s,color .25s,opacity .2s}
.rb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.rb:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 14px rgba(120,170,255,.3)}
.rb:active{transform:scale(.97)}
.rb:focus-visible,.ab:focus-visible,.pbtn:focus-visible,.chip:focus-visible,.dtab:focus-visible,.mc:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.rb.act{color:#06101c;background:linear-gradient(135deg,var(--a1),var(--a2)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;box-shadow:0 0 14px rgba(127,233,255,.35)}
.rb::after,.ab::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.5),transparent 62%);opacity:0;pointer-events:none;transition:opacity .5s}
.rb:active::after,.ab:active::after{opacity:1;transition:none}
.rb.loading,.ab.loading{pointer-events:none;opacity:.85}
.rb.loading::before,.ab.loading::before{content:'';width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:aiSpin .7s linear infinite;flex-shrink:0}
.ab.ok,.rb.ok{border-color:#3dff9a!important;color:#3dff9a}
.ab.er,.rb.er{border-color:#ff6b81!important;color:#ff9aa8}
.rb[disabled],.ab[disabled]{opacity:.45;pointer-events:none}
#ai-side .rb{width:42px;padding:0}
.bdg{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#ff4d7a;color:#fff;font-size:9px;line-height:16px;font-style:normal;text-align:center;box-shadow:0 0 10px #ff4d7a}
.mfull{width:100%;margin-bottom:6px;justify-content:flex-start}
/* công tắc */
.sw{width:100%;height:44px;justify-content:space-between;padding:0 12px}
.sw>span{flex:1;text-align:left}
.kn{position:relative;display:block;width:42px;height:24px;border-radius:8px;background:rgba(255,255,255,.16);transition:background .3s;flex-shrink:0}
.kn::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:6px;background:#fff;transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
[aria-checked=true]>.kn{background:linear-gradient(135deg,var(--a1),var(--a2))}
[aria-checked=true]>.kn::after{transform:translateX(18px)}
#ai-mscrim{position:absolute;inset:0;z-index:10;background:rgba(2,4,12,.45);opacity:0;pointer-events:none;transition:opacity .4s}
.mOpen #ai-mscrim{opacity:1;pointer-events:auto}
#ai-menu{position:absolute;z-index:11;top:0;right:0;bottom:0;width:min(360px,92vw);box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 50%,rgba(255,255,255,.09));backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-left:1px solid rgba(255,255,255,.22);box-shadow:inset 1px 0 1px rgba(255,255,255,.35),-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.9,.25,1)}
.mOpen #ai-menu{transform:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mh b{letter-spacing:.35em;font-size:13px}
#ai-menu h4,.dvc h4{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;font-size:10px;letter-spacing:.3em;opacity:.75;font-weight:600}
.lnk{background:none;border:0;color:var(--a1);font-family:inherit;font-size:9.5px;letter-spacing:.14em;cursor:pointer;padding:8px 0}
.mac{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.mac img{width:40px;height:40px;border-radius:12px;object-fit:cover}.mwho{flex:1;min-width:0}
.mwho b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mwho small{display:block;font-size:10.5px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-family:inherit;font-size:12px;letter-spacing:.2em;cursor:pointer;transition:background .2s,transform .15s}
.mc:hover{background:rgba(255,255,255,.16)}.mc:active{transform:scale(.98)}
.mc img{width:34px;height:34px;border-radius:9px;background:rgba(0,0,0,.35)}.mc span{flex:1;text-align:left}.mc em{font-style:normal;font-size:11px;padding:3px 9px;border-radius:8px;background:rgba(0,0,0,.35);letter-spacing:.05em}
.mn{padding:9px 11px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--nc,var(--a1))}
.mn.un{background:rgba(255,255,255,.13)}.mn b{display:block;font-size:12px}.mn p{margin:3px 0 0;font-size:11.5px;opacity:.82;line-height:1.45;overflow-wrap:anywhere}.mn small{font-size:9.5px;opacity:.55}
.mn-empty{font-size:11.5px;opacity:.55;padding:6px 2px}
#ai-dock{display:block}#ai-menu .mac .rb{justify-content:flex-start}
#ai-menu input[type=search]{width:100%;box-sizing:border-box;height:40px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:13px;outline:0}
#ai-menu input[type=search]:focus{border-color:var(--a1)}
#gs-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.gsr{display:flex;align-items:center;gap:8px;width:100%;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.gsr:hover{background:rgba(255,255,255,.14)}.gsr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.gsr small{opacity:.6;font-size:10px;letter-spacing:.1em}

/* ----- Modal chung (thông báo giữa màn hình, biểu mẫu) ----- */
.mdl{position:absolute;inset:0;z-index:16;display:grid;place-items:center;padding:12px;box-sizing:border-box;background:rgba(2,4,12,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .35s}
.mdl.on{opacity:1;pointer-events:auto}
.mdc{width:min(480px,94vw);max-height:88vh;overflow-y:auto;box-sizing:border-box;padding:20px;border-radius:20px;color:#fff;overscroll-behavior:contain;touch-action:pan-y;background:linear-gradient(rgba(14,18,36,.8),rgba(14,18,36,.8)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;border:1px solid transparent;box-shadow:0 24px 70px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.12);transform:translateY(16px) scale(.96);opacity:.6;transition:transform .5s cubic-bezier(.2,.9,.3,1.1),opacity .35s}
.mdl.on .mdc{transform:none;opacity:1}
.mdh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mdh b{letter-spacing:.25em;font-size:13px}
.ann{text-align:center}
.an-ic{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;display:grid;place-items:center;font-size:24px;color:var(--nc,var(--a1));background:rgba(255,255,255,.07);border:1px solid var(--nc,var(--a1));box-shadow:0 0 24px color-mix(in srgb,var(--nc,var(--a1)) 40%,transparent)}
.ann b{display:block;font-size:17px;letter-spacing:.06em;overflow-wrap:anywhere}
.ann p{margin:10px 0 6px;font-size:13.5px;line-height:1.65;opacity:.88;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;max-height:42vh;overflow-y:auto}
.ann small{display:block;font-size:10.5px;opacity:.5;margin-bottom:14px}
.an-b{display:flex;gap:8px;flex-wrap:wrap}.an-b .rb{flex:1;min-width:130px;height:42px}
.fl{display:block;margin:10px 0 4px;font-size:11px;opacity:.75}
.mdc input,.mdc textarea,.mdc select,.dvc input,.dvc textarea,.dvc select{width:100%;box-sizing:border-box;margin-bottom:6px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:13px;outline:0}
.mdc input:focus,.mdc textarea:focus,.mdc select:focus,.dvc input:focus,.dvc textarea:focus,.dvc select:focus{border-color:var(--a1)}
.mdc textarea,.dvc textarea{min-height:84px;resize:vertical}.mdc select option,.dvc select option{color:#000}
.dvc input[type=checkbox]{width:auto;margin:0 8px 0 0}.dvc input[type=range],.mdc input[type=range]{padding:0;height:24px}.dvc input[type=color]{padding:2px;height:40px}
.fm-ok{text-align:center;padding:8px 0}.fm-ok .code{display:inline-block;margin:10px 0;padding:10px 16px;border-radius:10px;background:rgba(0,0,0,.35);border:1px dashed var(--a1);font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.12em;user-select:all}
.fm-er{margin:8px 0;font-size:12px;color:#ff9aa8;line-height:1.5}

/* ----- Dev Panel dạng bảng điều khiển ----- */
#ai-dev{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:8px;box-sizing:border-box;background:rgba(2,4,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
#ai-dev.on{opacity:1;pointer-events:auto}
.dvc{width:min(1000px,100%);height:min(90vh,820px);display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;padding:16px;border-radius:20px;color:#fff;background:linear-gradient(rgba(14,18,36,.86),rgba(14,18,36,.86)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;border:1px solid transparent;box-shadow:0 24px 70px rgba(0,0,0,.6);transform:translateY(16px) scale(.97);transition:transform .5s cubic-bezier(.2,.9,.3,1.1)}
#ai-dev.on .dvc{transform:none}
.dvc header{display:flex;align-items:center;gap:10px;flex-shrink:0}.dvc header b{letter-spacing:.3em;font-size:14px}.dvc header span{flex:1;min-width:0;font-size:11px;opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dv-tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none;flex-shrink:0}
.dtab{position:relative;height:36px;padding:0 13px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:600 10.5px inherit;font-family:inherit;letter-spacing:.1em;white-space:nowrap;cursor:pointer;transition:background .25s,transform .15s}
.dtab:active{transform:scale(.96)}
.dtab.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#06101c;border-color:transparent}
.dtab em{position:absolute;top:-6px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#ff4d7a;color:#fff;font:700 9px/16px system-ui;font-style:normal;text-align:center}
#dv-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:2px 2px 12px}
.dsec{animation:dsIn .38s cubic-bezier(.2,.9,.3,1) both}
@keyframes dsIn{from{opacity:0;transform:translateY(12px)}}
.dv-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.dv-stats div{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);text-align:center}
.dv-stats b{display:block;font-size:19px}.dv-stats small{font-size:9px;letter-spacing:.14em;opacity:.65}
.dv-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dv-row>select,.dv-row>input{flex:1;min-width:120px;margin-bottom:0}
.dv-it{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);font-size:12px}
.dv-it .tt{flex:1;min-width:140px;overflow-wrap:anywhere}.dv-it .tt b{display:block;font-size:13px}.dv-it .tt small{opacity:.6;font-size:11px}
.dv-it select{width:auto;margin:0;min-width:110px;height:34px;padding:0 8px;font-size:12px}
.dv-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:620px){.dv-grid{grid-template-columns:1fr}}
.dv-pg{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-size:12px}
.dv-map{position:relative;height:130px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);cursor:crosshair;touch-action:none;margin-bottom:8px}
.dv-map i{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;opacity:.35}.dv-map i.me{opacity:1;width:14px;height:14px;margin:-7px;box-shadow:0 0 12px currentColor}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px;width:100%}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .2s}
details.adv{margin:6px 0}details.adv summary{cursor:pointer;font-size:11px;opacity:.75;padding:6px 0}
.pv{margin-top:10px;padding:10px;border-radius:14px;border:1px dashed rgba(255,255,255,.25)}.pv>small{display:block;font-size:10px;letter-spacing:.2em;opacity:.55;margin-bottom:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:10px;letter-spacing:.08em;font-weight:700;border:1px solid currentColor}
.tg-on{color:#3dff9a}.tg-wait{color:#ffc14d}.tg-off{color:#a9b4cc}.tg-bad{color:#ff6b81}

/* ----- Trình phát nhạc ----- */
#ai-player{position:absolute;z-index:8;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100vw - 150px);transition:opacity .4s}
#pl-bar{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px;border-radius:14px;color:#fff;background:linear-gradient(rgba(12,16,32,.6),rgba(12,16,32,.6)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;border:1px solid transparent;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.45)}
#pl-bar .rb{height:36px;width:36px;padding:0}

  if(snooze){const m=snz(),now=Date.now();Object.keys(m).forEach(k=>{if(m[k]<=now)delete m[k]});m[x.id]=now+2*3600*1000;lsSet('nox_snz',m)}
  else{const a=sesSeen();a.push(x.id);try{sessionStorage.setItem('nox_ann',JSON.stringify(a.slice(-50)))}catch(e){}}
  const box=$('ai-ann');box.classList.remove('on');box.setAttribute('aria-hidden','true');ANN.cur=null;
  if(snooze&&!silent)toast('ĐÃ ẨN 2 GIỜ','Thông báo sẽ hiện lại sau 2 giờ nếu còn hiệu lực');
  clearTimeout(ANN.hideT);ANN.hideT=setTimeout(annTick,700);

function suggestForm(b){
  const kind=field(b,'Loại nội dung',optSel(Object.entries(KLAB).filter(e=>e[0]!=='other')));
  const wrap=el('div'),inputs={};b.appendChild(wrap);
  const er=el('div','fm-er');er.hidden=true;b.appendChild(er);
  const send=el('button','rb act','');send.append(el('span',null,'GỬI ĐỀ XUẤT'));send.style.cssText='width:100%;height:44px;margin-top:8px';b.appendChild(send);
  const build=()=>{
    wrap.replaceChildren();Object.keys(inputs).forEach(k=>delete inputs[k]);
    SFIELDS[kind.value].forEach(([key,lab,type,req,max])=>{
      const i=type==='a'||type==='s'?document.createElement('textarea'):document.createElement('input');if(type==='t'||type==='u')i.type=type==='u'?'url':'text';
      i.maxLength=max;if(type==='s')i.style.minHeight='64px';if(type==='a')i.style.minHeight='140px';
      if(type==='u')i.placeholder='https://';inputs[key]=i;wrap.appendChild(el('label','fl',lab+(req?' *':'')));wrap.appendChild(i);
    });
  };
  kind.onchange=build;build();
  send.onclick=async()=>{
    er.hidden=true;const k=kind.value,v={};
    for(const [key,lab,type,req,max] of SFIELDS[k]){
      let t=inputs[key].value.trim();
      if(req&&!t){er.textContent='Thiếu thông tin bắt buộc: '+lab+'.';er.hidden=false;inputs[key].focus();return}
      if(type==='u'&&t){t=safeUrl(t,k==='ios');if(!t){er.textContent='Đường dẫn không hợp lệ: '+lab+'. Chỉ chấp nhận http, https'+(k==='ios'?' hoặc itms-services':'')+'.';er.hidden=false;inputs[key].focus();return}}
      if(t)v[key]=t.slice(0,max);
    }
    if(k==='ios'&&!v.url&&!v.download){er.textContent='iOS cần ít nhất một đường dẫn (mở hoặc tải xuống).';er.hidden=false;return}
    const rl=rateOK('s',5);if(rl){er.textContent=rl;er.hidden=false;return}
    const u=auth.currentUser;if(!u){er.textContent='Phiên đăng nhập đã hết. Hãy đăng nhập lại.';er.hidden=false;return}
    /* chống trùng: nội dung đã có trong hệ thống */
    const key=(v.url||v.download||v.code||v.name).toLowerCase();
    const dup=big.some(s=>s.kind===k&&(DATA[s.node]||[]).some(o=>{const x=view(o,k);return [x.u,x.open,x.dl].filter(Boolean).some(z=>z.toLowerCase()===key)||(k==='script'&&x.c&&x.c.toLowerCase()===key)}));
    if(dup){er.textContent='Nội dung này đã có trong hệ thống.';er.hidden=false;return}
    const id='s_'+cyrb(k+'|'+key);
    const sg=Object.assign({kind:k,status:'pending',uid:u.uid,createdAt:SV_TS},v);
    btnState(send,'loading','ĐANG GỬI…');
    try{
      const up={};up['suggestions/'+id]=sg;up['rate/suggestions/'+u.uid]=SV_TS;
      await db.ref('nox_data').update(up);rateMark('s');btnState(send,'ok','ĐÃ GỬI');
      b.replaceChildren();const ok=el('div','fm-ok');ok.append(el('b',null,'Đã gửi đề xuất'),document.createElement('br'),el('small',null,'Đề xuất nằm trong hộp thư chờ duyệt. Khi Dev duyệt, nội dung sẽ xuất hiện trong danh mục.'));b.appendChild(ok);
      toast('ĐÃ GỬI ĐỀ XUẤT','Đang chờ Dev duyệt');
    }catch(e){btnState(send,'er','GỬI LẠI');er.textContent=e&&e.code==='PERMISSION_DENIED'?'Không gửi được: đề xuất này đã được gửi trước đó, hoặc bạn gửi quá nhanh (đợi 30 giây).':'Không gửi được: '+((e&&e.message)||'lỗi mạng')+'. Kiểm tra kết nối rồi thử lại.';er.hidden=false;setTimeout(()=>btnState(send,'',null),1500)}
  };
}

/* --- Music Studio: upload từ máy → Firebase Storage; Realtime DB chỉ giữ metadata + URL --- */
function upload(file,pathPrefix,maxMB,prog){
  return new Promise((res,rej)=>{
    if(!storage)return rej(new Error('Firebase Storage chưa sẵn sàng'));
    if(!/^audio\//.test(file.type))return rej(new Error('Không phải file âm thanh'));
    if(file.size>maxMB*1048576)return rej(new Error('File lớn hơn '+maxMB+' MB'));
    const path=pathPrefix+Date.now()+'_'+file.name.replace(/[^\w.-]+/g,'_').slice(-60),ref=storage.ref(path),task=ref.put(file,{contentType:file.type});
    task.on('state_changed',s=>prog&&prog(s.bytesTransferred/s.totalBytes),rej,async()=>{try{res({url:await ref.getDownloadURL(),path})}catch(e){rej(e)}});
  });
}

function easeBack(x){const c=1.70158+1,k=x-1;return 1+c*k*k*k+1.70158*k*k}

function frame(now){

  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt*(T<BOOM+3?TS:1);

  const intro=T<BOOM+.5,out=1-ss(T,5.6,6.9),tau=Math.max(0,T-LAUNCH);
  watchPerf(dt);
  t1.style.opacity=(ss(T,.6,2.4)*out*.85).toFixed(3);t2.style.opacity=(ss(T,1.6,3.6)*out).toFixed(3);
  if(T>BOOM+3.5&&!uiOn){uiOn=true;markSeen();brand.classList.add('on');hint.classList.add('on');side.classList.add('on');annTick()}
  const wantSkip=T<BOOM+2;if(wantSkip!==skipOn){skipOn=wantSkip;skipEl.hidden=!wantSkip}
  if(T<LAUNCH)launched=false;else if(!launched){launched=true;kick=1.6;navigator.vibrate&&navigator.vibrate(30)}
  /* Tự xoay: chỉ chạy khi người dùng không kéo / chạm / mở bảng; tự dừng khi có tương tác */
  const idle=T-lastInter>2.5&&!panelOpen&&ptrs.size===0&&!overlayOpen();
  if(!orb){yaw+=yv;pitch+=pv;yv*=.92;pv*=.92;yaw*=1-dt*.3;pitch*=1-dt*.3}
  if(auto&&idle&&T>BOOM+3){yaw+=(Math.sin(T*.4)*.8-yaw)*dt*.8;L.tyaw+=(Math.sin(T*.25)*.5-L.tyaw)*dt*.6}
  yaw=cl(yaw,-1,1);pitch=cl(pitch,-1,1);px+=(tx-px)*.04;py+=(ty-py)*.04;kick=Math.max(0,kick-dt*3);
  const live=ss(T,BOOM+2,BOOM+4);
  let thrust,spd=0;
  if(intro){
    const u=cl(tau/(BOOM-LAUNCH)),f=.3*(1-Math.exp(-5*u))/(1-Math.exp(-5))+.7*u*u,at=T>=LAUNCH?1:0;
    SHP.set(Math.sin(T*.5)*.4*ss(T,LAUNCH,LAUNCH+3),Math.sin(T*1.3)*.12*(1-ss(T,LAUNCH-.5,LAUNCH+1))+.5*Math.sin(T*.6)*ss(T,LAUNCH+2,LAUNCH+5),-79*f);
    ship.position.copy(SHP);ship.scale.setScalar(1.5);
    spd=ss(T,LAUNCH,LAUNCH+2.2)*(1+.35*ss(T,16,BOOM));
    thrust=.25+.7*ss(T,4.5,LAUNCH)+.8*Math.exp(-tau*1.5)*at+.3*ss(T,16,BOOM);
    ship.rotation.set(-.04+.06*Math.sin(T*.9)*spd+.25*Math.exp(-tau*2.5)*at,0,Math.sin(T*.7)*.25*ss(T,LAUNCH+1,LAUNCH+4)*(1-ss(T,19,BOOM)));
    let az,R,el2;
    if(T<LAUNCH){az=2.4*(1-ss(T,.6,LAUNCH-.4));R=15-4*ss(T,3.5,LAUNCH-1);el2=.28-.12*ss(T,3.5,LAUNCH)}
    else{const o=ss(T,10,19);az=6.2832*o;R=11+5*ss(T,LAUNCH,LAUNCH+1.2)-4*ss(T,LAUNCH+1.2,10.5)+2.5*Math.sin(o*Math.PI)-3*ss(T,19,BOOM);el2=.16+.16*Math.sin((T-10)*.6)*ss(T,10,12)*(1-ss(T,19,20.5))}
    if(T<.1)ANC.copy(SHP);
    const k=1-Math.exp(-dt*(T<LAUNCH?20:2.6));ANC.x+=(SHP.x-ANC.x)*k;ANC.y+=(SHP.y-ANC.y)*k;ANC.z+=(SHP.z-ANC.z)*k;
    const sh=.04+.1*ss(T,4.5,LAUNCH)+.12*Math.exp(-tau*1.2)*at+.05*spd;
    camera.position.set(ANC.x+R*Math.sin(az)*Math.cos(el2)+(Math.random()-.5)*sh,ANC.y+R*Math.sin(el2)+(Math.random()-.5)*sh,ANC.z+R*Math.cos(az)*Math.cos(el2));
    const fov=60+24*ss(T,LAUNCH,LAUNCH+2.5)+10*ss(T,17,BOOM)+kick*3;
    if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix()}
    camera.lookAt(SHP.x,SHP.y+.4,SHP.z-4*ss(T,LAUNCH,LAUNCH+2));camera.updateMatrixWorld();
  }else{
    thrust=.55;
    const z=4.5+2.5*ss(tb,0,3.2)+2.5*Math.exp(-tb*3),fov=60+20*(1-ss(tb,0,3))+kick*3,shake=.5*Math.exp(-tb*2);
    camera.position.set(Math.sin(T*.3)*live+(-yaw*4.5+px*.8)*live+(Math.random()-.5)*shake,BASE.y+Math.sin(T*.23)*.4*live+(pitch*2-py*.4)*live+(Math.random()-.5)*shake,z);
    if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix()}
    camera.lookAt(TARGET);
    if(live>0)applyLook(dt);camera.updateMatrixWorld();
    ship.scale.setScalar(.85);ship.rotation.set(0,0,Math.sin(T*.8)*.08-camera.position.x*.03);
    ship.position.set(camera.position.x*.85,camera.position.y-2.2+Math.sin(T*1.3)*.05,camera.position.z-7);
  }
  shipFX(dt,thrust,intro);
  const vf=intro?1-ss(tb,0,.15):0,spW=intro?.06+.3*ss(T,4.5,LAUNCH)+spd:0;
  windOff+=dt*spW*150;WNU.uOff.value=windOff;WNU.uLen.value=3+spW*26;WNU.uAmt.value=Math.min(1,spW*.6+.05)*vf;WNU.uT.value=T;WNU.uShip.value.copy(ship.position);
  ESU.uT.value=Math.max(0,T-ES0);ESU.uSuck.value=ss(T,17.5,BOOM-.2);ESU.uFade.value=vf;ESU.uShip.value.copy(ship.position);
  pad.visible=T<LAUNCH+1.2;pad.material.opacity=.7*(1-ss(T,LAUNCH-.3,LAUNCH+1));

  /* sao lao + lõi + vòng năng lượng */

  const pulseK=1+Math.sin(T*(8+ch*30))*.12*ch;
  const cs=boomed?(30*Math.exp(-tb*1.2)+2)*cl(1-tb/3.5):(1.2+camera.position.distanceTo(TARGET)*.03+ch*ch*14+P*3)*pulseK;
  core.scale.setScalar(Math.max(cs,.01));coreF.scale.setScalar(Math.max(cs*3.2,.01));
  coreF.material.opacity=boomed?.8*cl(1-tb/2):.5+ch*.5;
  rings.forEach((r,k)=>{const f=((ch*3.2)+k/3)%1,s=3+57*Math.pow(1-f,1.5);r.scale.set(s,s,1);r.material.opacity=boomed?0:ch*Math.sin(f*Math.PI)*.8});
  shock.visible=ts>0;if(ts>0){shock.scale.setScalar(ts*160+1);shock.material.opacity=.9*Math.exp(-ts*1.1)}
  DU.uT.value=boomed?tb-.7:-1;
  bgM.opacity=ss(tb,1.5,4.5)*.85;nebU.uO.value=.25+.75*ss(tb,1.5,5.5);nebU.uT.value=T;

  /* hậu kỳ: tụ lại → trắng toàn màn hình → mờ dần */
  const flash=boomed?(tb<.18?ss(tb,0,.18):(tb<1.1?1:1-ss(tb,1.1,4.8))):ch*ch*.25+.6*ss(T,BOOM-1,BOOM);
  let blur=ss(P,.15,1)*.2;if(boomed)blur=.16*Math.exp(-tb*2.2);
  ndc.copy(TARGET).project(camera);
  if(fx){const u=fx.uniforms;u.uC.value.set(ndc.x*.5+.5,ndc.y*.5+.5);u.uBlur.value=blur;u.uFlash.value=flash;
    u.uR.value=ts>0?ts*.8:0;u.uW.value=.05+(ts>0?ts*.03:0);u.uS.value=ts>0?Math.max(0,1-ts/2.6):0;
    u.uCA.value=boomed?.02*Math.exp(-Math.max(ts,0)*2):ss(P,.3,1)*.012}
  if(bloom){bloom.strength=((boomed?.5+.5*Math.exp(-tb*.9):.8+P*.8+ch*1.1)+flash*1.6+selK*.5)*BLOOMK;bloom.radius=boomed?.45:.6}

  /* vật lý sao: lò xo về bố cục đều + đẩy nhau + giới hạn mép */
  const act=big.filter(s=>s.vis&&s.x!==undefined),minD=cl(Math.min(W,H)*.26,100,190)*(act.length>6?.7:1);
  for(let a=0;a<act.length;a++)for(let b=a+1;b<act.length;b++){
    const p=act[a],q=act[b];let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.01;

  }

    const mx=Math.max(50,s.lw/2+10);
    if(s.x<mx){s.x=mx;s.vx=Math.max(0,s.vx)}const mxr=Math.max(mx,W<760?100:70);if(s.x>W-mxr){s.x=W-mxr;s.vx=Math.min(0,s.vx)}
    if(s.y<110){s.y=110;s.vy=Math.max(0,s.vy)}const yb=H-Math.max(176,H*.24);if(s.y>yb){s.y=yb;s.vy=Math.min(0,s.vy)}
  });

  /* sao lớn: hover/pop, trôi nhẹ, quỹ đạo, nhãn dưới sao */
  big.forEach((s,i)=>{
    if(!s.vis||s.x===undefined)return;

    s.hv+=(((s.held||hover===i)?1:0)-s.hv)*.15;s.pop=Math.max(0,s.pop-dt*1.8);s.sl+=((selIdx===i?1:0)-s.sl)*.1;
