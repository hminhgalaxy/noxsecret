<script>
/* ===== CẤU HÌNH — điền giá trị thật của dự án ===== */
const GOOGLE_CLIENT_ID="971947846929-as186hmb8lmv293t79gfF4lrhp215kka.apps.googleusercontent.com";
const DB_URL="https://YOUR-PROJECT-default-rtdb.firebaseio.com"; // databaseURL Firebase của bạn
const API="/api"; // vercel.json rewrite /api/* → backend, giúp cookie đăng nhập hoạt động cùng domain

const $=id=>document.getElementById(id);
const BASE=["SCRIPT","APK","IOS","LINK"],BN={SCRIPT:"Script",APK:"APK",IOS:"iOS",LINK:"Link"},PAGE=24;
const DEFACT={SCRIPT:["detail","copy"],APK:["detail","download","open"],IOS:["detail","open","download"],LINK:["detail","open"]};
let me=null,authReady=false,games={},cats={},all=[],limit=PAGE,view="home",curType="",curGame="",sortBy="new",editing=null,gal=[],curPosts={},myVotes={},openId=null,loadKey="";

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}};
const imgSrc=v=>/^img:[\w-]{1,40}$/.test(v||"")?API+"/img/"+v.slice(4):safeUrl(v);
const fmt=t=>new Date(t).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"});
const avatar=(n,pic,big)=>`<span class="av${big?" l":""}">${esc((n||"?").trim().charAt(0).toUpperCase())}${safeUrl(pic)?`<img src="${esc(safeUrl(pic))}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">`:""}</span>`;
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)}
/* idle|loading|success|empty|error — lỗi chỉ hiện vòng tròn và tự thử lại */
function region(el,state,msg,retry){
  clearTimeout(el._rt);el.dataset.state=state;
  if(state==="success"){el._n=0;return}
  if(state==="empty"){el._n=0;el.innerHTML='<div class="st">'+esc(msg)+'</div>';return}
  el.innerHTML='<div class="st"><div class="sp"></div></div>';
  if(state==="error"){console.warn(msg);el._n=(el._n||0)+1;el._rt=setTimeout(retry,Math.min(2500*el._n,15000))}
}
const closeM=m=>m.classList.remove("on");

/* ===== Dữ liệu ===== */
async function dbGet(path,qs=""){
  const r=await fetch(DB_URL+"/"+path+".json"+qs);
  if(!r.ok)throw new Error("DB "+r.status);
  return r.json();
}
async function api(path,method="GET",body){
  const r=await fetch(API+path,{method,credentials:"include",headers:{"Content-Type":"application/json","X-Skibidi":"1"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));

  if(!r.ok)throw new Error(j.error||"Lỗi máy chủ ("+r.status+")");
  return j;
}

function shrink(file){
  return new Promise((ok,no)=>{
    const i=new Image(),u=URL.createObjectURL(file);
    i.onload=()=>{
      URL.revokeObjectURL(u);let d="";
      for(const[max,q]of[[1000,.82],[800,.65],[600,.55]]){
        const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
        c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
        d=c.toDataURL("image/jpeg",q);if(d.length<520000)break;
      }
      ok(d);
    };
    i.onerror=()=>no(new Error("Không đọc được ảnh"));i.src=u;
  });
}
async function pickImg(inp,kind){

  formMsg.textContent="Đang tải ảnh lên…";
  try{
    const r=await api("/upload","POST",{data:await shrink(f)});
    if(kind==="thumb"){fThumb.value=r.id;prevThumb()}else{gal.push(r.id);renderGal()}

  try{const r=await api("/posts","POST",b);formMsg.textContent="";closeM(mForm);toast(r.message);loadPosts();if(view==="mine")loadMine()}
  catch(e){formMsg.textContent=e.message}
}
async function loadMine(){
  const el=$("mine");if(!me)return;region(el,"loading");
  try{
    const {posts}=await api("/me/posts");
    if(!posts.length)return region(el,"empty","Bạn chưa có bài nào.");
    window._mine=Object.fromEntries(posts.map(p=>[p.id,p]));region(el,"success");
    el.innerHTML=posts.map(p=>`<div class="item"><div><b>${esc(p.title)}</b> ${badge(p.type)} <span class="tag">${esc(p.status)}</span>
    <div class="mu">Tạo ${fmt(p.createdAt)}${p.updatedAt?" · Sửa "+fmt(p.updatedAt):""}${p.rejectReason?" · Lý do: "+esc(p.rejectReason):""}</div></div>
    <div class="row" style="margin:0">${p.locked?'<span class="mu">Đã khóa</span>':`<button onclick="openForm(_mine['${esc(p.id)}'])">Sửa</button><button class="danger" onclick="delMine('${esc(p.id)}')">Xóa</button>`}</div></div>`).join("");
  }catch(e){region(el,"error",e.message,loadMine)}
}
async function delMine(id){if(!confirm("Xóa bài này?"))return;try{await api("/posts/"+id,"DELETE");toast("Đã xóa");loadMine();loadPosts()}catch(e){toast(e.message)}}
async function loadLiked(){
  const el=$("liked");if(!me)return;region(el,"loading");
  try{
    const {posts}=await api("/me/likes");
    if(!posts.length)return region(el,"empty","Bạn chưa thả tim bài nào.");
    posts.forEach(p=>curPosts[p.id]=p);region(el,"success");el.innerHTML=posts.map(cardHtml).join("");
  }catch(e){region(el,"error",e.message,loadLiked)}
}

/* ===== Dev Panel (mọi thao tác kiểm tra quyền ở backend) ===== */
let devTab="pending";
const DT={pending:"Chờ duyệt",all:"Tất cả bài",games:"Game",cats:"Mục",reports:"Báo cáo",settings:"Cài đặt"};
function openDev(){$("mDev").classList.add("on");devRender()}
async function devRender(){
  if(!$("mDev").classList.contains("on"))return;
  const box=$("devBox");
  box.innerHTML=`<div class="row" style="margin-top:0"><b>Dev Panel</b>${Object.entries(DT).map(([t,l])=>`<button class="${devTab===t?"pri":""}" onclick="devTab='${t}';devRender()">${l}</button>`).join("")}<button onclick="closeM(mDev)">Đóng</button></div><div id="devBody"></div>`;
  const body=$("devBody");region(body,"loading");
  try{
    if(devTab==="pending"||devTab==="all"){
      const {posts}=await api("/dev/posts"+(devTab==="pending"?"?status=pending":""));
      if(!posts.length)return region(body,"empty","Không có bài nào.");
      window._dp=Object.fromEntries(posts.map(p=>[p.id,p]));region(body,"success");
      body.innerHTML=posts.map(p=>`<div class="item"><div><b>${esc(p.title)}</b> ${badge(p.type)} <span class="tag">${esc(p.status)}</span><div class="mu">${esc(p.authorName)} · ${esc(p.authorId||"")}</div></div>
      <div class="row" style="margin:0">${["published","rejected","hidden"].map(s=>`<button onclick="devSet('${esc(p.id)}',{status:'${s}'})">${s}</button>`).join("")}
      <button onclick="devSet('${esc(p.id)}',{featured:${!p.featured}})">★</button><button onclick="devSet('${esc(p.id)}',{pinned:${!p.pinned}})">Ghim</button><button onclick="devSet('${esc(p.id)}',{locked:${!p.locked}})">Khóa</button>
      <button onclick="openForm(_dp['${esc(p.id)}'])">Sửa</button><button class="danger" onclick="devDel('${esc(p.id)}')">Xóa</button></div></div>`).join("");
    }else if(devTab==="games"){
      const {games:g}=await api("/dev/games");region(body,"success");
      body.innerHTML=`<div class="row"><input id="gN" placeholder="Tên game"><input id="gI" placeholder="Ảnh (https hoặc img:ID)"><input id="gD" placeholder="Mô tả"><input id="gO" type="number" placeholder="Thứ tự" style="width:90px"><button class="pri" onclick="devGame()">Thêm</button></div>`+
      g.map(x=>`<div class="item"><span>${esc(x.name)} <span class="mu">(${x.count||0} bài${x.published===false?" · ẩn":""})</span></span><div class="row" style="margin:0"><button onclick="devGame('${esc(x.id)}',{published:${x.published===false}})">${x.published===false?"Xuất bản":"Ẩn"}</button><button onclick="devGame('${esc(x.id)}',{name:prompt('Tên mới',${JSON.stringify(x.name).replace(/"/g,"&quot;")})||undefined})">Đổi tên</button><button class="danger" onclick="devGameDel('${esc(x.id)}')">Xóa</button></div></div>`).join("");
    }else if(devTab==="cats"){
      region(body,"success");
      body.innerHTML=catIds().map(c=>{const a=catActions(c);return `<div class="item"><b>${esc(catName(c))}</b><div class="row" style="margin:0">${[["copy","Sao chép"],["open","Mở"],["download","Tải xuống"]].map(([k,l])=>`<label class="mu" style="display:flex;gap:4px;align-items:center"><input type="checkbox" style="width:auto" data-c="${c}" value="${k}" ${a.includes(k)?"checked":""}>${l}</label>`).join("")}<button onclick="saveCat('${c}')">Lưu</button>${BASE.includes(c)?"":`<button class="danger" onclick="delCat('${c}')">Xóa</button>`}</div></div>`}).join("");
    }else if(devTab==="reports"){
      const {reports}=await api("/dev/reports");
      if(!reports.length)return region(body,"empty","Không có báo cáo.");
      region(body,"success");
      body.innerHTML=reports.map(r=>`<div class="item"><span>${esc(r.reason)} <span class="mu">— bài ${esc(r.postId)}</span></span><button onclick="api('/dev/reports/${esc(r.id)}','DELETE').then(devRender)">Đã xử lý</button></div>`).join("");
    }else{
      const s=await api("/dev/settings");region(body,"success");
      body.innerHTML=`<label class="row"><input type="checkbox" id="sMod" style="width:auto" ${s.moderation!==false?"checked":""}> Bật kiểm duyệt bài mới</label><div class="row"><input id="sAnn" placeholder="Thông báo" value="${esc(s.announcement||"")}"><button class="pri" onclick="api('/dev/settings','POST',{moderation:sMod.checked,announcement:sAnn.value}).then(()=>toast('Đã lưu'))">Lưu</button></div>`;
    }
  }catch(e){region(body,"error",e.message,devRender)}
}
async function saveCat(c){
  const a=[...document.querySelectorAll(`input[data-c="${c}"]:checked`)].map(i=>i.value);
  try{cats[c]=await api("/dev/categories/"+c,"POST",{actions:a});fillCats();toast("Đã lưu")}catch(e){toast(e.message)}
}
async function delCat(c){if(!confirm("Xóa mục này?"))return;try{await api("/dev/categories/"+c,"DELETE");delete cats[c];fillCats();devRender()}catch(e){toast(e.message)}}
const devSet=async(id,b)=>{try{await api("/dev/posts/"+id,"POST",b);devRender();loadPosts()}catch(e){toast(e.message)}};
const devDel=async id=>{if(!confirm("Xóa vĩnh viễn?"))return;try{await api("/posts/"+id,"DELETE");devRender();loadPosts()}catch(e){toast(e.message)}};
async function devGame(id,patch){
  try{await api("/dev/games","POST",patch?{id,...patch}:{name:gN.value,img:gI.value,desc:gD.value,order:+gO.value||0});devRender();loadGames()}catch(e){toast(e.message)}
}
async function devGameDel(id){if(!confirm("Xóa game?"))return;try{await api("/dev/games/"+id,"DELETE");devRender();loadGames()}catch(e){toast(e.message)}}

/* ===== Hiện dần khi cuộn tới ===== */
const io=new IntersectionObserver(es=>{let i=0;es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.style.transitionDelay=(i++%6)*70+"ms";t.classList.add("in");io.unobserve(t);setTimeout(()=>t.style.transitionDelay="",1000)})},{threshold:.08,rootMargin:"0px 0px -30px 0px"});
function scan(){document.querySelectorAll(".card:not(.seen),.item:not(.seen)").forEach(n=>{n.classList.add("seen");io.observe(n)})}
new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});

/* ===== Khởi động: giao diện hiện ngay, mỗi vùng tự tải ===== */
const qp=new URLSearchParams(location.search).get("q");if(qp)$("q").value=qp;
renderNav();renderPop();restore();loadCats();loadGames().then(()=>loadPosts()).then(openFromHash);
</script>
</body>
