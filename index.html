<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEW ARENA</title>
<style>
:root{--bg:#f6f7fb;--fg:#12151c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--fg:#e8ecf4}}
:root[data-theme="dark"]{--bg:#0b0d12;--fg:#e8ecf4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.site{max-width:720px;margin:0 auto;padding:12vh 24px}
.site h1{font-size:clamp(28px,6vw,48px);margin:0 0 12px}
.site p{opacity:.75;line-height:1.6}

/* ===== INTRO LAYER (đã scope bằng #arena-intro) ===== */
#arena-intro{position:fixed;inset:0;z-index:2147483000;background:#000;overflow:hidden;touch-action:none;transition:opacity 1.8s ease;contain:strict;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#arena-intro canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ai-title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;opacity:0;pointer-events:none;padding:0 5vw;font-weight:600;letter-spacing:.32em;text-indent:.32em;text-shadow:0 0 22px rgba(110,160,255,.65)}
#ai-title div:first-child{font-size:clamp(13px,3.2vw,26px);opacity:.85;margin-bottom:.9em}
#ai-title div:last-child{font-size:clamp(24px,7.4vw,72px);font-weight:700}
.ai-label{position:absolute;left:0;top:0;white-space:nowrap;color:#fff;font-weight:500;font-size:clamp(10px,.9vw + 6px,13px);line-height:14px;letter-spacing:.28em;text-indent:.28em;text-shadow:0 1px 8px #000,0 0 3px #000;opacity:0;transition:opacity 1.4s;pointer-events:none;will-change:transform}
.ai-label.on{opacity:.95}
#ai-logo{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;width:52px;height:52px;opacity:0;animation:aiIn 1.6s ease 1.2s forwards;pointer-events:none}
#ai-logo svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(120,170,255,.8));animation:aiGlow 3.2s ease-in-out infinite}
#ai-logo .ring{transform-origin:26px 26px;animation:aiSpin 9s linear infinite}
#ai-logo .s{stroke-dasharray:100;animation:aiDraw 4.2s ease-in-out infinite}
#ai-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:11px;font-weight:500;letter-spacing:.6em;text-indent:.6em;color:#fff;opacity:0;animation:aiFoot 2.4s ease 2s forwards;pointer-events:none}
#ai-brand{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:76px;height:52px;display:flex;align-items:center;color:#fff;font-weight:600;font-size:13px;letter-spacing:.38em;opacity:0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 0 12px rgba(120,170,255,.6)}
#ai-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);text-align:center;color:#fff;font-size:10px;letter-spacing:.2em;line-height:1.7;padding:0 8vw;opacity:0;transition:opacity 1.6s;pointer-events:none}
#ai-brand.on{opacity:.9}#ai-hint.on{opacity:.5}
#ai-card{position:absolute;z-index:3;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);min-width:190px;max-width:86vw;padding:11px 18px;text-align:center;color:#fff;background:rgba(12,16,28,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:14px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#ai-card.on{opacity:1;transform:translate(-50%,0)}
#ai-card b{display:block;font-size:14px;letter-spacing:.3em;text-indent:.3em;margin-bottom:6px}
#ai-card span{font-size:12px;opacity:.8;line-height:1.5}
.ai-label.hot{opacity:1;text-shadow:0 0 12px rgba(160,200,255,.95),0 1px 8px #000}
#arena-intro{--a1:#7fe9ff;--a2:#b69cff}
#ai-logo{left:26px;top:calc(env(safe-area-inset-top,0px) + 26px)}
#ai-brand{left:88px;top:calc(env(safe-area-inset-top,0px) + 26px)}
#ai-hint{left:auto;right:26px;bottom:auto;top:calc(env(safe-area-inset-top,0px) + 30px);text-align:right;max-width:42vw;padding:0;line-height:1.9}
#ai-foot{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#ai-frame i{position:absolute;z-index:2;width:20px;height:20px;border:0 solid var(--a1);opacity:0;pointer-events:none;animation:aiFr 2s ease 2.4s forwards}
#ai-frame i:nth-child(1){top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;border-width:1.5px 0 0 1.5px;border-top-left-radius:7px}
#ai-frame i:nth-child(2){top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;border-width:1.5px 1.5px 0 0;border-top-right-radius:7px}
#ai-frame i:nth-child(3){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:10px;border-width:0 0 1.5px 1.5px;border-bottom-left-radius:7px}
#ai-frame i:nth-child(4){bottom:calc(env(safe-area-inset-bottom,0px) + 10px);right:10px;border-width:0 1.5px 1.5px 0;border-bottom-right-radius:7px}
@keyframes aiFr{to{opacity:.55}}
#ai-dock,#ai-side{position:absolute;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);transform:translate(-50%,16px);display:flex;gap:4px;padding:6px;border-radius:28px;border:1px solid transparent;background:linear-gradient(rgba(12,16,32,.62),rgba(12,16,32,.62)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 26px rgba(120,160,255,.18);opacity:0;pointer-events:none;transition:opacity 1s,transform 1s}
#ai-dock.on,#ai-side.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ai-btn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#dfe8ff;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .25s,transform .2s,color .25s,box-shadow .25s}
.ai-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ai-btn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.ai-btn:active{transform:scale(.9)}
.ai-btn:focus-visible{outline:2px solid var(--a1);outline-offset:1px}
.ai-btn.act{color:#06101c;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 0 16px var(--a1)}
#ai-card{background:linear-gradient(rgba(12,16,32,.62),rgba(12,16,32,.62)) padding-box,linear-gradient(135deg,var(--a1),var(--a2)) border-box;border:1px solid transparent;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.ai-label{padding:4px 10px;border-radius:999px;background:rgba(10,14,28,.4);border:1px solid var(--lc,rgba(255,255,255,.25))}
.ai-label.hot{background:rgba(20,28,56,.65)}
[hidden]{display:none!important}
#ai-side{left:auto;bottom:auto;right:14px;top:calc(50% + 20px);flex-direction:column;transform:translate(16px,-50%)}
#ai-side.on{transform:translate(0,-50%)}
#ai-panel{position:absolute;z-index:6;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;color:#fff;border-radius:28px;opacity:0;pointer-events:none;--pc:#7fe9ff;--pca:rgba(127,233,255,.3);right:18px;top:50%;width:min(430px,44vw);height:min(80vh,720px);transform:translate(50px,-50%) scale(.94);background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 45%,rgba(255,255,255,.11));backdrop-filter:blur(26px) saturate(185%);-webkit-backdrop-filter:blur(26px) saturate(185%);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -1px 1px rgba(255,255,255,.12),0 24px 70px rgba(0,0,0,.55),0 0 60px var(--pca);transition:transform .75s cubic-bezier(.2,.9,.25,1.08),opacity .45s ease}
.pOpen #ai-panel{opacity:1;pointer-events:auto;transform:translate(0,-50%) scale(1)}
#ai-panel::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.3),transparent 28%,transparent 72%,rgba(255,255,255,.1));mix-blend-mode:screen;opacity:.45}
.pg{position:absolute;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 22% 14%,var(--pca),transparent 42%),radial-gradient(circle at 82% 88%,rgba(167,123,255,.3),transparent 48%);animation:pgm 14s ease-in-out infinite alternate}
@keyframes pgm{to{transform:translate(6%,-5%) rotate(14deg) scale(1.1)}}
@media (max-width:759px){#ai-panel{right:10px;left:10px;width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:min(62vh,540px);transform:translateY(60px) scale(.96);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%)}.pOpen #ai-panel{transform:translateY(0) scale(1)}}
.pOpen #ai-dock,.pOpen #ai-side,.pOpen #ai-hint{opacity:0!important;pointer-events:none!important}
#ai-panel header{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
#ph-ico{width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--pc);box-shadow:0 0 18px var(--pca)}
#ai-panel header div{flex:1;min-width:0}#ph-t{display:block;font-size:15px;letter-spacing:.3em}#ph-c{font-size:11px;opacity:.7}
.pbtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pbar{display:flex;gap:8px;padding:6px 16px}
#ph-q{flex:1;min-width:0;height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.28);color:#fff;font:inherit;font-size:14px;outline:0}
#ph-q:focus{border-color:var(--pc);box-shadow:0 0 14px var(--pca)}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap;align-self:center}
.chip.on{background:var(--pc);color:#06101c;border-color:transparent;font-weight:600}
#ph-chips{display:flex;gap:6px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#ai-list{flex:1;overflow-y:auto;padding:4px 14px 16px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.it{padding:12px 14px;margin-bottom:10px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);animation:itIn .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes itIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
.it-top{display:flex;align-items:center;gap:10px}.it-ic{width:38px;height:38px;border-radius:10px;object-fit:cover}
.it-t{min-width:0}.it-t b{display:block;font-size:14px;overflow-wrap:anywhere}.it-t small{font-size:11px;opacity:.65}
.it-d{margin:8px 0 0;font-size:12.5px;line-height:1.5;opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-a{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ab{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:#fff;font:inherit;font-size:12px;cursor:pointer;transition:background .2s,transform .15s}
.ab:hover{background:var(--pca)}.ab:active{transform:scale(.94)}.ab.dng{border-color:#ff6b81;color:#ff9aa8}
.it-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:10px;font-size:11.5px}.it-kv .k{opacity:.55}.it-kv .v{overflow-wrap:anywhere}
.empty{padding:36px 12px;text-align:center;font-size:13px;opacity:.7;line-height:1.6}
#ai-ed{position:absolute;inset:0;z-index:3;display:none;flex-direction:column;gap:10px;padding:16px;background:rgba(8,10,22,.85);backdrop-filter:blur(10px)}
#ai-ed.on{display:flex}#ed-t{flex:1;resize:none;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.35);color:#fff;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px;outline:0}
@keyframes aiIn{to{opacity:1}}
@keyframes aiFoot{to{opacity:.28}}
@keyframes aiSpin{to{transform:rotate(360deg)}}
@keyframes aiGlow{50%{filter:drop-shadow(0 0 12px rgba(160,140,255,.95))}}
@keyframes aiDraw{0%{stroke-dashoffset:100}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
</style>
</head>

<script>
(function(){
const root=document.getElementById('arena-intro');
const htmlEl=document.documentElement, prevOv=htmlEl.style.overflow;
htmlEl.style.overflow='hidden';

/* ===== CẤU HÌNH: sửa tên sao tại đây ===== */
const STARS=[['SCRIPT',0x3dff9a],['APK',0xffa24a],['iOS',0xff6fb5],['LINK',0x4da3ff]];
const LAND=[[-.62,.28],[-.2,-.14],[.2,.28],[.62,-.14]];
const PORT=[[-.42,.42],[.42,.28],[-.42,-.1],[.42,-.22]];

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(x,a,b)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isM=innerWidth<720||matchMedia('(pointer:coarse)').matches;
let done=false,raf=0;

function finish(){root.insertAdjacentHTML('beforeend','<div style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:600 14px system-ui;letter-spacing:.3em">NEW ARENA</div>')}

let renderer,scene,camera,composer,bloom,fx;
if(!window.THREE){finish();return;}
const PR=Math.min(devicePixelRatio||1,isM?1.5:1.75);
try{
  renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
}catch(e){finish();return;}
renderer.setPixelRatio(PR);renderer.setClearColor(0x000000,1);
root.insertBefore(renderer.domElement,root.firstChild);
scene=new THREE.Scene();

function sndOn(){
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();
    const g=ac.createGain();g.gain.value=0;g.connect(ac.destination);
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;f.connect(g);
    [55,82.4,110.3].forEach((fr,k)=>{const o=ac.createOscillator();o.type=k?'sine':'sawtooth';o.frequency.value=fr;const og=ac.createGain();og.gain.value=k?.5:.25;o.connect(og);og.connect(f);o.start();
      const l=ac.createOscillator();l.frequency.value=.07+k*.04;const lg=ac.createGain();lg.gain.value=15;l.connect(lg);lg.connect(o.detune);l.start()});
    amb=g}
  ac.resume();amb.gain.setTargetAtTime(.09,ac.currentTime,.8);return true;
}
function sndOff(){amb&&amb.gain.setTargetAtTime(0,ac.currentTime,.3)}
function sfx(i){
  if(!snd||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type='sine';o.frequency.value=330*Math.pow(1.122,i*2);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);

}

    if(isAdmin){const ar=el('div','it-a'),e1=el('button','ab','Sửa'),e2=el('button','ab dng','Xóa');e1.onclick=()=>edit(x.o);e2.onclick=()=>del(x.o);ar.append(e1,e2);it.appendChild(ar)}}
  return it;
}
function renderList(){
  const an=firstAnim;firstAnim=false;const {all,r}=items();
  P.c.textContent=ERR[selIdx]?'—':r.length+'/'+all.length+' mục';
  const tags=[...new Set(all.map(x=>x.g).filter(Boolean))].slice(0,8);
  P.chips.replaceChildren();P.chips.hidden=!tags.length;
  [''].concat(tags).forEach(t=>{const b=el('button','chip'+(t===tagF?' on':''),t||'Tất cả');b.onclick=()=>{tagF=t;renderList()};P.chips.appendChild(b)});
  P.list.replaceChildren();
  if(ERR[selIdx]){const m={nocfg:'Chưa cấu hình Firebase. Mở file index.html và điền NOX_CONFIG ở đầu trang.',PERMISSION_DENIED:'Không có quyền đọc dữ liệu. Hãy đăng nhập Google hoặc kiểm tra Rules.',init:'Không khởi tạo được Firebase.'};P.list.appendChild(el('div','empty',m[ERR[selIdx]]||'Lỗi tải dữ liệu: '+ERR[selIdx]));return}
  if(DATA[selIdx]===null){P.list.appendChild(el('div','empty','Đang tải dữ liệu…'));return}
  if(!r.length){P.list.appendChild(el('div','empty',all.length?'Không tìm thấy kết quả phù hợp.':'Danh mục này chưa có dữ liệu.'));return}
  r.forEach((x,n)=>P.list.appendChild(mkCard(x,n,an)));
}
function selectStar(i){
  const s=big[i];poke(s,i);if(!panelOpen)saved=[L.tyaw,L.tpitch,L.tdolly,L.tpx,L.tpy];
  selIdx=i;panelOpen=true;tagF='';P.q.value='';openKey=null;firstAnim=true;P.ed.classList.remove('on');
  const cc=new THREE.Color(STARS[i][1]);P.el.style.setProperty('--pc','#'+cc.getHexString());P.el.style.setProperty('--pca','rgba('+(cc.r*255|0)+','+(cc.g*255|0)+','+(cc.b*255|0)+',.3)');
  P.t.textContent=STARS[i][0];P.ico.src=s.icon;root.classList.add('pOpen');P.el.setAttribute('aria-hidden','false');loginUI();renderList();focusOn(s);
}
function closePanel(){
  if(!panelOpen)return;panelOpen=false;selIdx=-1;root.classList.remove('pOpen');P.el.setAttribute('aria-hidden','true');P.ed.classList.remove('on');
  if(saved&&obs){[L.tyaw,L.tpitch,L.tdolly,L.tpx,L.tpy]=saved}saved=null;loginUI();
}
function tpl(){const f=(DATA[selIdx]||[])[0],t={};if(!f)return{name:'',url:''};Object.keys(f).forEach(k=>{if(k!=='_k')t[k]=''});return t}
function edit(o){edKey=o?o._k:null;const c=Object.assign({},o||tpl());delete c._k;P.edt.value=JSON.stringify(c,null,2);P.ed.classList.add('on')}
function del(o){if(db&&confirm('Xóa mục này?'))db.ref('nox_data/'+NODES[selIdx]+'/'+o._k).remove().catch(e=>toast('XÓA THẤT BẠI',e.code||''))}
$('ph-x').onclick=$('ph-b').onclick=closePanel;$('ph-add').onclick=()=>edit(null);$('ed-cancel').onclick=()=>P.ed.classList.remove('on');
$('ed-save').onclick=async()=>{let v;try{v=JSON.parse(P.edt.value)}catch(e){toast('JSON LỖI',e.message);return}
  try{const ref=db.ref('nox_data/'+NODES[selIdx]);edKey?await ref.child(edKey).set(v):await ref.push(v);P.ed.classList.remove('on');toast('ĐÃ LƯU','Dữ liệu đã cập nhật')}catch(e){toast('LƯU THẤT BẠI',e.code||e.message)}};
P.q.oninput=renderList;$('ph-s').onclick=function(){az=!az;this.textContent=az?'Mới nhất':'A→Z';renderList()};
initFB();

function easeBack(x){const c=1.70158+1,k=x-1;return 1+c*k*k*k+1.70158*k*k}

function frame(now){
  if(done)return;raf=requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  const tb=T-BOOM,boomed=tb>=0,ts=tb-.9,P=cl((T-WS)/WD),ch=ss(T,BOOM-2.4,BOOM);
  const out=1-ss(T,4.2,5.4);
  t1.style.opacity=(ss(T,.6,2.2)*out*.85).toFixed(3);t2.style.opacity=(ss(T,1.6,3.4)*out).toFixed(3);
  if(T>BOOM+3.5&&!uiOn){uiOn=true;brand.classList.add('on');hint.classList.add('on');dock.classList.add('on');side.classList.add('on')}

  /* camera chase + orbit */
  if(!orb){yaw+=yv;pitch+=pv;yv*=.92;pv*=.92;yaw*=1-dt*.3;pitch*=1-dt*.3}
  if(auto&&!orb)yaw+=(Math.sin(T*.4)*.8-yaw)*dt*.8;yaw=cl(yaw,-1,1);pitch=cl(pitch,-1,1);px+=(tx-px)*.04;py+=(ty-py)*.04;kick=Math.max(0,kick-dt*3);
  const live=ss(T,BOOM+2,BOOM+4);
  let z=9-2*ss(T,0,WS)-2.5*ss(T,WS,BOOM),fov=60+20*ss(T,WS+1.5,BOOM-.2),shake=ch*.14;
  if(boomed){z=4.5+2.5*ss(tb,0,3.2)+2.5*Math.exp(-tb*3);fov=60+20*(1-ss(tb,0,3));shake=.5*Math.exp(-tb*2)}
  fov+=kick*3;
  camera.position.set(Math.sin(T*.3)*live+(-yaw*4.5+px*.8)*live+(Math.random()-.5)*shake,BASE.y+Math.sin(T*.23)*.4*live+(pitch*2-py*.4)*live+(Math.random()-.5)*shake,z);
  if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix()}
  camera.lookAt(TARGET);
  if(live>0)applyLook(dt);camera.updateMatrixWorld();
  ship.position.set(camera.position.x*.85,camera.position.y-2.2+Math.sin(T*1.3)*.05,camera.position.z-7);
  ship.rotation.z=Math.sin(T*.8)*.08-camera.position.x*.03;
  const ef=1.2+Math.sin(T*30)*.1+P*1.6;eng.scale.set(ef,ef,1);

  /* sao lao + lõi + vòng năng lượng */
  WU.uP.value=P;WU.uTrail.value=ss(P,0,.5)*.14;WU.uFade.value=boomed?0:1;
  const pulseK=1+Math.sin(T*(8+ch*30))*.12*ch;
  const cs=boomed?(30*Math.exp(-tb*1.2)+2)*cl(1-tb/3.5):(1.5+ch*ch*14+P*3)*pulseK;
  core.scale.setScalar(Math.max(cs,.01));coreF.scale.setScalar(Math.max(cs*3.2,.01));
  coreF.material.opacity=boomed?.8*cl(1-tb/2):.5+ch*.5;
  rings.forEach((r,k)=>{const f=((ch*3.2)+k/3)%1,s=3+57*Math.pow(1-f,1.5);r.scale.set(s,s,1);r.material.opacity=boomed?0:ch*Math.sin(f*Math.PI)*.8});
  shock.visible=ts>0;if(ts>0){shock.scale.setScalar(ts*160+1);shock.material.opacity=.9*Math.exp(-ts*1.1)}
  DU.uT.value=boomed?tb-.7:-1;
  bgM.opacity=ss(tb,1.5,4.5)*.85;nebU.uO.value=.25+.75*ss(tb,1.5,5.5);nebU.uT.value=T;

  /* hậu kỳ: tụ lại → trắng toàn màn hình → mờ dần */
  const flash=boomed?(tb<.18?ss(tb,0,.18):(tb<1.1?1:1-ss(tb,1.1,4.8))):ch*ch*.3;
  let blur=ss(P,.15,1)*.2;if(boomed)blur=.16*Math.exp(-tb*2.2);
  ndc.copy(TARGET).project(camera);
  if(fx){const u=fx.uniforms;u.uC.value.set(ndc.x*.5+.5,ndc.y*.5+.5);u.uBlur.value=blur;u.uFlash.value=flash;
    u.uR.value=ts>0?ts*.8:0;u.uW.value=.05+(ts>0?ts*.03:0);u.uS.value=ts>0?Math.max(0,1-ts/2.6):0;
    u.uCA.value=boomed?.02*Math.exp(-Math.max(ts,0)*2):ss(P,.3,1)*.012}
  if(bloom){bloom.strength=(boomed?.5+.5*Math.exp(-tb*.9):.8+P*.8+ch*1.1)+flash*1.6+selK*.5;bloom.radius=boomed?.45:.6}

  /* vật lý sao: lò xo về bố cục đều + đẩy nhau + giới hạn mép */
  const act=big.filter(s=>s.vis&&s.x!==undefined),minD=cl(Math.min(W,H)*.26,100,190);
  for(let a=0;a<act.length;a++)for(let b=a+1;b<act.length;b++){
    const p=act[a],q=act[b];let dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||.01;
    if(d<minD){const f=(minD-d)*18*dt/d;dx*=f;dy*=f;if(!p.held){p.vx-=dx;p.vy-=dy}if(!q.held){q.vx+=dx;q.vy+=dy}}
  }
  const dr=Math.min(W,H)*.018;
  act.forEach((s,i)=>{
    if(!s.held){s.vx+=((s.ax-s.x)*1.2-s.vx*2.2)*dt;s.vy+=((s.ay-s.y)*1.2-s.vy*2.2)*dt;s.x+=s.vx*dt;s.y+=s.vy*dt}
    const mx=Math.max(50,s.lw/2+10);
    if(s.x<mx){s.x=mx;s.vx=Math.max(0,s.vx)}const mxr=Math.max(mx,W<760?100:70);if(s.x>W-mxr){s.x=W-mxr;s.vx=Math.min(0,s.vx)}
    if(s.y<110){s.y=110;s.vy=Math.max(0,s.vy)}const yb=H-Math.max(176,H*.24);if(s.y>yb){s.y=yb;s.vy=Math.min(0,s.vy)}
  });

  /* sao lớn: hover/pop, trôi nhẹ, quỹ đạo, nhãn dưới sao */
  big.forEach((s,i)=>{
    if(!s.vis||s.x===undefined)return;
    const lt=cl((T-(BOOM+2+i*.25))/1.6);
    s.hv+=(((s.held||hover===i)?1:0)-s.hv)*.15;s.pop=Math.max(0,s.pop-dt*1.8);s.sl+=((selIdx===i?1:0)-s.sl)*.1;
    const sm=1+.3*s.hv+.45*Math.sin(s.pop*Math.PI)+.22*s.sl,sc=lt>0?easeBack(lt)*s.r*sm:0;
    const rx=s.x+Math.sin(T*.35+i*1.7)*dr,ry=s.y+Math.cos(T*.28+i*2.3)*dr;
    vv.set(rx/W*2-1,1-ry/H*2,.5).unproject(lay).sub(lay.position).normalize();
    s.g.position.copy(lay.position).addScaledVector(vv,s.dist);
    s.g.scale.setScalar(Math.max(sc,1e-4));
    s.m.rotation.y+=dt*(.3+s.hv*1.2);s.m.material.uniforms.uTime.value+=dt*(1+s.hv*2);
    s.o.rotation.y+=dt*(.5+s.hv*1.5);if(s.lg){const k=2.2*(1+.04*Math.sin(T*2+i));s.lg.scale.setScalar(k);s.lg2.scale.setScalar(k);s.lg.material.rotation=s.lg2.material.rotation=Math.sin(T*.7+i)*.07;s.lg2.material.opacity=Math.min(1,.18*s.hv+.9*s.sl);s.en.material.rotation+=dt*(.6+s.sl*1.6);s.en.material.opacity=.5+.4*s.sl}s.ma+=dt*(1.4+s.hv*2);s.mo.position.set(Math.cos(s.ma)*1.76,0,Math.sin(s.ma)*1.76);
    tmp.copy(s.g.position).project(camera);
    s.sx=(tmp.x+1)/2*W;s.sy=(1-tmp.y)/2*H;
    s.el.style.transform='translate3d('+Math.round(s.sx-s.lw/2)+'px,'+Math.round(s.sy+s.px*sm+12)+'px,0)';
    s.el.classList.toggle('on',lt>.6);s.el.classList.toggle('hot',s.hv>.5);
  });

  /* tia lửa + vòng xung khi chạm */
  if(bT>=0){bT+=dt;if(bT>1.2){bT=-1;BU.uT.value=-1;pulse.visible=false}else{
    BU.uT.value=bT;BU.uC.value.copy(bS.g.position);const tt=cl(bT/.9);
    pulse.visible=tt<1;pulse.position.copy(bS.g.position);pulse.scale.setScalar(bS.r*(3+tt*9));pulse.material.opacity=.9*(1-tt)}}

  extrasUpdate(dt,tb);decorUpdate(dt,tb);
  composer?composer.render():renderer.render(scene,camera);
}
raf=requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
