<!DOCTYPE html>
<html lang="vi" data-theme="nox">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKIBIDI SCRIPT — Cộng đồng & Tiện ích</title>
<style>
/* ============ NỀN TẢNG BIẾN THEO CHỦ ĐỀ ============ */
:root{
  --r:18px; --r-s:12px; --pad:16px; --maxw:1080px;
  --g-alpha:.34; --g-blur:18px; --g-edge:.55; --g-tint:255,255,255; --g-mode:1;
  --anim:.28s; --part:24;
}
html[data-theme="nox"]{
  --bg:#07090d; --bg2:#0b1017; --sf:#121822; --sf2:#1a2230; --tx:#eaf0f7; --mu:#8b98ab;
  --ac:#5eead4; --ac2:#818cf8; --bd:#232d3d; --sh:0 12px 32px rgba(0,0,0,.45); --glow:0 0 24px rgba(94,234,212,.16);
  --blur:0px; --sf-al:1; --edge:transparent;
}
html[data-theme="turbo"]{
  --bg:#0d0714; --bg2:#160b22; --sf:#1d1030; --sf2:#2a1745; --tx:#fff3e8; --mu:#b39ccf;
  --ac:#ff7a18; --ac2:#ff2d95; --bd:#3a2059; --sh:0 10px 28px rgba(255,45,149,.18); --glow:0 0 26px rgba(255,122,24,.28);
  --blur:0px; --sf-al:1; --edge:transparent;
}
html[data-theme="glass"]{
  --bg:#0e2233; --bg2:#123a52; --sf:rgba(var(--g-tint),var(--g-alpha)); --sf2:rgba(var(--g-tint),calc(var(--g-alpha)*.6));
  --tx:#f2fbff; --mu:#bcd9e8; --ac:#7dd3fc; --ac2:#a5b4fc; --bd:rgba(255,255,255,calc(var(--g-edge)*.5));
  --sh:0 18px 44px rgba(2,20,34,.35); --glow:0 0 30px rgba(125,211,252,.25);
  --blur:var(--g-blur); --sf-al:1; --edge:rgba(255,255,255,calc(var(--g-edge)));
}
html[data-theme="natural"]{
  --bg:#0e2233; --bg2:#1b3a53; --sf:rgba(255,255,255,.62); --sf2:rgba(255,255,255,.45);
  --tx:#12283a; --mu:#4c6577; --ac:#2f9e6e; --ac2:#e8a13c; --bd:rgba(255,255,255,.7);
  --sh:0 12px 30px rgba(20,50,70,.18); --glow:none; --blur:6px; --sf-al:1; --edge:rgba(255,255,255,.8);
}
html[data-theme="natural"][data-event="halloween"]{
  --bg:#160b1e; --bg2:#2a1030; --sf:rgba(30,12,40,.72); --sf2:rgba(48,20,60,.6); --tx:#ffe9c9; --mu:#c9a08a;
  --ac:#ff8c2e; --ac2:#9d4dff; --bd:rgba(255,140,46,.35); --glow:0 0 26px rgba(255,140,46,.25);
}
html[data-theme="natural"][data-event="christmas"]{ --ac:#3fae6a; --ac2:#e05252; }
html[data-theme="natural"][data-event="tet"]{ --ac:#d43a2f; --ac2:#f0b429; }
html[data-perf="low"]{ --anim:0s; --part:0; }
html[data-perf="balanced"]{ --part:14; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--tx); overflow-x:hidden}
body[data-font="serif"]{font-family:Georgia,"Times New Roman",serif}
body[data-font="mono"]{font-family:ui-monospace,Consolas,monospace}
body[data-font="round"]{font-family:"Quicksand","Comic Sans MS",system-ui,sans-serif}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}

/* ============ NỀN & LỚP CẢNH ============ */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2))}
#bgMedia img,#bgMedia video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgMedia::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42))}
html[data-theme="glass"] #bgMedia::after{background:linear-gradient(180deg,rgba(10,40,60,.25),rgba(6,26,40,.5))}
/* Cảnh thiên nhiên */
#scene{position:absolute;inset:0;display:none}
html[data-theme="natural"] #scene{display:block}
#scene .sky{position:absolute;inset:0;background:linear-gradient(180deg,#8ecdf0 0%,#cfe9f7 45%,#eef7ee 70%)}
html[data-event="halloween"] #scene .sky{background:linear-gradient(180deg,#1b0f2b 0%,#3d1440 45%,#7a2c17 80%)}
html[data-event="christmas"] #scene .sky{background:linear-gradient(180deg,#9fc6e8,#e8f2fa)}
html[data-event="tet"] #scene .sky{background:linear-gradient(180deg,#f7d9a0,#fbeedd)}
#scene .sun{position:absolute;top:9%;right:14%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd76a 60%,rgba(255,215,106,0));box-shadow:0 0 60px 22px rgba(255,220,120,.5)}
html[data-event="halloween"] #scene .sun{background:radial-gradient(circle at 40% 40%,#ffd9a0,#ff8c2e 65%,rgba(255,140,46,0));box-shadow:0 0 70px 26px rgba(255,120,30,.35);width:92px;height:92px}
#scene .mtn{position:absolute;left:-5%;right:-5%;background:#5f87a8;opacity:.75}
#scene .m1{bottom:34%;height:30%;clip-path:polygon(0 100%,12% 42%,26% 78%,41% 20%,58% 72%,74% 34%,88% 70%,100% 46%,100% 100%)}
#scene .m2{bottom:22%;height:26%;background:#3f6b8f;clip-path:polygon(0 100%,18% 30%,34% 70%,52% 12%,70% 66%,86% 30%,100% 62%,100% 100%)}
html[data-event="halloween"] #scene .m1,html[data-event="halloween"] #scene .m2{background:#241031}
#scene .ground{position:absolute;bottom:0;height:26%;background:linear-gradient(180deg,#356b4f,#1d4634)}
html[data-event="halloween"] #scene .ground{background:linear-gradient(180deg,#241a12,#120b08)}
#scene .tree{position:absolute;bottom:20%;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:86px solid #1d4634;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
html[data-event="halloween"] #scene .tree{border-bottom-color:#0d070a}
#scene .fog{position:absolute;left:-40%;width:120%;height:22%;background:radial-gradient(ellipse at center,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);animation:fog 46s linear infinite}
#scene .fog.f2{bottom:16%;animation-duration:64s;animation-direction:reverse;opacity:.7}
#scene .fog.f1{bottom:30%}
html[data-event="halloween"] #scene .fog{background:radial-gradient(ellipse at center,rgba(190,140,255,.28),rgba(0,0,0,0) 70%)}
@keyframes fog{from{transform:translateX(-12%)}50%{transform:translateX(12%)}to{transform:translateX(-12%)}}
#parts{position:absolute;inset:0;pointer-events:none}
#parts i{position:absolute;top:-4%;border-radius:50%;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg)}}

/* ============ KHUNG ỨNG DỤNG ============ */
#app{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(76px + env(safe-area-inset-bottom))}
@media(min-width:900px){#app{padding-bottom:24px}}
header#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 2px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px;cursor:pointer;user-select:none}
.logo .mk{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--ac),var(--ac2),var(--ac));box-shadow:var(--glow);display:grid;place-items:center;font-size:17px;color:#041018;font-weight:900}
.spacer{flex:1}
.icobtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);backdrop-filter:blur(var(--blur));display:grid;place-items:center;cursor:pointer;transition:transform var(--anim)}
.icobtn:active{transform:scale(.93)}
.dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--bg);display:none}
.dot.on{display:block}
nav#bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
@media(min-width:900px){nav#bar{position:sticky;top:70px;justify-content:flex-start;background:none;backdrop-filter:none;border:0;padding:0 0 12px;order:-1}#app{padding-top:0}}
nav#bar button{flex:1;max-width:120px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;cursor:pointer;padding:6px 4px;border-radius:14px;transition:color var(--anim)}
nav#bar button .ni{font-size:19px;line-height:1}
nav#bar button.on{color:var(--tx);background:var(--sf2);box-shadow:inset 0 0 0 1px var(--bd)}
@media(min-width:900px){nav#bar button{flex-direction:row;gap:8px;font-size:14px;flex:0 0 auto;padding:9px 16px}}

/* ============ THẺ / NÚT / Ô NHẬP ============ */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(var(--blur));padding:var(--pad);position:relative;overflow:hidden}
html[data-theme="glass"] .card{backdrop-filter:blur(var(--g-blur)) saturate(1.5);background:linear-gradient(155deg,rgba(var(--g-tint),var(--g-alpha)),rgba(var(--g-tint),calc(var(--g-alpha)*.42)))}
html[data-theme="glass"] .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,calc(var(--g-edge)*.9)),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(255,255,255,calc(var(--g-edge)*.35)));mix-blend-mode:screen}
html[data-theme="glass"] .card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,calc(var(--g-edge)*.22)),transparent);pointer-events:none;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-60%}88%{left:120%}100%{left:120%}}
html[data-theme="turbo"] .card{border:1px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;border-radius:22px 8px 22px 8px}
html[data-theme="nox"] .card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:0}
.mu{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform var(--anim),box-shadow var(--anim),filter var(--anim);user-select:none}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#081018;box-shadow:var(--glow)}
html[data-theme="natural"] .btn.pri{color:#fff}
.btn.dgr{background:#3a1220;border-color:#7a2440;color:#ffb4c0}
.btn.gho{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:13px;padding:11px 13px;font:inherit;outline:none;transition:box-shadow var(--anim)}
.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
textarea.inp{min-height:96px;resize:vertical}
label.fl{font-size:12.5px;color:var(--mu);margin:8px 0 4px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#081018;border-color:transparent;font-weight:700}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;color:#081018;overflow:hidden;flex:none;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.fr1{box-shadow:0 0 0 3px var(--ac),0 0 14px var(--ac)}
.avatar.fr2{box-shadow:0 0 0 3px var(--ac2),0 0 0 6px color-mix(in srgb,var(--ac2) 40%,transparent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu)}
.badge.dev{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#081018;border:0;font-weight:800}
.badge.st-pending{color:#ffcf6a;border-color:#6b5320}.badge.st-approved{color:#7ce7a2;border-color:#265c3a}.badge.st-rejected{color:#ff9aa8;border-color:#6b2433}.badge.st-edit{color:#8ab4ff;border-color:#2c4470}
.nmfx1{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.nmfx2{animation:glowl 2.2s ease-in-out infinite}
@keyframes glowl{50%{text-shadow:0 0 12px var(--ac)}}
.empty{text-align:center;color:var(--mu);padding:34px 12px}
.empty .big{font-size:38px;margin-bottom:8px}
.loader{display:flex;justify-content:center;padding:26px}
.loader i{width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--ac);animation:bnc 1s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.15s;background:var(--ac2)}.loader i:nth-child(3){animation-delay:.3s}
@keyframes bnc{40%{transform:translateY(-10px)}}
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--sf2) 25%,var(--sf) 50%,var(--sf2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;min-height:90px}
@keyframes sk{to{background-position:-200% 0}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.hr{height:1px;background:var(--bd);margin:14px 0;border:0}
.sw{width:46px;height:27px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);position:relative;cursor:pointer;transition:background var(--anim)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:transform var(--anim),background var(--anim)}
.sw.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.sw.on::after{transform:translateX(19px);background:#081018}
input[type=range]{width:100%;accent-color:var(--ac)}
.thumb{border-radius:14px;aspect-ratio:16/10;object-fit:cover;width:100%;background:var(--sf2)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-s);background:var(--sf2);border:1px solid var(--bd);cursor:pointer;transition:transform var(--anim)}
.li:active{transform:scale(.985)}
.li .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ss{font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;background:var(--sf2);border:1px solid var(--bd);margin:3px 0;word-break:break-word}
.msg.me{margin-left:auto;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,var(--sf2)),color-mix(in srgb,var(--ac2) 30%,var(--sf2)))}
.msg .tm{display:block;font-size:10.5px;color:var(--mu);margin-top:4px}
.bubble{width:100%;height:120px;border-radius:20px;background:var(--sf2);display:grid;place-items:center;color:var(--mu);cursor:pointer;border:1px dashed var(--bd)}
.bubble.rec{border-color:#ff4d5e;color:#ff8b98;animation:glowl 1.4s infinite}

/* ============ LỚP PHỦ ============ */
#modalWrap{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#modalWrap.on{display:flex}
@media(min-width:760px){#modalWrap{align-items:center;padding:20px}}
#modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;background:var(--sf);border:1px solid var(--bd);backdrop-filter:blur(20px);box-shadow:var(--sh);animation:up .3s cubic-bezier(.2,.9,.25,1)}
@media(min-width:760px){#modal{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:11px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(14px);animation:up .25s;font-size:14px}
.toast.err{border-color:#7a2440}.toast.ok{border-color:#265c3a}
#splash{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),var(--bg2));transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash .mk{width:74px;height:74px;border-radius:22px;background:conic-gradient(from 210deg,var(--ac),var(--ac2),var(--ac));display:grid;place-items:center;font-size:34px;font-weight:900;color:#041018;box-shadow:var(--glow);animation:pul 1.6s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.07) rotate(3deg)}}
html[data-theme="glass"] #splash .mk{background:rgba(255,255,255,.2);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);color:#fff}
html[data-theme="natural"] #splash .mk{background:rgba(255,255,255,.55);border:1px solid #fff;color:#1d4634}
.pill{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(10,12,16,.86);color:#fff;backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(0,0,0,.4);font-size:13px;max-width:92vw}
.pill .grn{color:#7ce7a2;font-weight:700}
</style>
</head>
<body>
<div id="bg"><div id="bgMedia"></div><div id="scene">
  <div class="sky"></div><div class="sun"></div><div class="mtn m1"></div><div class="mtn m2"></div>
  <div class="ground"></div><div class="fog f1"></div><div class="fog f2"></div><div id="parts"></div>
</div></div>
<div id="splash"><div class="mk">S</div><div style="font-weight:800;letter-spacing:1px">SKIBIDI SCRIPT</div><div class="mu" id="splashTx">Đang khởi động…</div></div>
<div id="toasts"></div>
<div id="modalWrap"><div id="modal"></div></div>
<div id="app">
  <header id="top">
    <div class="logo" data-act="go" data-to="home"><div class="mk">S</div><span>SKIBIDI SCRIPT</span></div>
    <div class="spacer"></div>
    <button class="icobtn" data-act="go" data-to="mailbox" title="Hộp thư">✉️<span class="dot" id="dotMail"></span></button>
    <button class="icobtn" data-act="go" data-to="shop" title="Shop">🛍️</button>
    <button class="icobtn" id="avaTop" data-act="me"><span class="avatar" id="avaTopIn" style="width:30px;height:30px;font-size:13px">?</span><span class="dot" id="dotDev"></span></button>
  </header>
  <nav id="bar">
    <button data-act="go" data-to="utils"><span class="ni">🧰</span>Tiện ích</button>
    <button data-act="go" data-to="audio"><span class="ni">🎧</span>Âm thanh</button>
    <button data-act="go" data-to="report"><span class="ni">📮</span>Báo cáo</button>
    <button data-act="go" data-to="chat"><span class="ni">💬</span>Nhắn tin<span class="dot" id="dotChat" style="position:static;box-shadow:none;margin-left:2px"></span></button>
  </nav>
  <main id="view" style="flex:1;padding-top:6px"></main>
</div>
<script>
"use strict";
/* ================= CẤU HÌNH HỆ THỐNG (chỉ dành cho nhà phát triển) ================= */
const CFG={googleClientId:null, maxImg:1500000, maxFile:1000000, maxAudio:1500000};
/* ================= TẦNG DỮ LIỆU ================= */
const DB=(()=>{const P="skibidi.v2.";
 const rd=k=>{try{const v=localStorage.getItem(P+k);return v==null?null:JSON.parse(v)}catch(e){return null}};
 const wr=(k,v)=>{localStorage.setItem(P+k,JSON.stringify(v));emit(k)};
 const ls=[];const emit=k=>ls.forEach(f=>f(k));
 const col=(k,init)=>({get:()=>{const v=rd(k);return v==null?(wr(k,init),init):v},set:v=>wr(k,v),

 return{rd,wr,col,onChange:f=>ls.push(f),

 if(r.status==="new")DB.reports.tx(rs=>{rs.find(x=>x.id===id).status="reading";return rs});
 modal(`<h2>${r.type==="report"?"🚨 Báo cáo":"💡 Góp ý"}</h2><div class="mu">${nameHTML(u)} • UID: ${esc(u?u.uid:"")} • ${fmtDT(r.ts)}</div>
 <p style="white-space:pre-wrap">${esc(r.content)}</p>${attHTML(r.files)}
 <div class="row"><button class="btn sm" data-act="rep-status" data-p="${id}" data-p2="reading">Đang xử lý</button><button class="btn pri sm" data-act="rep-status" data-p="${id}" data-p2="done">Hoàn tất</button><button class="btn dgr sm" data-act="rep-del" data-p="${id}">🗑</button></div>
 <hr class="hr"><div class="list">${(r.replies||[]).map(t=>`<div class="msg me">${esc(t.msg)}</div>`).join("")}</div>
 <div class="row"><input class="inp grow" id="repR" placeholder="Phản hồi cho người gửi…"><button class="btn pri sm" data-act="rep-reply" data-p="${id}">Gửi</button></div>`)}
function attHTML(fs){return(fs||[]).map(f=>f.kind==="img"?`<img class="thumb" src="${f.dataUrl}">`:f.kind==="voice"?`<audio controls src="${f.dataUrl}" style="width:100%"></audio>`:`<a class="chip" href="${f.dataUrl}" download="${esc(f.name)}">📎 ${esc(f.name)}</a>`).join("")}
function profForm(){const me=Auth.me();
 modal(`<h2>Chỉnh hồ sơ</h2><div class="col">
 <div class="row">${avaHTML(me,56)}<button class="btn sm" data-act="pf-ava">🖼 Đổi avatar</button></div>
 <label class="fl">Tên hiển thị ${me.nameChangedAt?`(đổi lại sau ${Math.max(0,Math.ceil((7*864e5-(Date.now()-me.nameChangedAt))/864e5))} ngày)`:""}</label>
 <input class="inp" id="pfName" value="${esc(me.displayName)}" ${me.nameChangedAt&&Date.now()-me.nameChangedAt<7*864e5?"disabled":""}>
 <label class="fl">Giới thiệu bản thân</label><textarea class="inp" id="pfBio">${esc(me.bio)}</textarea>
 <label class="fl">Liên kết cá nhân (mỗi dòng: nhãn | url)</label><textarea class="inp" id="pfLinks">${me.links.map(l=>esc(l.label+" | "+l.url)).join("\n")}</textarea>
 <button class="btn pri" data-act="pf-save">Lưu hồ sơ</button></div>`)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;
 if(el.dataset.act==="pf-ava")pickFile(f=>readImage(f,200).then(d=>{Auth.update(Auth.me().uid,u=>u.avatar=d);renderDots();toast("Đã cập nhật avatar.","ok")}).catch(er=>toast(er,"err")),"image/*");
 if(el.dataset.act==="pf-save"){const me=Auth.me();const nm=$("#pfName").value.trim();
  try{if(nm&&nm!==me.displayName)Auth.rename(me,nm)}catch(er){toast(er,"err");return}
  Auth.update(me.uid,u=>{u.bio=$("#pfBio").value.trim();u.links=$("#pfLinks").value.split("\n").filter(Boolean).map(l=>{const[a,b]=l.split("|");return{label:(a||"").trim(),url:(b||a||"").trim()}})});
  closeModal();render();toast("Đã lưu hồ sơ.","ok")}
 if(el.dataset.act==="uid-save"){try{Auth.changeUid(Auth.me(),$("#uidIn").value);closeModal();render();toast("Đã đổi UID. Nhớ UID mới của bạn!","ok")}catch(er){toast(er,"err")}}});
function uidForm(){const me=Auth.me();if(me.uidChanged){toast("UID chỉ được đổi một lần và bạn đã dùng.","err");return}
 modal(`<h2>Đổi UID (một lần duy nhất)</h2><div class="mu">UID hiện tại: ${esc(me.uid)}. Sau khi đổi, mọi tham chiếu sẽ tự cập nhật.</div>
 <input class="inp" id="uidIn" placeholder="UID mới…"><br><br><button class="btn pri" data-act="uid-save">Xác nhận đổi UID</button>`)}
function shopForm(s){tmp.shId=s?s.id:null;
 modal(`<h2>${s?"Sửa vật phẩm":"Tạo vật phẩm"}</h2><div class="col">
 <select class="inp" id="shType">${["font","frame","badge","namefx","profilefx","accessory"].map(t=>`<option ${s&&s.type===t?"selected":""}>${t}</option>`).join("")}</select>
 <input class="inp" id="shName" placeholder="Tên vật phẩm" value="${esc(s?s.name:"")}">
 <textarea class="inp" id="shDesc" placeholder="Mô tả">${esc(s?s.desc:"")}</textarea>
 <label class="fl">Xem trước (JSON)</label><input class="inp" id="shPrev" value='${esc(JSON.stringify(s?s.preview:{kind:"badge",value:"🎁"}))}'>
 <label class="row"><input type="checkbox" id="shRole" ${s&&s.roles?"checked":""}> Chỉ dành cho quản trị</label>
 <button class="btn pri" data-act="sh-save">Lưu vật phẩm</button></div>`)}
function newCatId(name){let id=uid8();DB.cats.tx(cs=>{cs.push({id,name:name||"Khác",builtin:0,order:cs.length+1});return cs});return id}
/* ================= KHỞI ĐỘNG ================= */
(function boot(){$("#splashTx").textContent="Đang tải nội dung…";
 const finish=()=>{$("#splash").classList.add("off");setTimeout(()=>$("#splash").remove(),500);
  const me=Auth.me();const nt=DB.notice.get();
  if(me&&nt.text&&!(me.seenNotices||[]).includes(nt.id)){Auth.update(me.uid,u=>{(u.seenNotices=u.seenNotices||[]).push(nt.id)});
   modal(`<div style="text-align:center"><div style="font-size:40px">📢</div><h2>Thông báo</h2><p>${esc(nt.text)}</p><button class="btn pri" data-act="mclose">Đã hiểu</button></div>`)}
  render()};
 Promise.resolve().then(()=>{Theme.apply();setTimeout(finish,350)});
 setInterval(()=>{if(route.name==="room")render()},4000);
})();
</script>
