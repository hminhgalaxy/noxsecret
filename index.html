#envWrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.bird,.bat{position:absolute;opacity:0;transition:opacity 1.2s;animation:fly linear infinite}

.bird .wr,.bat .wr{transform-origin:20px 10px;animation:flapR .5s ease-in-out infinite alternate}
.bat .wl,.bat .wr{transform-origin:23px 12px;animation-duration:.22s}
@keyframes flap{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}

const FX={cv:null,ctx:null,items:[],type:"off",raf:0,W:0,H:0,

function setLocalSession(s){try{localStorage.setItem("ssw_session",JSON.stringify({email:s.email,name:s.name,picture:s.picture}))}catch(_){}}
function getLocalSession(){try{return JSON.parse(localStorage.getItem("ssw_session")||"null")}catch(_){return null}}
function applyUser(){var u=state.user;state.dev=!!(u&&u.ok&&String(u.email||"").toLowerCase()===DEV_EMAIL);
 $("#accPane").style.display=u?"flex":"none";$("#loginForm").style.display=u?"none":"flex";$("#accMail").textContent=(u&&u.email)||"";
 $("#accDev").style.display=state.dev?"inline":"none";$("#btnDevOpen").style.display=state.dev?"inline-flex":"none";$("#mDev").style.display=state.dev?"flex":"none";
 if(!state.dev&&$("#dev").classList.contains("on"))closeDev();}
let gCerts=null;
function b64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");if(s.length%4)s+="=".repeat(4-s.length%4);var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
function dJ(p){return JSON.parse(new TextDecoder().decode(b64u(p)))}
async function verifyGoogle(t){var p=String(t).split(".");if(p.length!==3)throw new Error("token sai");var h=dJ(p[0]),pl=dJ(p[1]);
 if(pl.aud!==GIS_ID)throw new Error("sai aud");if(["accounts.google.com","https://accounts.google.com"].indexOf(pl.iss)<0)throw new Error("sai iss");
 if(pl.exp&&pl.exp<Math.floor(Date.now()/1000)-30)throw new Error("hết hạn");if(!pl.email)throw new Error("không có email");
 if(!(window.crypto&&crypto.subtle))throw new Error("cần HTTPS");if(!gCerts)gCerts=await(await fetch("https://www.googleapis.com/oauth2/v3/certs")).json();
 var j=(gCerts.keys||[]).find(function(k){return k.kid===h.kid});if(!j)throw new Error("không tìm thấy khóa");
 var k=await crypto.subtle.importKey("jwk",{kty:j.kty,n:j.n,e:j.e,alg:"RS256",ext:true},{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["verify"]);
 if(!await crypto.subtle.verify("RSASSA-PKCS1-v1_5",k,b64u(p[2]),new TextEncoder().encode(p[0]+"."+p[1])))throw new Error("chữ ký sai");return pl;}
async function onGoogle(resp){if(!resp||!resp.credential)return;
 try{var pl=await verifyGoogle(resp.credential);state.user={email:pl.email,name:pl.name||pl.email,picture:pl.picture||"",ok:true};setLocalSession(state.user);applyUser();toast("Đăng nhập Google thành công.");
  if(auth){try{await auth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(resp.credential));}catch(e){}}
  closePops();}catch(e){toast("Google: "+e.message);}}
function initGIS(t){if(window.google&&google.accounts){try{google.accounts.id.initialize({client_id:GIS_ID,callback:onGoogle,auto_select:false});google.accounts.id.renderButton($("#gBtn"),{theme:"filled_black",size:"medium",shape:"pill"});}catch(e){}}else if(t>0)setTimeout(function(){initGIS(t-1)},500);}
initGIS(15);
(function(){var s=getLocalSession();if(s&&s.email){state.user={email:s.email,name:s.name,picture:s.picture,ok:false};applyUser();}})();
$("#loginForm").addEventListener("submit",function(e){e.preventDefault();var err=$("#liErr");err.textContent="";if(!auth){err.textContent="Không kết nối được Firebase.";return;}
 auth.signInWithEmailAndPassword($("#liEmail").value.trim(),$("#liPass").value).then(function(c){state.user={email:c.user.email,name:c.user.displayName||c.user.email,picture:c.user.photoURL||"",ok:true};setLocalSession(state.user);applyUser();closePops();toast("Đăng nhập thành công.");}).catch(function(){err.textContent="Sai email hoặc mật khẩu.";});});
function doSignOut(){try{localStorage.removeItem("ssw_session")}catch(_){}state.user=null;applyUser();if(auth)auth.signOut().catch(function(){});}
$("#btnOut").addEventListener("click",function(){doSignOut();closePops();});
$("#setOut").addEventListener("click",function(){doSignOut();});
if(auth)auth.onAuthStateChanged(function(u){if(u){state.user={email:u.email,name:u.displayName||u.email,picture:u.photoURL||"",ok:true};applyUser();}});
/* DEV PANEL: nền đặc, đóng hết popup trước khi mở, tạm dừng hiệu ứng nền → không lag/xung đột */
const TABS=[["content","Content"],["env","Environment"],["notice","Thông báo"],["util","Tiện ích note"],["perf","Performance"],["settings","Settings"]];
function buildTabs(){$("#devTabs").innerHTML=TABS.map(function(t){return '<button class="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");}
function showTab(t){document.querySelectorAll("#dev .tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});document.querySelectorAll("#dev .pane").forEach(function(p){p.classList.toggle("on",p.id==="p-"+t)});}
$("#devTabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b)showTab(b.dataset.t);});
function fillDev(){var v=state.notice||{};$("#utilNoteIn").value=state.utilNote||"";$("#anTitle").value=v.title||"";$("#anBody").value=v.body||"";$("#anOn").checked=!!v.enabled;document.querySelectorAll("#p-perf [data-p]").forEach(function(x){x.classList.toggle("on",x.dataset.p===state.settings.perf)});}
function openDev(){if(!state.dev)return;closePops();closeMenu();state.paused=true;document.body.classList.add("devopen");buildTabs();buildCatSeg();fillDev();syncEnvUI();renderDevList();$("#dev").classList.add("on");showTab("content");}
function closeDev(){$("#dev").classList.remove("on");document.body.classList.remove("devopen");state.paused=false;FX.kick();}
function buildCatSeg(){$("#catSeg").innerHTML=CATS.map(function(c){return '<button data-c="'+c.id+'" class="'+(state.fc===c.id?"on":"")+'">'+esc(c.label)+'</button>'}).join("");$("#wCode").style.display=state.fc==="script"?"flex":"none";$("#wUrl").style.display=state.fc==="script"?"none":"flex";}
$("#catSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(b){state.fc=b.dataset.c;buildCatSeg();}});
function resetForm(){state.edit=null;$("#fCancel").style.display="none";$("#fName").value=$("#fDesc").value=$("#fUrl").value=$("#fCode").value="";}
$("#fSave").addEventListener("click",function(){if(!state.dev||!db)return;var name=$("#fName").value.trim();if(!name){toast("Nhập tên trước.");return;}var c=catOf(state.fc),p={name:clean(name),desc:clean($("#fDesc").value),updatedAt:firebase.database.ServerValue.TIMESTAMP};
 if(state.fc==="script")p.code=$("#fCode").value;else{if(!vUrl($("#fUrl").value)){toast("Link phải bắt đầu bằng http(s)://");return;}p.url=$("#fUrl").value.trim();}
 var job=state.edit?db.ref(ND+"/"+c.node+"/"+state.edit).update(p):db.ref(ND+"/"+c.node).push(Object.assign(p,{createdAt:firebase.database.ServerValue.TIMESTAMP}));
 job.then(function(){toast("Đã lưu.");resetForm();}).catch(function(){toast("Lưu thất bại (kiểm tra quyền Firebase).");});});
$("#fCancel").addEventListener("click",resetForm);
function renderDevList(){$("#devList").innerHTML=CATS.map(function(c){var it=state.data[c.id]||[];return '<details><summary>'+esc(c.label)+' ('+it.length+')</summary>'+it.map(function(x){return '<div class="drow"><span>'+esc(x.name)+'</span><button class="btn btn-g" data-ed="'+c.id+':'+esc(x.key)+'">Sửa</button><button class="btn btn-g" data-del="'+c.id+':'+esc(x.key)+'">Xóa</button></div>'}).join("")+"</details>"}).join("");}
$("#devList").addEventListener("click",function(e){if(!state.dev||!db)return;var ed=e.target.closest("[data-ed]"),de=e.target.closest("[data-del]");
 if(ed){var a=ed.dataset.ed.split(":"),it=(state.data[a[0]]||[]).find(function(x){return x.key===a[1]});if(it){state.fc=a[0];buildCatSeg();state.edit=a[1];$("#fName").value=it.name;$("#fDesc").value=it.desc||"";$("#fUrl").value=it.url||"";$("#fCode").value=it.code||"";$("#fCancel").style.display="inline-flex";scrollTo({top:0});$("#dev .body").scrollTo({top:0,behavior:"smooth"});}}
 if(de&&confirm("Xóa mục này?")){var b=de.dataset.del.split(":");db.ref(ND+"/"+catOf(b[0]).node+"/"+b[1]).remove();}});
function fillEnvSel(){$("#manWx").innerHTML=["none","clear","rain","snow","fog","storm","wind","dust"].map(function(w){return "<option>"+w+"</option>"}).join("");$("#lockEnv").innerHTML=["normal","halloween","christmas","tet"].map(function(t){return "<option>"+t+"</option>"}).join("");}
function syncEnvUI(){var s=state.settings;$("#envAuto").classList.toggle("on",s.envMode==="auto");$("#envManual").classList.toggle("on",s.envMode==="manual");$("#manWxWrap").style.display=s.envMode==="manual"?"flex":"none";$("#lockOn").checked=!!s.lockOn;$("#lockWrap").style.display=s.lockOn?"flex":"none";$("#manWx").value=s.manualWeather||"clear";$("#lockEnv").value=s.lockEnv||"halloween";}
$("#envAuto").addEventListener("click",function(){state.settings.envMode="auto";syncEnvUI();});
$("#envManual").addEventListener("click",function(){state.settings.envMode="manual";syncEnvUI();});
$("#lockOn").addEventListener("change",function(e){state.settings.lockOn=e.target.checked;syncEnvUI();});
$("#envSave").addEventListener("click",function(){if(!state.dev||!db)return;state.settings.manualWeather=$("#manWx").value;state.settings.lockEnv=$("#lockEnv").value;db.ref("nox_settings").update({envMode:state.settings.envMode,manualWeather:state.settings.manualWeather,lockOn:state.settings.lockOn,lockEnv:state.settings.lockEnv}).then(function(){toast("Đã lưu environment.");}).catch(function(){toast("Lưu thất bại.");});applyEnv();});
$("#anSave").addEventListener("click",function(){if(!state.dev||!db)return;db.ref("nox_notice").update({title:clean($("#anTitle").value),body:clean($("#anBody").value),enabled:$("#anOn").checked,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast("Đã lưu thông báo.");});
$("#utilNoteSave").addEventListener("click",function(){if(!state.dev||!db)return;db.ref("nox_notice").update({util:clean($("#utilNoteIn").value)});toast("Đã lưu ghi chú.");});
document.querySelectorAll("#p-perf [data-p]").forEach(function(b){b.addEventListener("click",function(){state.settings.perf=state.perfEff=b.dataset.p;if(db&&state.dev)db.ref("nox_settings").update({perf:b.dataset.p});FX.set(FX.type);document.querySelectorAll("#p-perf [data-p]").forEach(function(x){x.classList.toggle("on",x===b)});});});
/* FIREBASE */
let pend=CATS.length,done=false;
function markPend(){pend--;if(pend<=0&&!done){done=true;hideLoader();}}
function hideLoader(){var l=$("#loader");if(l){l.classList.add("hide");setTimeout(function(){l.style.display="none"},600);}}
setTimeout(hideLoader,3000);
if(db){CATS.forEach(function(c){db.ref(ND+"/"+c.node).on("value",function(s){var v=s.val()||{};state.data[c.id]=Object.keys(v).map(function(k){return nI(k,v[k])}).sort(function(a,b){return b.ts-a.ts});if($("#shUtil").classList.contains("on"))refreshUtil();if(state.dev&&$("#dev").classList.contains("on"))renderDevList();markPend();},function(){state.data[c.id]=[];markPend();});});
 db.ref("nox_settings").on("value",function(s){var v=s.val()||{};Object.assign(state.settings,{envMode:v.envMode||"auto",manualWeather:v.manualWeather||"clear",lockOn:!!v.lockOn,lockEnv:v.lockEnv||"halloween",perf:v.perf||"balanced"});state.perfEff=state.settings.perf;syncEnvUI();FX.set(FX.type);applyEnv();},function(){});
 db.ref("nox_notice").on("value",function(s){var v=s.val()||{};state.notice=v;state.utilNote=v.util||"";var un=$("#utilNote");if(state.utilNote){un.style.display="block";un.textContent=state.utilNote;}else un.style.display="none";
  if(v.enabled&&v.body){var ver=String(v.updatedAt||""),rec=null;try{rec=JSON.parse(sessionStorage.getItem("ssw_notice_seen")||"null")}catch(_){}
   if(!(rec&&rec.ver===ver)){$("#ntTitle").textContent=v.title||"Thông báo";$("#ntBody").textContent=v.body;openPop("#shNotice");try{sessionStorage.setItem("ssw_notice_seen",JSON.stringify({ver:ver}))}catch(_){}}}},function(){});
}else{CATS.forEach(function(c){state.data[c.id]=[];markPend();});}
setInterval(applyEnv,30000);
fillEnvSel();syncEnvUI();applyUser();paintSnd();tickTime();applyEnv();
</script>
</body>
