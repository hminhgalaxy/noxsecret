<body data-view="home">
<div id="boot" role="status" aria-label="Loading"><div class="bsp"></div></div>
<header>
  <div class="top">
    <div><button class="ic" onclick="toggleMenu(true)" data-ia="nav.menu"><span data-ic="menu"></span></button></div>
    <h1 class="logo" onclick="go('')">SKIBIDI<b>SCRIPT</b></h1>
    <div class="rt">
      <button class="ic" id="inboxBtn" onclick="go('inbox')" data-ia="nav.inbox" hidden><span data-ic="mail"></span><i class="dot" id="inDot" hidden></i></button>
      <button class="ic" id="accBtn" onclick="onAcc()"></button>
    </div>
  </div>
</header>
<main id="main">
  <section id="vHome" class="view"><div id="hhead"></div><div class="grid" id="posts" data-sk="cards"></div><div class="row c"><button id="more" onclick="loadMore()" hidden data-i="more"></button></div></section>
  <section id="vGames" class="view" hidden><div class="hrow"><h2 data-i="games.title"></h2></div><div class="grid" id="games" data-sk="cards"></div></section>
  <section id="vWorld" class="view" hidden><div class="wrap">
    <div class="hrow"><h2>World</h2>
      <div class="seg"><button id="wtP" onclick="wTabSet('posts')"><span data-ic="msg" data-s="16"></span><span data-i="w.tab.posts"></span></button><button id="wtG" onclick="wTabSet('groups')"><span data-ic="users" data-s="16"></span><span data-i="w.tab.groups"></span></button></div></div>
    <div id="wNote"></div>
    <div id="wPosts"><div id="wComp"></div><div id="wFeed" data-sk="list"></div></div>
    <div id="wGroups" hidden>
      <div class="ln"><span class="mu" data-i="g.hint"></span><button class="pri" onclick="openGroupForm()"><span data-ic="plus" data-s="16"></span><span data-i="g.new"></span></button></div>
      <div id="wGroupList" data-sk="list"></div></div>
  </div></section>
  <section id="vLiked" class="view" hidden><div class="hrow"><h2 data-i="liked.title"></h2></div><div class="grid" id="liked" data-sk="cards"></div></section>
  <section id="vMine" class="view" hidden><div class="wrap"><div class="hrow"><h2 data-i="mine.title"></h2><button class="pri" onclick="openForm()"><span data-ic="plus" data-s="16"></span><span data-i="nav.post"></span></button></div><div id="mine" data-sk="list"></div></div></section>
  <section id="vInbox" class="view" hidden><div class="wrap"><div class="hrow"><h2 data-i="nav.inbox"></h2><button onclick="openReport()"><span data-ic="flag" data-s="16"></span><span data-i="in.support"></span></button></div><div id="inboxBody" data-sk="list"></div></div></section>
  <section id="vProfile" class="view" hidden><div id="profile" data-sk="list"></div></section>
</main>

<div id="pop"><button class="x ic" onclick="closePop()" data-ia="close"><span data-ic="x" data-s="16"></span></button><div class="ph" data-i="pop.cats"></div><div class="chips" id="popCats"></div><div class="ph" data-i="pop.sort"></div><div class="chips" id="popSort"></div></div>
<div id="sbar">
  <button class="ic up" id="upBtn" onclick="togglePop(event)" data-ia="pop.cats"><span data-ic="up"></span></button>
  <input id="q" type="search" data-ip="search.ph" oninput="onSearch()" data-ia="search">
  <span data-ic="search"></span>
</div>

<div class="drawer" id="drawer" onclick="if(event.target===this)toggleMenu(false)"><aside>
  <div class="dh"><span class="logo" style="cursor:default">SKIBIDI<b>SCRIPT</b></span><button class="ic gh" onclick="toggleMenu(false)" data-ia="nav.closemenu"><span data-ic="x"></span></button></div>
  <nav id="dnav"></nav>
  <div class="dsep"></div>
  <div id="dauth"></div>
</aside></div>

<!-- Chi tiết bài -->
<div class="modal" id="mDetail" onclick="if(event.target===this)closeDetail()"><div class="box">
  <button class="x ic" onclick="closeDetail()" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <div id="detail"></div>
</div></div>

<!-- Đăng / sửa bài -->
<div class="modal" id="mForm" onclick="if(event.target===this)closeM(this)"><div class="box">
  <button class="x ic" onclick="closeM($('mForm'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="f.title"></b>
  <label data-i="f.t"></label><input id="fTitle" maxlength="120">
  <label data-i="f.cat"></label><div class="row" style="margin-top:0"><select id="fpType" style="flex:1" onchange="syncForm()"></select><button type="button" id="addCatBtn" onclick="addCat()" hidden data-i="f.newcat"></button></div>
  <label data-i="f.game"></label><select id="fpGame"></select>
  <label data-i="f.desc"></label><textarea id="fDesc" maxlength="2000"></textarea>
  <label data-i="f.thumb"></label>
  <div class="row" style="margin-top:0"><input id="fThumb" data-ip="f.thumb.ph" style="flex:1" oninput="prevThumb()"><button type="button" onclick="pickFile(v=>{$('fThumb').value=v;prevThumb()},420)" data-i="f.upload"></button></div>
  <div id="thPrev" class="gal" style="grid-template-columns:120px"></div>
  <label data-i="f.more"></label>
  <div class="row" style="margin-top:0"><button type="button" onclick="addGalImg()"><span data-ic="plus" data-s="16"></span><span data-i="f.addimg"></span></button></div>
  <div id="galPrev" class="gal"></div>
  <div id="wCode"><label data-i="f.code"></label><textarea id="fCode" maxlength="30000"></textarea></div>
  <div id="wUrl"><label data-i="f.url"></label><input id="fUrl"></div>
  <div id="wDl"><label data-i="f.dl"></label><input id="fDl"></div>
  <label data-i="f.ver"></label><input id="fVer" maxlength="30">
  <label data-i="f.tags"></label><input id="fTags">
  <label data-i="f.note"></label><input id="fNote" maxlength="300">
  <div class="row"><button class="pri" onclick="submitPost()" data-i="f.submit"></button><button onclick="closeM($('mForm'))" data-i="cancel"></button></div>
  <div class="fm bad" id="formMsg"></div>
</div></div>

<!-- Báo cáo -->
<div class="modal" id="mReport" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:480px">
  <button class="x ic" onclick="closeM($('mReport'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="r.title"></b>
  <p class="mu" id="rpCtx" style="margin-top:6px"></p>
  <label data-i="r.kind"></label><div class="chips" id="rpKind"></div>
  <label data-i="r.sev"></label><div class="seg full" id="rpSev"></div>
  <label data-i="r.text"></label><textarea id="rpText" maxlength="1500" data-ip="r.text.ph" oninput="$('rpCnt').textContent=this.value.length"></textarea>
  <div class="mu" style="text-align:right"><span id="rpCnt">0</span>/1500</div>
  <p class="mu" data-i="r.note"></p>
  <div class="row"><button class="pri" id="rpGo" onclick="submitReport()" data-i="r.send"></button><button onclick="closeM($('mReport'))" data-i="cancel"></button></div>
  <div class="fm" id="rpMsg"></div>
</div></div>

<!-- Cài đặt -->
<div class="modal" id="mSet" onclick="if(event.target===this)closeM(this)"><div class="box">
  <button class="x ic" onclick="closeM($('mSet'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="nav.settings"></b>
  <div id="setBody" style="margin-top:8px"></div>
</div></div>

<!-- Tạo nhóm chat -->
<div class="modal" id="mGroup" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:460px">
  <button class="x ic" onclick="closeM($('mGroup'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="g.new"></b>
  <label data-i="g.name"></label><input id="cgName" maxlength="30">
  <label data-i="g.desc"></label><input id="cgDesc" maxlength="100">
  <label data-i="g.img"></label>
  <div class="row" style="margin-top:0"><input id="cgImg" style="flex:1" readonly data-ip="g.img.ph"><button type="button" onclick="pickFile(v=>{$('cgImg').value=v},300)" data-i="f.upload"></button></div>
  <label data-i="g.pw.opt"></label>
  <div class="pw"><input id="cgPw" type="password" maxlength="40" autocomplete="new-password"><button type="button" class="eye" onclick="eye('cgPw',this)" data-ic="eye"></button></div>
  <div class="mu" style="margin-top:4px" data-i="g.pw.hint"></div>
  <div class="row"><button class="pri" onclick="submitGroup()" data-i="g.create"></button><button onclick="closeM($('mGroup'))" data-i="cancel"></button></div>
  <div class="fm" id="cgMsg"></div>
</div></div>

<!-- Phòng chat nhóm -->
<div class="modal room" id="mRoom"><div class="rbox">
  <div class="rh"><button class="ic" onclick="closeRoom()" data-ia="back"><span data-ic="back"></span></button><span class="gav sm" id="rAv"></span><div><b id="rName"></b><span class="mu" id="rSub"></span></div><span class="rtools" id="rTools"></span></div>
  <div class="msgs" id="rList"></div>
  <div class="gal sm" id="rGal" style="padding:0 12px"></div>
  <div class="cmp"><button class="ic" onclick="addRoomImg()" data-ia="w.img"><span data-ic="image"></span></button><input id="rIn" maxlength="1000" data-ip="c.ph" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendRoom()}"><button class="pri ic" id="rSend" onclick="sendRoom()" data-ia="send"><span data-ic="send"></span></button></div>
</div></div>

<!-- Dev -->
<div class="modal" id="mDev" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:820px">
  <button class="x ic" onclick="closeM($('mDev'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <div id="devBox"></div>
</div></div>

<!-- Chia sẻ (chỉ cho nội dung đã đăng: bài World, Script, APK, iOS, Link, mục khác) -->
<div class="modal" id="mShare" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:420px">
  <button class="x ic" onclick="closeM($('mShare'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="share"></b>
  <p class="mu" id="shTitle" style="margin-top:6px;word-break:break-word"></p>
  <input id="shUrl" class="shu" readonly aria-label="URL" onfocus="this.select()" onclick="this.select()">
  <div class="shm">
    <button class="pri" id="shCopy" onclick="shareCopy()"><span data-ic="link" data-s="16"></span><span data-i="sh.copy"></span></button>
    <button id="shNative" onclick="shareNative()"><span data-ic="share" data-s="16"></span><span data-i="sh.app"></span></button>
  </div>
  <div class="fm" id="shMsg" role="status"></div>
</div></div>

<!-- Hộp thoại xác nhận / nhập -->
<div class="modal" id="mAsk" onclick="if(event.target===this)askDone(null)"><div class="box" style="max-width:400px">
  <b class="hd" id="askT"></b><p class="mu" id="askD" style="margin-top:6px;font-size:13px"></p>
  <div id="askIn" style="margin-top:10px"></div><div class="fm bad" id="askErr"></div>
  <div class="row" style="justify-content:flex-end"><button id="askNo"></button><button id="askOk"></button></div>
</div></div>
<div class="modal" id="mImg" onclick="closeM(this)"><img id="bigImg" alt=""></div>
<!-- Chọn mục (thay bảng chọn của điện thoại) -->
<div class="modal" id="mPick" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:420px">
  <button class="x ic" onclick="closeM($('mPick'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" id="pkTitle"></b>
  <div id="pkList" class="pk-list"></div>
</div></div>

<!-- Kích hoạt tài khoản (người đăng nhập bằng Google) -->
<div class="modal" id="mAct" onclick="if(event.target===this)closeM(this)"><div class="box" style="max-width:440px">
  <button class="x ic" onclick="closeM($('mAct'))" data-ia="close"><span data-ic="x" data-s="16"></span></button>
  <b class="hd" data-i="act.title"></b>
  <p class="mu" style="margin-top:6px" data-i="act.sub"></p>
  <label for="acName" data-i="act.name"></label><input id="acName" maxlength="24" autocomplete="nickname" autocapitalize="off" spellcheck="false">
  <label for="acEmail">Gmail</label><input id="acEmail" disabled>
  <label for="acPw" data-i="act.pw"></label>
  <div class="pw"><input id="acPw" type="password" maxlength="64" autocomplete="new-password"><button type="button" class="eye ic" onclick="eye('acPw',this)" data-ia="a.showpw"><span data-ic="eye"></span></button></div>
  <label for="acPw2" data-i="act.pw2"></label>
  <div class="pw"><input id="acPw2" type="password" maxlength="64" autocomplete="new-password"><button type="button" class="eye ic" onclick="eye('acPw2',this)" data-ia="a.showpw"><span data-ic="eye"></span></button></div>
  <div class="row"><button class="pri" id="acGo" onclick="submitActivate()" data-i="act.go"></button><button onclick="closeM($('mAct'))" data-i="cancel"></button></div>
  <div class="fm" id="acMsg"></div>
  <p class="mu" style="margin-top:10px;font-size:13px"><a href="login.html" data-i="act.have"></a></p>
</div></div>

<input type="file" id="fileX" accept="image/jpeg,image/png,image/webp" hidden onchange="onFile(this)">
<div id="toast" role="status"></div>
