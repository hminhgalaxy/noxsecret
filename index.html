.in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.28);outline:0}

.chip{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.08);font-weight:600;font-size:13px}.chip.on{background:var(--b);color:#06101a}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(3,6,12,.6);animation:fi .25s}

.li{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#070b12;transition:opacity .5s}
#loader.h{opacity:0;pointer-events:none}.sp{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--b);animation:rot 1s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);z-index:60;padding:12px 18px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;max-width:90vw}#toast.on{opacity:1}
.empty{color:var(--t2);padding:26px;text-align:center}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(18px) scale(.98)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Giao diện: bối cảnh + phong cách ---------- */

/* ---------- Three.js (tải khi cần, giải phóng khi đổi) ---------- */
const FX={r:null,raf:0,sc:null,loading:false};
function stopFx(){cancelAnimationFrame(FX.raf);FX.raf=0;if(FX.sc){FX.sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
 if(FX.r){FX.r.dispose();FX.r=null;}FX.sc=null;removeEventListener("pointermove",FX.mv);}
function startFx(){stopFx();const p=S.pref;if(!p||!p.bg)return;
 if(!window.THREE){if(FX.loading)return;FX.loading=true;const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
  s.onload=()=>{FX.loading=false;startFx();};s.onerror=()=>{FX.loading=false;};document.head.appendChild(s);return;}
 const T=THREE,cv=$("#fx"),low=(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||p.lite;
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 let r;try{r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:false,powerPreference:"low-power"});}catch(e){return;}
 r.setPixelRatio(Math.min(devicePixelRatio||1,low?1:1.5));r.setSize(innerWidth,innerHeight,false);FX.r=r;
 const sc=new T.Scene(),cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);cam.position.z=30;FX.sc=sc;
 const nat=p.bg==="natural",N=low?(nat?160:260):(nat?420:700),pos=new Float32Array(N*3),col=new Float32Array(N*3),vel=new Float32Array(N);
 const pal=nat?[[.5,.9,.45],[.95,.85,.4],[.3,.75,.55]]:[[.2,.85,.8],[.5,.4,1],[.9,.4,.9]];
 for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*80;pos[i*3+1]=(Math.random()-.5)*50;pos[i*3+2]=(Math.random()-.5)*60;vel[i]=.2+Math.random();const c=pal[i%3];col.set(c,i*3);}
 const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(pos,3));g.setAttribute("color",new T.BufferAttribute(col,3));
 const pts=new T.Points(g,new T.PointsMaterial({size:nat?.55:.32,vertexColors:true,transparent:true,opacity:.8,depthWrite:false,blending:T.AdditiveBlending}));sc.add(pts);
 let mx=0,my=0;FX.mv=e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;};addEventListener("pointermove",FX.mv,{passive:true});
 let last=0;const fps=low?30:60;
 function tick(t){FX.raf=requestAnimationFrame(tick);if(document.hidden||t-last<1000/fps-1)return;last=t;const a=g.attributes.position.array;
  for(let i=0;i<N;i++){const k=i*3;if(nat){a[k+1]-=vel[i]*.02;a[k]+=Math.sin(t*.0004+i)*.012;if(a[k+1]<-26)a[k+1]=26;}else{a[k+2]+=vel[i]*.12;if(a[k+2]>30)a[k+2]=-30;}}
  g.attributes.position.needsUpdate=true;cam.position.x+=(mx*8-cam.position.x)*.03;cam.position.y+=(-my*5-cam.position.y)*.03;cam.lookAt(0,0,0);r.render(sc,cam);}
 reduce?r.render(sc,cam):FX.raf=requestAnimationFrame(tick);
}
addEventListener("resize",()=>{if(FX.r){FX.r.setSize(innerWidth,innerHeight,false);}});

/* ---------- Hộp thoại ---------- */
function modal(html,mount,locked){const o=document.createElement("div");o.className="ov";o.innerHTML='<div class="box g" role="dialog" aria-modal="true">'+html+'</div>';
 const close=()=>o.remove();if(!locked)o.addEventListener("pointerdown",e=>{if(e.target===o)close();});document.body.appendChild(o);mount&&mount(o.firstChild,close);return close;}

/* ---------- Thiết lập lần đầu (bắt buộc) ---------- */
function setup(){let bg=null,st=null;
 modal('<h2>Thiết lập giao diện</h2><label>BỐI CẢNH</label><div class="row"><button class="opt" data-k="bg" data-v="natural"><b>Natural</b><small>Thiên nhiên, hạt phấn trôi nhẹ</small></button><button class="opt" data-k="bg" data-v="dynamic"><b>Dynamic</b><small>Không gian kỹ thuật số</small></button></div><label>PHONG CÁCH</label><div class="row"><button class="opt" data-k="st" data-v="nox"><b>Nox</b><small>Tối giản, không kính mờ</small></button><button class="opt" data-k="st" data-v="glass"><b>Liquid Glass</b><small>Kính trong, blur, phản chiếu</small></button></div><button class="btn p" id="ok" disabled>Bắt đầu</button>',(b,close)=>{

/* ---------- Tiện ích ---------- */
function rUtil(m){const items=(S.data[S.cat]||[]).filter(x=>!S.q||(x.name+" "+x.desc).toLowerCase().includes(S.q));
 m.innerHTML='<div class="row"><div style="flex:1;min-width:200px;position:relative"><input class="in" id="q" placeholder="Tìm kiếm…" value="'+esc(S.q)+'"></div><button class="btn p" id="add">'+IC("plus")+'Đăng bài</button></div><div class="row" style="margin-top:12px">'+CATS.map(c=>'<button class="chip '+(c.id===S.cat?"on":"")+'" data-c="'+esc(c.id)+'">'+esc(c.label)+' ('+(S.data[c.id]||[]).length+')</button>').join("")+'</div>'
 +(items.length?'<div class="grid">'+items.map(x=>'<button class="card g" data-k="'+esc(x.key)+'"><b>'+IC(catOf(S.cat).ic)+esc(x.name)+'</b><p>'+esc(x.desc)+'</p><small>'+new Date(x.ts||0).toLocaleDateString("vi-VN")+'</small></button>').join("")+'</div>':'<div class="empty g">Chưa có mục nào.</div>');
 const q=$("#q");q.oninput=()=>{S.q=q.value.toLowerCase();const p=q.selectionStart;rUtil(m);const n=$("#q");n.focus();n.setSelectionRange(p,p);};
 m.onclick=e=>{const c=e.target.closest("[data-c]"),k=e.target.closest("[data-k]");if(c){S.cat=c.dataset.c;rUtil(m);}else if(k)detail(S.cat,k.dataset.k);else if(e.target.closest("#add"))S.user?submitUI():loginUI();};}
function detail(cid,key){const c=catOf(cid),x=(S.data[cid]||[]).find(i=>i.key===key);if(!c||!x)return;const link=location.origin+location.pathname+"#p/"+cid+"/"+key;
 modal('<h2>'+esc(x.name)+'</h2><small style="color:var(--t2)">'+esc(c.label)+'</small><p style="color:var(--t2);line-height:1.6">'+esc(x.desc)+'</p>'+(x.code?'<pre id="cd"></pre>':'')+'<div class="row">'+(x.code?'<button class="btn p" id="cp">'+IC("copy")+'Sao chép</button>':(vUrl(x.url)?'<a class="btn p" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+IC("link")+'Mở liên kết</a>':""))+'<button class="btn" id="sh">'+IC("share")+'Chia sẻ</button></div>',b=>{
  if(x.code)b.querySelector("#cd").textContent=x.code;
  const cp=b.querySelector("#cp");if(cp)cp.onclick=()=>navigator.clipboard.writeText(x.code).then(()=>toast("Đã sao chép."),()=>toast("Không sao chép được."));
  b.querySelector("#sh").onclick=()=>navigator.clipboard.writeText(link).then(()=>toast("Đã chép liên kết."),()=>toast(link));});}
function submitUI(){modal('<h2>Đăng bài (chờ Dev duyệt)</h2><label>DANH MỤC</label><select class="in" id="sc">'+CATS.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.label)+'</option>').join("")+'</select><input class="in" id="sn" placeholder="Tên" maxlength="80"><textarea class="in" id="sd" placeholder="Mô tả" maxlength="500"></textarea><input class="in" id="su" placeholder="https://…"><textarea class="in" id="sx" placeholder="Mã script"></textarea><button class="btn p" id="sb">Gửi duyệt</button>',(b,close)=>{
  const sync=()=>{const c=catOf(b.querySelector("#sc").value);b.querySelector("#su").style.display=c.mode==="code"?"none":"";b.querySelector("#sx").style.display=c.mode==="code"?"":"none";};b.querySelector("#sc").onchange=sync;sync();
  b.querySelector("#sb").onclick=()=>{const c=catOf(b.querySelector("#sc").value),n=clean(b.querySelector("#sn").value,80).trim();if(!n)return toast("Nhập tên.");
   const p={cat:c.id,name:n,desc:clean(b.querySelector("#sd").value),by:clean(S.user.name,60),createdAt:TS()};
   if(c.mode==="code"){p.code=b.querySelector("#sx").value.slice(0,20000);if(!p.code.trim())return toast("Nhập mã.");}else{const u=b.querySelector("#su").value.trim();if(!vUrl(u))return toast("Link phải bắt đầu bằng http(s)://");p.url=u;}
   db.ref("nox_pending/"+S.user.uid).push(p).then(()=>{close();toast("Đã gửi, chờ Dev duyệt.");}).catch(()=>toast("Gửi thất bại (kiểm tra quyền)."));};});}

/* ---------- Báo cáo & góp ý ---------- */
function rReport(m){if(!S.user){m.innerHTML='<div class="empty g">Đăng nhập để gửi báo cáo.<br><br><button class="btn p" id="lg">Đăng nhập</button></div>';$("#lg").onclick=loginUI;return;}
 m.innerHTML='<section class="g" style="padding:20px;display:flex;flex-direction:column;gap:12px"><h2>Gửi báo cáo / góp ý</h2><textarea class="in" id="rt" maxlength="1500" placeholder="Nội dung…"></textarea><button class="btn p" id="rs">Gửi</button></section><section class="g" style="padding:20px;margin-top:14px"><h2>Đã gửi</h2><div id="rl"></div></section>';
 $("#rs").onclick=()=>{const t=clean($("#rt").value,1500).trim();if(!t)return toast("Nhập nội dung.");db.ref("nox_reports/"+S.user.uid).push({text:t,email:S.user.email,read:false,createdAt:TS()}).then(()=>{$("#rt").value="";toast("Đã gửi.");}).catch(()=>toast("Gửi thất bại."));};
 db.ref("nox_reports/"+S.user.uid).limitToLast(20).once("value").then(s=>{const v=s.val()||{};$("#rl")&&($("#rl").innerHTML=Object.keys(v).reverse().map(k=>'<div class="li"><span>'+esc(v[k].text)+(v[k].reply?'<br><small style="color:var(--b)">Phản hồi: '+esc(v[k].reply)+'</small>':"")+'</span><small>'+(v[k].read?"Đã đọc":"Chưa đọc")+'</small></div>').join("")||'<div class="empty">Chưa có.</div>');}).catch(()=>{});}

/* ---------- Cài đặt ---------- */
function rSet(m){const p=S.pref||{},u=S.user;
 m.innerHTML='<section class="g" style="padding:20px;display:flex;flex-direction:column;gap:12px"><h2>Hồ sơ</h2>'+(u?'<div class="li"><span>'+esc((S.prof&&S.prof.displayName)||u.name)+'<br><small style="color:var(--t2)">'+esc(u.email)+'</small></span></div><input class="in" id="dn" maxlength="24" placeholder="Tên hiển thị mới"><button class="btn" id="sn">Đổi tên (7 ngày/lần)</button><button class="btn d" id="so">Đăng xuất</button>':'<button class="btn p" id="lg">Đăng nhập</button>')+'</section>'
 +'<section class="g" style="padding:20px;margin-top:14px;display:flex;flex-direction:column;gap:12px"><h2>Giao diện</h2><label>Bối cảnh</label><div class="row">'+["natural","dynamic"].map(v=>'<button class="chip '+(p.bg===v?"on":"")+'" data-p="bg" data-v="'+v+'">'+(v==="natural"?"Natural":"Dynamic")+'</button>').join("")+'</div><label>Phong cách</label><div class="row">'+["nox","glass"].map(v=>'<button class="chip '+(p.st===v?"on":"")+'" data-p="st" data-v="'+v+'">'+(v==="nox"?"Nox":"Liquid Glass")+'</button>').join("")+'</div><label>Hiệu ứng</label><div class="row"><button class="chip '+(p.lite?"on":"")+'" data-p="lite" data-v="1">Tiết kiệm (máy yếu)</button><button class="chip '+(!p.lite?"on":"")+'" data-p="lite" data-v="">Đầy đủ</button></div></section>';
 m.onclick=e=>{const c=e.target.closest("[data-p]");if(c){savePref({[c.dataset.p]:c.dataset.p==="lite"?!!c.dataset.v:c.dataset.v});rSet(m);return;}
  if(e.target.id==="lg")loginUI();if(e.target.id==="so")auth.signOut().then(()=>toast("Đã đăng xuất."));
  if(e.target.id==="sn"){const n=clean($("#dn").value,24).trim(),last=(S.prof&&S.prof.nameChangedAt)||0;if(n.length<2)return toast("Tên quá ngắn.");
   if(Date.now()-last<WEEK)return toast("Chỉ đổi tên mỗi 7 ngày.");
   db.ref("nox_profiles/"+u.uid).set({displayName:n,nameChangedAt:TS()}).then(()=>db.ref("nox_profiles/"+u.uid).once("value")).then(s=>{S.prof=s.val();toast("Đã đổi tên.");rSet(m);}).catch(()=>toast("Không đổi được (chưa đủ 7 ngày hoặc thiếu quyền)."));}};}

/* ---------- Dev Panel (quyền thật nằm ở database.rules.json) ---------- */
let devTab="pend";
function rDev(m){if(!S.dev){go("home");return;}
 const T=[["pend","Chờ duyệt ("+S.pend.length+")"],["post","Bài đăng"],["rep","Báo cáo ("+S.reps.filter(r=>!r.read).length+")"],["cat","Danh mục"]];
 let h='<div class="row">'+T.map(t=>'<button class="chip '+(devTab===t[0]?"on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>').join("")+'</div><section class="g" style="padding:18px;margin-top:12px">';
 if(devTab==="pend")h+=S.pend.map(x=>'<div class="li"><span><b>'+esc(x.name)+'</b> · '+esc((catOf(x.cat)||{label:x.cat}).label)+'<br><small style="color:var(--t2)">'+esc(x.by)+'</small></span><button class="btn p" data-ap="'+esc(x.uid+"/"+x.key)+'">'+IC("plus")+'Duyệt</button><button class="btn d" data-rj="'+esc(x.uid+"/"+x.key)+'">'+IC("x")+'</button></div>').join("")||'<div class="empty">Không có bài chờ.</div>';
 if(devTab==="post")h+=CATS.map(c=>(S.data[c.id]||[]).map(x=>'<div class="li"><span>'+esc(x.name)+' <small>· '+esc(c.label)+'</small></span><button class="btn d" data-dl="'+esc(c.id+"/"+x.key)+'">Xóa</button></div>').join("")).join("")||'<div class="empty">Trống.</div>';
 if(devTab==="rep")h+=S.reps.map(r=>'<div class="li"><span>'+esc(r.text)+'<br><small style="color:var(--t2)">'+esc(r.email)+(r.read?" · đã đọc":"")+(r.reply?" · đã phản hồi":"")+'</small></span><button class="btn" data-rr="'+esc(r.uid+"/"+r.key)+'">Phản hồi</button></div>').join("")||'<div class="empty">Chưa có.</div>';
 if(devTab==="cat")h+='<div class="row"><input class="in" id="cn" placeholder="Tên danh mục" maxlength="24" style="flex:1"><select class="in" id="cm" style="width:auto"><option value="url">Link</option><option value="code">Code</option></select><button class="btn p" id="ca">Thêm</button></div>'+Object.keys(S.cx).map(k=>'<div class="li"><span>'+esc(S.cx[k].label)+'</span><button class="btn d" data-cd="'+esc(k)+'">Xóa</button></div>').join("");
 m.innerHTML=h+'</section>';
 m.onclick=e=>{const t=e.target.closest("[data-t]");if(t){devTab=t.dataset.t;return rDev(m);}
  const q=a=>e.target.closest("["+a+"]"),ap=q("data-ap"),rj=q("data-rj"),dl=q("data-dl"),rr=q("data-rr"),cd=q("data-cd");
  if(ap){const [uid,k]=ap.dataset.ap.split("/"),x=S.pend.find(i=>i.uid===uid&&i.key===k),c=x&&catOf(x.cat);if(!c)return toast("Danh mục không tồn tại.");
   const nk=db.ref(ND+"/"+c.node).push().key,it={name:x.name,desc:x.desc||"",by:x.by||"",ownerUid:uid,createdAt:TS()};if(x.code)it.code=x.code;if(x.url)it.url=x.url;
   db.ref().update({[ND+"/"+c.node+"/"+nk]:it,["nox_pending/"+uid+"/"+k]:null}).then(()=>toast("Đã duyệt.")).catch(()=>toast("Thất bại (kiểm tra rules)."));}
  if(rj&&confirm("Từ chối bài này?"))db.ref("nox_pending/"+rj.dataset.rj).remove().catch(()=>toast("Thất bại."));
  if(dl&&confirm("Xóa bài?")){const [ci,k]=dl.dataset.dl.split("/");db.ref(ND+"/"+catOf(ci).node+"/"+k).remove().catch(()=>toast("Thất bại."));}
  if(rr){const [uid,k]=rr.dataset.rr.split("/"),t=prompt("Nội dung phản hồi:");if(t)db.ref("nox_reports/"+uid+"/"+k).update({reply:clean(t,500),read:true}).then(()=>toast("Đã phản hồi.")).catch(()=>toast("Thất bại."));}
  if(e.target.closest("#ca")){const n=clean($("#cn").value,24).trim();if(n)db.ref("nox_cats").push({label:n,mode:$("#cm").value,createdAt:TS()}).catch(()=>toast("Thất bại."));}
  if(cd&&confirm("Xóa danh mục và toàn bộ bài trong đó?")){const k=cd.dataset.cd;db.ref().update({["nox_cats/"+k]:null,[ND+"/cx_"+k]:null}).catch(()=>toast("Thất bại."));}};}

/* ---------- Dữ liệu & loading có lỗi/thử lại ---------- */
const nI=(k,o)=>{o=o&&typeof o==="object"?o:{name:String(o||"")};return{key:k,name:o.name||o.title||"(không tên)",desc:o.desc||o.description||o.note||"",url:o.url||o.link||o.href||"",code:o.code||o.script||"",ts:+(o.updatedAt||o.createdAt||0)||0};};
const listened={};
function listenCat(c){if(listened[c.id])return;listened[c.id]=1;db.ref(ND+"/"+c.node).on("value",s=>{const v=s.val()||{};S.data[c.id]=Object.keys(v).map(k=>nI(k,v[k])).sort((a,b)=>b.ts-a.ts);if(S.page==="util"||S.page==="dev")render();},()=>{S.data[c.id]=S.data[c.id]||[];});}
function listenDev(){if(!S.dev||listenDev.on)return;listenDev.on=1;
 db.ref("nox_pending").on("value",s=>{const v=s.val()||{};S.pend=[];Object.keys(v).forEach(u=>Object.keys(v[u]||{}).forEach(k=>S.pend.push(Object.assign({uid:u,key:k},v[u][k]))));if(S.page==="dev")render();},()=>{});
 db.ref("nox_reports").on("value",s=>{const v=s.val()||{};S.reps=[];Object.keys(v).forEach(u=>Object.keys(v[u]||{}).forEach(k=>S.reps.push(Object.assign({uid:u,key:k},v[u][k]))));if(S.page==="dev")render();},()=>{});}
function openHash(){const m=location.hash.match(/^#p\/([^/]+)\/([^/]+)$/);if(m){S.cat=m[1];go("util");detail(m[1],m[2]);}}
function boot(){$("#retry").hidden=true;$("#ltx").textContent="Đang tải dữ liệu…";$("#loader").classList.remove("h");
 if(!db){$("#ltx").textContent="Không kết nối được Firebase.";$("#retry").hidden=false;return;}
 const fail=setTimeout(()=>{$("#ltx").textContent="Tải quá lâu hoặc mất kết nối.";$("#retry").hidden=false;},9000);
 db.ref("nox_cats").once("value").then(s=>{S.cx=s.val()||{};CATS=BASE.concat(Object.keys(S.cx).map(k=>({id:"c_"+k,label:clean(S.cx[k].label,24)||"Mục",node:"cx_"+k,ic:S.cx[k].mode==="code"?"code":"link",mode:S.cx[k].mode==="code"?"code":"url"})));
  return Promise.all(CATS.map(c=>db.ref(ND+"/"+c.node).once("value")));}).then(()=>{clearTimeout(fail);CATS.forEach(listenCat);
  db.ref("nox_cats").on("value",s=>{S.cx=s.val()||{};CATS=BASE.concat(Object.keys(S.cx).map(k=>({id:"c_"+k,label:clean(S.cx[k].label,24)||"Mục",node:"cx_"+k,ic:S.cx[k].mode==="code"?"code":"link",mode:S.cx[k].mode==="code"?"code":"url"})));CATS.forEach(listenCat);if(!catOf(S.cat))S.cat="script";if(S.page==="util"||S.page==="dev")render();},()=>{});
  $("#loader").classList.add("h");render();openHash();}).catch(()=>{clearTimeout(fail);$("#ltx").textContent="Không tải được dữ liệu.";$("#retry").hidden=false;});}
$("#retry").onclick=boot;
if(auth)auth.onAuthStateChanged(u=>{applyUser(u);listenDev();});
document.addEventListener("visibilitychange",()=>{});
applyPref();if(!S.pref||!S.pref.bg||!S.pref.st)setup();
go("home");boot();
</script>
</body>
</html>
