}

function shrink(file,max,q){
  return new Promise((ok,no)=>{
    const i=new Image(),u=URL.createObjectURL(file);
    i.onload=()=>{URL.revokeObjectURL(u);let d="";for(const[m,k]of[[max,q],[max*.75,q*.8],[max*.5,q*.7]]){const r=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext("2d").drawImage(i,0,0,c.width,c.height);d=c.toDataURL("image/jpeg",k);if(d.length<260000)break}d.length<260000?ok(d):no(new Error("Ảnh quá lớn, hãy chọn ảnh nhỏ hơn"))};
    i.onerror=()=>no(new Error("Không đọc được ảnh"));i.src=u;
  });
}

  sort:i=>{sortBy=i;renderPosts();renderPop()},more:()=>{limit+=PAGE;loadPosts()},retry:i=>RT[i]&&RT[i](),
  open:i=>{shut($("mMail"));openPost(i)},like,
  copy:i=>navigator.clipboard.writeText(cur[i].code).then(()=>toast("Đã sao chép")),
  share:async i=>{const u=location.origin+location.pathname+"#/post/"+i;try{if(navigator.share)await navigator.share({title:cur[i].title,url:u});else{await navigator.clipboard.writeText(u);toast("Đã sao chép liên kết")}}catch(e){}},
  form:()=>{shut($("drawer"));openForm()},edit:i=>{shut($("mDetail"));shut($("mDev"));openForm(cur[i])},sync:syncForm,submit:submitPost,
  del:async i=>{if(!confirm("Xóa bài này?"))return;try{await remove(R(cur[i]?.pending?`pending/${cur[i].authorId}/${i}`:"pub/posts/"+i));shut($("mDetail"));toast("Đã xóa");loadPosts();if(view==="mine")loadMine();if($("mDev").classList.contains("on"))devRender()}catch(e){toast(errMsg(e))}},
  dimg:i=>pickImg(d=>{$(i).value=d;toast("Đã chọn ảnh")},i==="fThumb"?480:600,.65),
  report:i=>{shut($("mDetail"));openReport(i)},rsend:sendReport,
  dm,mail:()=>{drawMail();$("mMail").classList.add("on")},mdel:i=>remove(R(`inbox/${me.uid}/${i}`)).catch(e=>toast(errMsg(e))),rdone:i=>remove(R("reports/"+i)).catch(e=>toast(errMsg(e))),
  wtab:i=>{$("wPosts").hidden=i!=="posts";$("wRooms").hidden=i!=="rooms";$("wtPosts").className=i==="posts"?"pri":"";$("wtRooms").className=i==="rooms"?"pri":""},
  wimg:()=>pickImg(d=>{wImg=d;$("wImgP").textContent="Đã chọn ảnh ✓"},900,.65),
  wpost:async()=>{
    if(!me)return openAuth();const t=$("wText").value.trim();if(!t&&!wImg)return toast("Hãy nhập nội dung hoặc chọn ảnh");
    try{await set(push(R("world/posts")),{uid:me.uid,name:me.name,text:t,img:wImg,at:Date.now()});$("wText").value="";wImg="";$("wImgP").textContent="";loadWorld()}catch(e){toast(errMsg(e))}
  },
  wdel:async i=>{if(confirm("Xóa bài viết này?"))try{await remove(R("world/posts/"+i));remove(R("world/replies/"+i)).catch(()=>{});loadWorld()}catch(e){toast(errMsg(e))}},
  wrep:async i=>{const d=$("rp-"+i);d.hidden=!d.hidden;if(!d.hidden)await drawReps(i)},
  wsend:async i=>{if(!me)return openAuth();const t=$("ri-"+i).value.trim();if(!t)return;try{await set(push(R("world/replies/"+i)),{uid:me.uid,name:me.name,text:t,at:Date.now()});drawReps(i)}catch(e){toast(errMsg(e))}},
  rmake:async()=>{
    if(!me)return openAuth();const n=$("rName").value.trim(),pw=$("rPw").value;if(n.length<2)return toast("Tên nhóm tối thiểu 2 ký tự");
    try{
      const k=push(R("rooms")).key,h=pw?await sha(k+":"+pw):"";
      await set(R("rooms/"+k),{name:n,owner:me.uid,hasPw:!!pw,at:Date.now()});
      if(pw)await set(R("roomKeys/"+k),h);
      await set(R(`members/${k}/${me.uid}`),pw?h:true);
      $("rName").value=$("rPw").value="";toast("Đã tạo nhóm");loadWorld();openRoom(k);
    }catch(e){toast(errMsg(e))}
  },
  room:openRoom,
  rjoin:async()=>{
    const pw=$("rjPw").value,m=$("rjMsg");if(!pw)return m.textContent="Chưa nhập mật khẩu";
    try{await set(R(`members/${curRoom.id}/${me.uid}`),await sha(curRoom.id+":"+pw));enterRoom()}
    catch(e){m.textContent=/permission/i.test(e.code+e.message)?"Sai mật khẩu nhóm":errMsg(e)}
  },
  csend:()=>{const t=$("cIn").value.trim();if(t){$("cIn").value="";sendMsg(t)}},cimg:()=>pickImg(d=>sendMsg("",d),800,.6),
  dev:()=>{shut($("drawer"));shut($("mMail"));$("mDev").classList.add("on");devRender()},dtab:i=>{devTab=i;devRender()},
  dadd:async i=>{
    const n=$("d1").value.trim(),img=$("d2").value.trim(),url=$("d3")?$("d3").value.trim():"";
    if(!n)return toast("Cần nhập tên");if(url&&!safeUrl(url))return toast("Link phải bắt đầu bằng https://");if(img&&!imgSrc(img))return toast("Ảnh không hợp lệ");
    try{await set(push(R(i)),{name:n,img,...(i==="pub/menu"?{url}:{}),order:+$("d4").value||0});devRender();i==="pub/menu"?loadMenu():loadGames()}catch(e){toast(errMsg(e))}
  },
  ddel:async i=>{if(confirm("Xóa mục này?"))try{await remove(R(i));devRender();loadMenu();loadGames();loadCats()}catch(e){toast(errMsg(e))}},
  addcat:async()=>{
    if(!me)return openAuth();const n=(prompt("Tên mục mới")||"").trim().slice(0,20),id=n.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16);
    if(!n)return;if(!id)return toast("Tên mục không hợp lệ");if(TYPES[id])return toast("Mục này đã có");
    try{await set(R("pub/categories/"+id),{name:n,actions:["open"]});await loadCats();fillTypes();$("fType").value=id;syncForm();toast("Đã thêm mục "+n)}catch(e){toast(errMsg(e))}
  },
  addgal:()=>pickImg(d=>{if(gal.length>=4)return toast("Tối đa 4 ảnh");gal.push(d);renderGal()},800,.65),rmgal:i=>{gal.splice(+i,1);renderGal()},
  zoom:(i,b)=>{if(b.src.startsWith("data:"))fetch(b.src).then(r=>r.blob()).then(x=>window.open(URL.createObjectURL(x)));else window.open(b.src)},
  rate:async(i,b)=>{
    if(!me)return openAuth();if(cur[i]?.pending)return toast("Bài đang chờ duyệt");const s=+b.dataset.v;
    try{
      const old=(await val(`ratings/${me.uid}/${i}`))||0,a=await runTransaction(R(`pub/posts/${i}/ratingSum`),n=>(n||0)-old+s),c=old?null:await runTransaction(R(`pub/posts/${i}/ratingCount`),n=>(n||0)+1);
      await set(R(`ratings/${me.uid}/${i}`),s);myRates[i]=s;cur[i].ratingSum=a.snapshot.val();if(c)cur[i].ratingCount=c.snapshot.val();
      if($("stars"))$("stars").innerHTML=starsHtml(i);renderPosts();
    }catch(e){toast(errMsg(e))}
  },
  dview:i=>{cur[i]=window._dp[i];cur[i].pending=true;shut($("mDev"));openPost(i)},
  dok:async i=>{
    const p=window._dp[i];if(!p||!confirm("Duyệt bài này?"))return;const{id,pending,rejected,rejectReason,...v}=p;
    try{await update(R(""),{["pub/posts/"+i]:{...v,createdAt:Date.now()},[`pending/${p.authorId}/${i}`]:null});toast("Đã duyệt");devRender();loadPosts()}catch(e){toast(errMsg(e))}
  },
  dno:async i=>{const p=window._dp[i],why=prompt("Lý do từ chối (tuỳ chọn):");if(why===null)return;try{await update(R(`pending/${p.authorId}/${i}`),{rejected:true,rejectReason:why.trim().slice(0,200)});devRender()}catch(e){toast(errMsg(e))}},
  csave:async i=>{const a=[...document.querySelectorAll(`input[data-c="${i}"]:checked`)].map(x=>x.value);try{await set(R("pub/categories/"+i),{name:TYPES[i].n,actions:a.length?a:["none"]});await loadCats();devRender();toast("Đã lưu")}catch(e){toast(errMsg(e))}},
  ssave:async()=>{try{const an=$("sAnn").value.trim().slice(0,300);await update(R("pub/settings"),{moderation:$("sMod").checked,announcement:an||null});modOn=$("sMod").checked;annTxt=an;$("annT").textContent=an;$("ann").hidden=!an;toast("Đã lưu cài đặt")}catch(e){toast(errMsg(e))}},
  dren:async i=>{const n=(prompt("Tên mới:")||"").trim();if(!n)return;try{await update(R(i),{name:n});devRender();loadMenu();loadGames()}catch(e){toast(errMsg(e))}},
  dfeat:async(i,b)=>{try{await update(R("pub/posts/"+i),{featured:b.dataset.v==="1"});devRender();loadPosts()}catch(e){toast(errMsg(e))}},
  annx:()=>{$("ann").hidden=true},
  dlock:async(i,b)=>{try{await update(R("pub/posts/"+i),{locked:b.dataset.v==="1"});devRender();loadPosts()}catch(e){toast(errMsg(e))}},
  dhide:async(i,b)=>{try{await update(R(i),{published:b.dataset.v==="1"});devRender();loadGames()}catch(e){toast(errMsg(e))}},
  dlabel:async i=>{const t=prompt("Nhãn hiển thị trên thẻ (cách nhau bằng dấu phẩy, tối đa 4):",(cur[i]?.labels||[]).join(", "));if(t===null)return;try{await update(R("pub/posts/"+i),{labels:t.split(",").map(x=>x.trim().slice(0,16)).filter(Boolean).slice(0,4)});devRender();loadPosts()}catch(e){toast(errMsg(e))}},
  dpin:async(i,b)=>{try{await update(R("pub/posts/"+i),{pinned:b.dataset.v==="1"});devRender();loadPosts()}catch(e){toast(errMsg(e))}}
};
document.addEventListener("click",e=>{
  if(e.target.classList.contains("modal")||e.target.classList.contains("drawer"))return shut(e.target);
  const b=e.target.closest("[data-a]");
  if(!b){if(!e.target.closest("#pop,#sbar"))closePop();return}
  if(b.tagName==="SELECT")return;
  const f=A[b.dataset.a];if(f)f(b.dataset.i,b);
});
$("fType").addEventListener("change",syncForm);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closePop();document.querySelectorAll(".modal.on,.drawer.on").forEach(shut)}else if(e.key==="Enter"&&e.target.closest("#mAuth")&&e.target.tagName==="INPUT")authGo()});
$("aName").addEventListener("input",chkName);$("aPass").addEventListener("input",showMeter);$("aPass2").addEventListener("input",chk2);
$("q").addEventListener("input",()=>{if(view!=="home"||curType||curGame){curType=curGame="";setView("home");loadPosts()}else renderPosts()});
async function openFromHash(){
  const m=location.hash.match(/^#\/post\/([\w-]+)$/);if(!m)return;
  if(!cur[m[1]])try{const d=await val("pub/posts/"+m[1]);if(d)cur[m[1]]={id:m[1],...d}}catch(e){}
  if(cur[m[1]])openPost(m[1]);
}
const qp=new URLSearchParams(location.search).get("q");if(qp)$("q").value=qp;
A.wtab("posts");authTab("login");renderPop();renderDrawer();loadMenu();loadCats();loadSettings();loadGames().then(loadPosts).then(openFromHash);
</script>
