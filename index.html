   if(t==="rain"||t==="storm"){p.y+=p.s;p.x+=p.w;if(p.y>this.H){p.y=-20;p.x=Math.random()*this.W}c.strokeStyle="rgba(180,210,255,.5)";c.lineWidth=1.2;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.w,p.y-p.l);c.stroke();}

function buildTabs(){$("#devTabs").innerHTML=TABS.map(function(t){return '<button class="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");}
function openDev(){buildTabs();$("#dev").classList.add("on");showTab("content");}
function showTab(t){document.querySelectorAll("#dev .tab").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});document.querySelectorAll("#dev .pane").forEach(function(p){p.classList.toggle("on",p.id==="p-"+t)});}
$("#devTabs").addEventListener("click",function(e){var b=e.target.closest(".tab");if(b)showTab(b.dataset.t);});
function buildCatSeg(){$("#catSeg").innerHTML=CATS.map(function(c){return '<button data-c="'+c.id+'" class="'+(state.fc===c.id?"on":"")+'">'+esc(c.label)+'</button>'}).join("");$("#wCode").style.display=state.fc==="script"?"flex":"none";$("#wUrl").style.display=state.fc==="script"?"none":"flex";}
$("#catSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(b){state.fc=b.dataset.c;buildCatSeg();}});
$("#fSave").addEventListener("click",function(){if(!state.dev||!db)return;var name=$("#fName").value.trim();if(!name)return;var c=catOf(state.fc);var p={name:name,desc:$("#fDesc").value.trim(),updatedAt:firebase.database.ServerValue.TIMESTAMP};if(state.fc==="script")p.code=$("#fCode").value;else p.url=$("#fUrl").value;
 if(state.edit){db.ref(ND+"/"+c.node+"/"+state.edit).update(p);state.edit=null;$("#fCancel").style.display="none";}else db.ref(ND+"/"+c.node).push(Object.assign(p,{createdAt:firebase.database.ServerValue.TIMESTAMP}));
 $("#fName").value=$("#fDesc").value=$("#fUrl").value=$("#fCode").value="";});
$("#fCancel").addEventListener("click",function(){state.edit=null;$("#fCancel").style.display="none";});
function renderDevList(){$("#devList").innerHTML=CATS.map(function(c){var it=state.data[c.id]||[];return '<details class="lg" style="border-radius:14px;overflow:hidden"><summary style="padding:12px;font-weight:700;cursor:pointer">'+esc(c.label)+' ('+it.length+')</summary>'+it.map(function(x){return '<div style="display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--bs)"><span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.name)+'</span><button class="btn btn-g" data-ed="'+c.id+':'+esc(x.key)+'">Sửa</button><button class="btn btn-g" data-del="'+c.id+':'+esc(x.key)+'">Xóa</button></div>'}).join("")+"</details>"}).join("");}
$("#devList").addEventListener("click",function(e){if(!state.dev||!db)return;var ed=e.target.closest("[data-ed]");var de=e.target.closest("[data-del]");
 if(ed){var a1=ed.dataset.ed.split(":");var ci=a1[0],k=a1[1];var it=(state.data[ci]||[]).find(function(x){return x.key===k});if(it){state.fc=ci;buildCatSeg();state.edit=k;$("#fName").value=it.name;$("#fDesc").value=it.desc||"";$("#fUrl").value=it.url||"";$("#fCode").value=it.code||"";$("#fCancel").style.display="flex";}}
 if(de){var a2=de.dataset.del.split(":");db.ref(ND+"/"+catOf(a2[0]).node+"/"+a2[1]).remove();}});
function fillEnvSel(){$("#manWx").innerHTML=["none","clear","rain","snow","fog","storm","wind","dust"].map(function(w){return "<option>"+w+"</option>"}).join("");$("#lockEnv").innerHTML=["normal","halloween","christmas","tet","summer","winter","spring","autumn"].map(function(t){return "<option>"+t+"</option>"}).join("");}
function syncEnvUI(){var s=state.settings;$("#envAuto").classList.toggle("on",s.envMode==="auto");$("#envManual").classList.toggle("on",s.envMode==="manual");$("#manWxWrap").style.display=s.envMode==="manual"?"flex":"none";$("#lockOn").checked=!!s.lockOn;$("#lockWrap").style.display=s.lockOn?"flex":"none";$("#manWx").value=s.manualWeather||"clear";$("#lockEnv").value=s.lockEnv||"halloween";}
$("#envAuto").addEventListener("click",function(){state.settings.envMode="auto";syncEnvUI();});
$("#envManual").addEventListener("click",function(){state.settings.envMode="manual";syncEnvUI();});
$("#lockOn").addEventListener("change",function(e){state.settings.lockOn=e.target.checked;syncEnvUI();});
$("#envSave").addEventListener("click",function(){if(!state.dev||!db)return;state.settings.manualWeather=$("#manWx").value;state.settings.lockEnv=$("#lockEnv").value;db.ref("nox_settings").update({envMode:state.settings.envMode,manualWeather:state.settings.manualWeather,lockOn:state.settings.lockOn,lockEnv:state.settings.lockEnv});applyEnv();toast("Đã lưu environment.");});
$("#anSave").addEventListener("click",function(){if(!state.dev||!db)return;db.ref("nox_notice").update({title:clean($("#anTitle").value),body:clean($("#anBody").value),enabled:$("#anOn").checked,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast("Đã lưu thông báo.");});
$("#utilNoteSave").addEventListener("click",function(){if(!state.dev||!db)return;db.ref("nox_notice").update({util:clean($("#utilNoteIn").value)});toast("Đã lưu note tiện ích.");});
document.querySelectorAll("#p-perf [data-p]").forEach(function(b){b.addEventListener("click",function(){state.settings.perf=b.dataset.p;state.perfEff=b.dataset.p;if(db&&state.dev)db.ref("nox_settings").update({perf:b.dataset.p});applyEnv();document.querySelectorAll("#p-perf [data-p]").forEach(function(x){x.classList.toggle("on",x===b)});});});
let pend=CATS.length,done=false;
function markPend(){pend--;if(pend<=0&&!done){done=true;hideLoader();}}
function hideLoader(){var l=$("#loader");if(l){l.classList.add("hide");setTimeout(function(){l.style.display="none"},600);}}
setTimeout(hideLoader,3000);
if(db){CATS.forEach(function(c){db.ref(ND+"/"+c.node).on("value",function(s){var v=s.val()||{};state.data[c.id]=Object.keys(v).map(function(k){return nI(k,v[k])}).sort(function(a,b){return b.ts-a.ts});renderCat(c.id);renderUtil();markPend();},function(){state.data[c.id]=[];renderCat(c.id);markPend();});});
 db.ref("nox_settings").on("value",function(s){var v=s.val()||{};Object.assign(state.settings,{envMode:v.envMode||"auto",manualWeather:v.manualWeather||"clear",lockOn:!!v.lockOn,lockEnv:v.lockEnv||"halloween",perf:v.perf||"balanced"});state.perfEff=state.settings.perf==="auto"?"balanced":state.settings.perf;syncEnvUI();applyEnv();},function(){});
 db.ref("nox_notice").on("value",function(s){var v=s.val()||{};state.notice=v;state.utilNote=v.util||"";
   var un=$("#utilNote");if(un){if(state.utilNote){un.style.display="block";un.textContent=state.utilNote;}else un.style.display="none";}
   if(state.dev){$("#utilNoteIn").value=state.utilNote;$("#anTitle").value=v.title||"";$("#anBody").value=v.body||"";$("#anOn").checked=!!v.enabled;}
   if(v.enabled&&v.body){var ver=String(v.updatedAt||"");var rec=null;try{rec=JSON.parse(sessionStorage.getItem("ssw_notice_seen")||"null")}catch(_){}if(!(rec&&rec.ver===ver)){$("#ntTitle").textContent=v.title||"Thông báo";$("#ntBody").textContent=v.body;$("#shNotice").classList.add("on");$("#ov").classList.add("on");try{sessionStorage.setItem("ssw_notice_seen",JSON.stringify({ver:ver}))}catch(_){}}}},function(){});
}else{CATS.forEach(function(c){state.data[c.id]=[];renderCat(c.id);});markPend();markPend();markPend();markPend();}
setInterval(applyEnv,30000);
buildCatSeg();fillEnvSel();syncEnvUI();applyUser();renderRoute();tickTime();
var sm=$("#sndMod");if(sm)sm.innerHTML=state.snd?IC.sndOn:IC.sndOff;
state.perfEff=state.settings.perf==="auto"?"balanced":state.settings.perf;
applyEnv();
</script>
</body>
</html>
