/* ═══ TOKENS ═══ */
@property --cat{syntax:"<color>";inherits:true;initial-value:#7c5cff}
:root{--sky-top:#0a0e16;--sky-bot:#14203c;--m1:#16223c;--m2:#101a30;--snow:rgba(255,255,255,.5);--grassB:#2a5f38;--grass:#1d4a2c;--grassF:#12301f;--tree:#0e2418;--sil:#0a1226;
--ap:#7c5cff;--as:#29d6c5;--t1:#f4f7fb;--t2:#a3aec2;--t3:#6b7689;--bs:rgba(255,255,255,.14);
--ez:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.56,.64,1)}
/* GLASS BẬC 3: trong suốt + caustics bên trong, KHÔNG đục */
:root{--g-a:.10;--g-border:rgba(255,255,255,.22);--g-top:rgba(255,255,255,.42);--g-bot:rgba(255,255,255,.12);--g-side:rgba(255,255,255,.14);--g-sh:.28}
body.day{--t1:#101826;--t2:#3d4a66;--t3:#68748f;--bs:rgba(20,30,60,.16);--g-a:.16;--g-border:rgba(255,255,255,.55);--g-top:rgba(255,255,255,.75);--g-bot:rgba(255,255,255,.3);--g-side:rgba(255,255,255,.35);--g-sh:.15}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--t1);min-height:100vh;overflow-x:hidden;background:linear-gradient(var(--sky-top),var(--sky-bot));background-attachment:fixed;-webkit-tap-highlight-color:transparent;transition:background 1s,color .6s}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(128,140,170,.35);border-radius:99px}
:focus-visible{outline:2px solid var(--as);outline-offset:2px}
/* LIQUID GLASS BẬC 3 */
.lg{position:relative;border-radius:26px;
 background:linear-gradient(160deg,rgba(255,255,255,var(--g-a)),rgba(255,255,255,calc(var(--g-a)*.35)) 40%,rgba(255,255,255,calc(var(--g-a)*.6)));
 -webkit-backdrop-filter:blur(12px) saturate(1.7);backdrop-filter:blur(12px) saturate(1.7);
 border:1px solid var(--g-border);
 box-shadow:0 10px 34px rgba(0,0,0,var(--g-sh)),inset 0 1px 0 var(--g-top),inset 0 -1px 0 var(--g-bot),inset 1px 0 0 var(--g-side),inset -1px 0 0 var(--g-side)}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden;
 background:radial-gradient(140px 70px at 18% 22%,rgba(255,255,255,.16),transparent 60%),radial-gradient(180px 90px at 82% 72%,rgba(255,255,255,.10),transparent 60%),radial-gradient(90px 46px at 60% 40%,rgba(255,255,255,.08),transparent 60%);
 animation:caustic 7s ease-in-out infinite alternate}
@keyframes caustic{from{transform:translateX(-4%) }to{transform:translateX(4%)}}
.lg::after{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);pointer-events:none}
.pressed{animation:press .38s var(--sp)}
@keyframes press{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
/* ENV */
#envWrap{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#stars{position:absolute;width:2px;height:2px;border-radius:50%;opacity:0;transition:opacity 1s}
body.tod-night #stars,body.tod-deepnight #stars,body.tod-twilight #stars{opacity:1}
#cel{position:absolute;width:64px;height:64px;border-radius:50%;top:12%;right:14%;background:radial-gradient(circle at 35% 35%,#fff6d8,#ffd76a);box-shadow:0 0 50px 16px rgba(255,220,130,.3);transition:all 1s;will-change:transform}
body.tod-night #cel,body.tod-deepnight #cel{background:radial-gradient(circle at 35% 35%,#f4f7fb,#b9c4dd);box-shadow:0 0 40px 12px rgba(190,205,255,.28)}
.cloud{position:absolute;height:30px;border-radius:99px;background:rgba(255,255,255,.16);filter:blur(5px);animation:cl linear infinite;will-change:transform}
body.day .cloud{background:rgba(255,255,255,.5)}
@keyframes cl{from{transform:translateX(-25%)}to{transform:translateX(120vw)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
body.wx-storm #flash{animation:fl 7s infinite}
@keyframes fl{0%,92%,96%,100%{opacity:0}93%,95%{opacity:.45}}
#wind{position:absolute;inset:0;overflow:hidden}
.wstreak{position:absolute;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:wst linear infinite;opacity:.35}
@keyframes wst{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
#envSvg{position:absolute;left:0;right:0;bottom:0;width:100%;height:62vh}
#gGrassBack,#gGrassMid,#gGrassFront{filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
#gGrassBack{animation:gsway 4.6s ease-in-out infinite alternate}
#gGrassMid{animation:gsway 3.6s ease-in-out infinite alternate-reverse}
#gGrassFront{animation:gsway 3s ease-in-out infinite alternate}
@keyframes gsway{from{transform:skewX(-2deg)}to{transform:skewX(2deg)}}
.tree{transform-origin:bottom center;animation:tw2 4.5s ease-in-out infinite alternate}
.tree:nth-child(2n){animation-delay:1.2s}
@keyframes tw2{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.bird{position:absolute;will-change:transform;animation:fly linear infinite}
.bird .wl,.bird .wr{transform-origin:20px 10px;animation:flap .5s ease-in-out infinite alternate}
.bird .wr{animation-name:flapR}
@keyframes flap{from{transform:rotate(14deg)}to{transform:rotate(-10deg)}}
@keyframes flapR{from{transform:rotate(-14deg)}to{transform:rotate(10deg)}}
@keyframes fly{0%{transform:translate(-12vw,0)}50%{transform:translate(50vw,-5vh)}100%{transform:translate(112vw,0)}}
body.tod-night .bird,body.tod-deepnight .bird,body.wx-rain .bird,body.wx-storm .bird{display:none}
#gTHallow,#gTXmas,#gTTet{display:none}
body.theme-halloween #gTHallow{display:block}body.theme-christmas #gTXmas{display:block}body.theme-tet #gTTet{display:block}
#fog{position:absolute;inset:0;opacity:0;transition:opacity 1s;background:linear-gradient(180deg,transparent,rgba(200,210,225,.18),transparent);filter:blur(2px)}
body.wx-rain #fog,body.wx-snow #fog{opacity:.5}body.wx-fog #fog{opacity:.8}body.wx-wind #fog{opacity:.25}
#fx{position:absolute;inset:0}
/* LOADER S + vòng kính */
#loader{position:fixed;inset:0;z-index:700;display:grid;place-items:center;background:linear-gradient(var(--sky-top),var(--sky-bot));transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.lwrap{position:relative;width:130px;height:130px;display:grid;place-items:center}
.lringbase{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.lring{position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 0deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,0) 210deg,rgba(255,255,255,.65) 320deg,rgba(255,255,255,0) 360deg);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));
 animation:spin 1.3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lS{font-size:56px;font-weight:800;color:rgba(255,255,255,.92);padding:10px 22px;border-radius:26px;
 background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(12px) saturate(1.7);backdrop-filter:blur(12px) saturate(1.7);border:1px solid var(--g-border);
 box-shadow:0 10px 30px rgba(0,0,0,.3),inset 0 1px 0 var(--g-top),inset 0 -1px 0 var(--g-bot);animation:lpulse 1.6s ease-in-out infinite}
@keyframes lpulse{50%{transform:scale(1.06)}}
/* HEADER */
#hdr{position:fixed;top:10px;left:12px;right:12px;z-index:100}
#hdr .in{display:flex;align-items:center;gap:8px;padding:8px 10px}
.ibtn{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center}
.ibtn svg{width:19px;height:19px;stroke:var(--t1)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;letter-spacing:.04em}
.brand .lg-sm{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.brand .lg-sm svg{width:19px;height:19px}
.sp{flex:1}
.mod{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:14px;font-size:12px;font-weight:600}
.mod svg{width:15px;height:15px}
@media(max-width:640px){#wtMod .wt-txt{display:none}.brand .tx{display:none}}
/* FAB TIỆN ÍCH GIỮA */
#fabUtil{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:18px;z-index:120;padding:13px 26px;border-radius:99px;font-weight:800;font-size:14px;letter-spacing:.03em;
 box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 var(--g-top),inset 0 -1px 0 var(--g-bot)}
#fabUtil:active{transform:scale(.94)}
/* MENU */
#menu{position:fixed;top:66px;right:12px;z-index:150;width:230px;max-height:70vh;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;transform:scale(.85) translateY(-8px);opacity:0;pointer-events:none;transition:.3s var(--sp)}
#menu.on{transform:none;opacity:1;pointer-events:auto}
.mlink{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;font-weight:600;font-size:13.5px;color:var(--t2)}
.mlink:hover{color:var(--t1);background:rgba(255,255,255,.07)}
.mlink svg{width:18px;height:18px}
/* MAIN */
#main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:86px 14px 90px}
.view{display:none}.view.on{display:block;animation:vin .4s var(--ez)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.vhead h2{font-size:clamp(20px,4.5vw,30px);font-weight:800;flex:1}
.hero{border-radius:28px;padding:26px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,5vw,40px);font-weight:800}
.hero p{color:var(--t2);margin-top:8px;font-size:14px}
/* GRID + CARD */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden;position:relative;transition:transform .3s var(--ez),box-shadow .3s;cursor:pointer}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.3)}
.card h3{font-size:14.5px;font-weight:700}
.card .desc{color:var(--t2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cfoot{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:14px;transition:.25s var(--sp)}
.btn:active{transform:scale(.94)}
.btn svg{width:14px;height:14px}
.btn-p{color:#fff;background:linear-gradient(120deg,var(--ap),var(--as));box-shadow:0 4px 16px rgba(124,92,255,.35)}

.pop{position:fixed;left:50%;top:50%;z-index:180;width:min(560px,94vw);max-height:84vh;display:flex;flex-direction:column;border-radius:28px;transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;transition:.4s var(--sp)}
.pop.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#shUtil{width:min(720px,94vw)}
.p-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.p-h h3{flex:1;font-size:15px;font-weight:800}
.p-b{overflow-y:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:12px}
.utilNote{border-radius:14px;padding:11px 13px;font-size:12.5px;color:var(--t2);background:rgba(255,255,255,.05);border:1px dashed var(--bs)}
.utilGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.utilGrid{grid-template-columns:repeat(4,1fr)}}
.util{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.3s var(--ez)}
.util:hover{transform:translateY(-3px)}
.util .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.util .ic svg{width:21px;height:21px}
.util b{font-size:14px}.util small{color:var(--t2);font-size:11.5px}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.m-h h3{flex:1;font-size:15px;font-weight:800}
.m-b{overflow-y:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:12px}
/* DEV */
#dev{position:fixed;inset:0;z-index:200;display:none;flex-direction:column}
#dev.on{display:flex}
#dev .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--bs)}
#dev .tab{flex:none;padding:8px 14px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.05)}
#dev .tab.on{color:#fff;background:linear-gradient(120deg,var(--ap),var(--as))}
#dev .body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#dev .pane{display:none}#dev .pane.on{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase}
.fld input,.fld select,.fld textarea{padding:11px 12px;border-radius:12px;font-size:14px;color:var(--t1);background:rgba(255,255,255,.06);border:1px solid var(--bs);outline:none}
.fld input:focus{border-color:var(--as)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--bs)}
.seg button.on{color:#fff;background:linear-gradient(120deg,var(--ap),var(--as))}
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .3s var(--sp)}
.sw input:checked+i{background:var(--as)}
.sw input:checked+i::after{transform:translateX(19px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--bs);font-size:13px;font-weight:600}
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:650;display:flex;flex-direction:column;gap:8px;max-width:92vw}
.toast{border-radius:16px;padding:10px 16px;font-size:12.5px;font-weight:600;animation:tin .4s var(--sp)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
@keyframes tout{to{opacity:0;transform:translateY(20px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

function renderDevList(){$("#devList").innerHTML=CATS.map(c=>{const it=state.data[c.id]||[];return `<details class="lg" style="border-radius:14px;overflow:hidden"><summary style="padding:12px;font-weight:700;cursor:pointer">${esc(c.label)} (${it.length})</summary>`+it.map(x=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--bs)"><span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span><button class="btn btn-g" data-ed="${c.id}:${esc(x.key)}">Sửa</button><button class="btn btn-g" data-del="${c.id}:${esc(x.key)}">Xóa</button></div>`).join("")+"</details>";}).join("");}
$("#devList").addEventListener("click",e=>{if(!state.dev||!db)return;const ed=e.target.closest("[data-ed]");const de=e.target.closest("[data-del]");
 if(ed){const[ci,k]=ed.dataset.ed.split(":");const it=(state.data[ci]||[]).find(x=>x.key===k);if(it){state.fc=ci;buildCatSeg();state.edit=k;$("#fName").value=it.name;$("#fDesc").value=it.desc||"";$("#fUrl").value=it.url||"";$("#fCode").value=it.code||"";$("#fCancel").style.display="flex";}}
 if(de){const[ci,k]=de.dataset.del.split(":");db.ref(ND+"/"+catOf(ci).node+"/"+k).remove();}});
function fillEnvSel(){$("#manWx").innerHTML=["none","clear","rain","snow","fog","storm","wind","dust"].map(w=>`<option>${w}</option>`).join("");$("#lockEnv").innerHTML=["normal","halloween","christmas","tet","summer","winter","spring","autumn"].map(t=>`<option>${t}</option>`).join("");}
function syncEnvUI(){const s=state.settings;$("#envAuto").classList.toggle("on",s.envMode==="auto");$("#envManual").classList.toggle("on",s.envMode==="manual");$("#manWxWrap").style.display=s.envMode==="manual"?"flex":"none";$("#lockOn").checked=!!s.lockOn;$("#lockWrap").style.display=s.lockOn?"flex":"none";$("#manWx").value=s.manualWeather||"clear";$("#lockEnv").value=s.lockEnv||"halloween";}
$("#envAuto").addEventListener("click",()=>{state.settings.envMode="auto";syncEnvUI();});
$("#envManual").addEventListener("click",()=>{state.settings.envMode="manual";syncEnvUI();});
$("#lockOn").addEventListener("change",e=>{state.settings.lockOn=e.target.checked;syncEnvUI();});
$("#envSave").addEventListener("click",()=>{if(!state.dev||!db)return;state.settings.manualWeather=$("#manWx").value;state.settings.lockEnv=$("#lockEnv").value;db.ref("nox_settings").update({envMode:state.settings.envMode,manualWeather:state.settings.manualWeather,lockOn:state.settings.lockOn,lockEnv:state.settings.lockEnv});applyEnv();toast("Đã lưu environment.");});
$("#anSave").addEventListener("click",()=>{if(!state.dev||!db)return;db.ref("nox_notice").update({title:clean($("#anTitle").value),body:clean($("#anBody").value),enabled:$("#anOn").checked,updatedAt:firebase.database.ServerValue.TIMESTAMP});toast("Đã lưu thông báo.");});
$("#utilNoteSave").addEventListener("click",()=>{if(!state.dev||!db)return;db.ref("nox_notice").update({util:clean($("#utilNoteIn").value)});toast("Đã lưu note tiện ích.");});
document.querySelectorAll("#p-perf [data-p]").forEach(b=>b.addEventListener("click",()=>{state.settings.perf=b.dataset.p;state.perfEff=b.dataset.p;if(db&&state.dev)db.ref("nox_settings").update({perf:b.dataset.p});applyEnv();document.querySelectorAll("#p-perf [data-p]").forEach(x=>x.classList.toggle("on",x===b));}));
let pend=CATS.length,done=false;
function markPend(){pend--;if(pend<=0&&!done){done=true;hideLoader();}}
function hideLoader(){$("#loader").classList.add("hide");setTimeout(()=>{$("#loader").style.display="none";},600);}
setTimeout(hideLoader,3000);
if(db){CATS.forEach(c=>{db.ref(ND+"/"+c.node).on("value",s=>{const v=s.val()||{};state.data[c.id]=Object.keys(v).map(k=>nI(k,v[k])).sort((a,b)=>b.ts-a.ts);renderCat(c.id);renderUtil();markPend();},()=>{state.data[c.id]=[];renderCat(c.id);markPend();});});
 db.ref("nox_settings").on("value",s=>{const v=s.val()||{};Object.assign(state.settings,{envMode:v.envMode||"auto",manualWeather:v.manualWeather||"clear",lockOn:!!v.lockOn,lockEnv:v.lockEnv||"halloween",perf:v.perf||"balanced"});state.perfEff=state.settings.perf==="auto"?"balanced":state.settings.perf;syncEnvUI();applyEnv();},()=>{});
 db.ref("nox_notice").on("value",s=>{const v=s.val()||{};state.notice=v;state.utilNote=v.util||"";
   const un=$("#utilNote");if(state.utilNote){un.style.display="block";un.textContent=state.utilNote;}else un.style.display="none";
   if(state.dev){$("#utilNoteIn").value=state.utilNote;$("#anTitle").value=v.title||"";$("#anBody").value=v.body||"";$("#anOn").checked=!!v.enabled;}
   if(v.enabled&&v.body){const ver=String(v.updatedAt||"");let rec=null;try{rec=JSON.parse(sessionStorage.getItem("ssw_notice_seen")||"null")}catch(_){}if(!(rec&&rec.ver===ver)){$("#ntTitle").textContent=v.title||"Thông báo";$("#ntBody").textContent=v.body;$("#shNotice").classList.add("on");$("#ov").classList.add("on");try{sessionStorage.setItem("ssw_notice_seen",JSON.stringify({ver}))}catch(_){}}}},()=>{});
}else{CATS.forEach(c=>{state.data[c.id]=[];renderCat(c.id);});markPend();markPend();markPend();markPend();}
setInterval(applyEnv,30000);
buildCatSeg();fillEnvSel();syncEnvUI();applyUser();renderRoute();tickWebTime();
const sm=$("#sndMod");if(sm)sm.innerHTML=state.snd?IC.sndOn:IC.sndOff;
state.perfEff=state.settings.perf==="auto"?"balanced":state.settings.perf;
applyEnv();
</script>
</body>
</html>
