<!DOCTYPE html>
<html lang="vi" data-theme="nox">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKIBIDI SCRIPT — Cộng đồng & Tiện ích</title>
<style>
:root{--r:18px;--r-s:12px;--pad:16px;--maxw:1080px;--g-alpha:.34;--g-blur:18px;--g-edge:.55;--g-tint:255,255,255;--anim:.28s;--part:24}
html[data-theme="nox"]{--bg:#07090d;--bg2:#0b1017;--sf:#121822;--sf2:#1a2230;--tx:#eaf0f7;--mu:#8b98ab;--ac:#5eead4;--ac2:#818cf8;--bd:#232d3d;--sh:0 12px 32px rgba(0,0,0,.45);--glow:0 0 24px rgba(94,234,212,.16);--blur:0px;--edge:transparent}
html[data-theme="turbo"]{--bg:#0d0714;--bg2:#160b22;--sf:#1d1030;--sf2:#2a1745;--tx:#fff3e8;--mu:#b39ccf;--ac:#ff7a18;--ac2:#ff2d95;--bd:#3a2059;--sh:0 10px 28px rgba(255,45,149,.18);--glow:0 0 26px rgba(255,122,24,.28);--blur:0px;--edge:transparent}
html[data-theme="glass"]{--bg:#0e2233;--bg2:#123a52;--sf:rgba(var(--g-tint),var(--g-alpha));--sf2:rgba(var(--g-tint),calc(var(--g-alpha)*.6));--tx:#f2fbff;--mu:#bcd9e8;--ac:#7dd3fc;--ac2:#a5b4fc;--bd:rgba(255,255,255,calc(var(--g-edge)*.5));--sh:0 18px 44px rgba(2,20,34,.35);--glow:0 0 30px rgba(125,211,252,.25);--blur:var(--g-blur);--edge:rgba(255,255,255,calc(var(--g-edge)))}
html[data-theme="natural"]{--bg:#0e2233;--bg2:#1b3a53;--sf:rgba(255,255,255,.62);--sf2:rgba(255,255,255,.45);--tx:#12283a;--mu:#4c6577;--ac:#2f9e6e;--ac2:#e8a13c;--bd:rgba(255,255,255,.7);--sh:0 12px 30px rgba(20,50,70,.18);--glow:none;--blur:6px;--edge:rgba(255,255,255,.8)}
html[data-theme="natural"][data-event="halloween"]{--bg:#160b1e;--bg2:#2a1030;--sf:rgba(30,12,40,.72);--sf2:rgba(48,20,60,.6);--tx:#ffe9c9;--mu:#c9a08a;--ac:#ff8c2e;--ac2:#9d4dff;--bd:rgba(255,140,46,.35);--glow:0 0 26px rgba(255,140,46,.25)}
html[data-theme="natural"][data-event="christmas"]{--ac:#3fae6a;--ac2:#e05252}
html[data-theme="natural"][data-event="tet"]{--ac:#d43a2f;--ac2:#f0b429}
html[data-perf="low"]{--anim:0s;--part:0}
html[data-perf="balanced"]{--part:14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
body[data-font="serif"]{font-family:Georgia,"Times New Roman",serif}
body[data-font="mono"]{font-family:ui-monospace,Consolas,monospace}
body[data-font="round"]{font-family:"Quicksand","Comic Sans MS",system-ui,sans-serif}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
.ic{vertical-align:-4px;flex:none}
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(180deg,var(--bg),var(--bg2))}
#bgMedia img,#bgMedia video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#bgMedia::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.42))}
html[data-theme="glass"] #bgMedia::after{background:linear-gradient(180deg,rgba(10,40,60,.25),rgba(6,26,40,.5))}
#scene{position:absolute;inset:0;display:none}
html[data-theme="natural"] #scene{display:block}
#scene .sky{position:absolute;inset:0;background:linear-gradient(180deg,#8ecdf0 0%,#cfe9f7 45%,#eef7ee 70%)}
html[data-event="halloween"] #scene .sky{background:linear-gradient(180deg,#1b0f2b 0%,#3d1440 45%,#7a2c17 80%)}
html[data-event="christmas"] #scene .sky{background:linear-gradient(180deg,#9fc6e8,#e8f2fa)}
html[data-event="tet"] #scene .sky{background:linear-gradient(180deg,#f7d9a0,#fbeedd)}
#scene .sun{position:absolute;top:9%;right:14%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd76a 60%,rgba(255,215,106,0));box-shadow:0 0 60px 22px rgba(255,220,120,.5)}
html[data-event="halloween"] #scene .sun{background:radial-gradient(circle at 40% 40%,#ffd9a0,#ff8c2e 65%,rgba(255,140,46,0));box-shadow:0 0 70px 26px rgba(255,120,30,.35);width:92px;height:92px}
#scene .mtn{position:absolute;left:-5%;right:-5%;background:#5f87a8;opacity:.75}
#scene .m1{bottom:34%;height:30%;clip-path:polygon(0 100%,12% 42%,26% 78%,41% 20%,58% 72%,74% 34%,88% 70%,100% 46%,100% 100%)}
#scene .m2{bottom:22%;height:26%;background:#3f6b8f;clip-path:polygon(0 100%,18% 30%,34% 70%,52% 12%,70% 66%,86% 30%,100% 62%,100% 100%)}
html[data-event="halloween"] #scene .m1,html[data-event="halloween"] #scene .m2{background:#241031}
#scene .ground{position:absolute;bottom:0;height:26%;background:linear-gradient(180deg,#356b4f,#1d4634)}
html[data-event="halloween"] #scene .ground{background:linear-gradient(180deg,#241a12,#120b08)}
#scene .tree{position:absolute;bottom:20%;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:86px solid #1d4634;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
html[data-event="halloween"] #scene .tree{border-bottom-color:#0d070a}
#scene .fog{position:absolute;left:-40%;width:120%;height:22%;background:radial-gradient(ellipse at center,rgba(255,255,255,.5),rgba(255,255,255,0) 70%);animation:fog 46s linear infinite}
#scene .fog.f2{bottom:16%;animation-duration:64s;animation-direction:reverse;opacity:.7}
#scene .fog.f1{bottom:30%}
html[data-event="halloween"] #scene .fog{background:radial-gradient(ellipse at center,rgba(190,140,255,.28),rgba(0,0,0,0) 70%)}
@keyframes fog{from{transform:translateX(-12%)}50%{transform:translateX(12%)}to{transform:translateX(-12%)}}
#parts{position:absolute;inset:0;pointer-events:none}
#parts i{position:absolute;top:-4%;border-radius:50%;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(112vh) rotate(340deg)}}
#app{max-width:var(--maxw);margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 14px calc(76px + env(safe-area-inset-bottom))}
@media(min-width:900px){#app{padding-bottom:24px}}
header#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 2px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px;cursor:pointer;user-select:none}
.mk{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--ac),var(--ac2),var(--ac));box-shadow:var(--glow);display:grid;place-items:center;color:#041018}
html[data-theme="glass"] .mk{background:rgba(255,255,255,.2);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6);color:#fff}
html[data-theme="natural"] .mk{background:rgba(255,255,255,.55);border:1px solid #fff;color:#1d4634}
.spacer{flex:1}
.icobtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);backdrop-filter:blur(var(--blur));display:grid;place-items:center;cursor:pointer;transition:transform var(--anim)}
.icobtn:active{transform:scale(.93)}
.dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 2px var(--bg);display:none}
.dot.on{display:block}
nav#bar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
@media(min-width:900px){nav#bar{position:sticky;top:70px;justify-content:flex-start;background:none;backdrop-filter:none;border:0;padding:0 0 12px;order:-1}#app{padding-top:0}}
nav#bar button{flex:1;max-width:120px;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;cursor:pointer;padding:6px 4px;border-radius:14px;transition:color var(--anim)}
nav#bar button .ni{display:grid;place-items:center;height:22px}
nav#bar button.on{color:var(--tx);background:var(--sf2);box-shadow:inset 0 0 0 1px var(--bd)}
@media(min-width:900px){nav#bar button{flex-direction:row;gap:8px;font-size:14px;flex:0 0 auto;padding:9px 16px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(var(--blur));padding:var(--pad);position:relative;overflow:hidden}
html[data-theme="glass"] .card{backdrop-filter:blur(var(--g-blur)) saturate(1.5);background:linear-gradient(155deg,rgba(var(--g-tint),var(--g-alpha)),rgba(var(--g-tint),calc(var(--g-alpha)*.42)))}
html[data-theme="glass"] .card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,calc(var(--g-edge)*.9)),rgba(255,255,255,0) 22%,rgba(255,255,255,0) 78%,rgba(255,255,255,calc(var(--g-edge)*.35)));mix-blend-mode:screen}
html[data-theme="glass"] .card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,calc(var(--g-edge)*.22)),transparent);pointer-events:none;animation:sheen 9s ease-in-out infinite}
@keyframes sheen{0%,72%{left:-60%}88%{left:120%}100%{left:120%}}
html[data-theme="turbo"] .card{border:1px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;border-radius:22px 8px 22px 8px}
html[data-theme="nox"] .card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.05),transparent 60%)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;margin:4px 0 2px}h2{font-size:18px;margin:0 0 4px}h3{font-size:15px;margin:0}
.mu{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform var(--anim),box-shadow var(--anim);user-select:none}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#081018;box-shadow:var(--glow)}
html[data-theme="natural"] .btn.pri{color:#fff}
.btn.dgr{background:#3a1220;border-color:#7a2440;color:#ffb4c0}
.btn.gho{background:transparent}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);border-radius:13px;padding:11px 13px;font:inherit;outline:none;transition:box-shadow var(--anim)}
.inp:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
textarea.inp{min-height:96px;resize:vertical}
label.fl{font-size:12.5px;color:var(--mu);margin:8px 0 4px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:13px}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#081018;border-color:transparent;font-weight:700}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;color:#081018;overflow:hidden;flex:none;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.fr1{box-shadow:0 0 0 3px var(--ac),0 0 14px var(--ac)}
.avatar.fr2{box-shadow:0 0 0 3px var(--ac2),0 0 0 6px color-mix(in srgb,var(--ac2) 40%,transparent)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);color:var(--mu)}
.badge.dev{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#081018;border:0;font-weight:800}
.badge.st-pending{color:#ffcf6a;border-color:#6b5320}.badge.st-approved{color:#7ce7a2;border-color:#265c3a}.badge.st-rejected{color:#ff9aa8;border-color:#6b2433}.badge.st-edit{color:#8ab4ff;border-color:#2c4470}
.nmfx1{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.nmfx2{animation:glowl 2.2s ease-in-out infinite}
@keyframes glowl{50%{text-shadow:0 0 12px var(--ac)}}
.empty{text-align:center;color:var(--mu);padding:34px 12px}
.empty .big{margin-bottom:8px;opacity:.8}
.loader{display:flex;justify-content:center;padding:26px}
.loader i{width:10px;height:10px;margin:0 4px;border-radius:50%;background:var(--ac);animation:bnc 1s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.15s;background:var(--ac2)}.loader i:nth-child(3){animation-delay:.3s}
@keyframes bnc{40%{transform:translateY(-10px)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.hr{height:1px;background:var(--bd);margin:14px 0;border:0}
.sw{width:46px;height:27px;border-radius:999px;background:var(--sf2);border:1px solid var(--bd);position:relative;cursor:pointer;transition:background var(--anim)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--mu);transition:transform var(--anim),background var(--anim)}
.sw.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.sw.on::after{transform:translateX(19px);background:#081018}
input[type=range]{width:100%;accent-color:var(--ac)}
.thumb{border-radius:14px;aspect-ratio:16/10;object-fit:cover;width:100%;background:var(--sf2)}
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-s);background:var(--sf2);border:1px solid var(--bd);cursor:pointer;transition:transform var(--anim)}
.li:active{transform:scale(.985)}
.li .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ss{font-size:12.5px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.msg{max-width:78%;padding:10px 13px;border-radius:16px;background:var(--sf2);border:1px solid var(--bd);margin:3px 0;word-break:break-word}
.msg.me{margin-left:auto;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,var(--sf2)),color-mix(in srgb,var(--ac2) 30%,var(--sf2)))}
.msg .tm{display:block;font-size:10.5px;color:var(--mu);margin-top:4px}
#modalWrap{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
#modalWrap.on{display:flex}
@media(min-width:760px){#modalWrap{align-items:center;padding:20px}}
#modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;background:var(--sf);border:1px solid var(--bd);backdrop-filter:blur(20px);box-shadow:var(--sh);animation:up .3s cubic-bezier(.2,.9,.25,1)}
@media(min-width:760px){#modal{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:11px 16px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(14px);animation:up .25s;font-size:14px}
.toast.err{border-color:#7a2440}.toast.ok{border-color:#265c3a}
#splash{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--bg),var(--bg2));transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash .mk{width:74px;height:74px;border-radius:22px;animation:pul 1.6s ease-in-out infinite}
#splash .mk svg{width:38px;height:38px}
@keyframes pul{50%{transform:scale(1.07) rotate(3deg)}}
</style>
</head>
<body>
<div id="bg"><div id="bgMedia"></div><div id="scene">
  <div class="sky"></div><div class="sun"></div><div class="mtn m1"></div><div class="mtn m2"></div>
  <div class="ground"></div><div class="fog f1"></div><div class="fog f2"></div><div id="parts"></div>
</div></div>
<div id="splash"><div class="mk"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 6.6 13.2h4.5L9.4 22l7.8-11.6h-4.7L14.6 2Z"/></svg></div><div style="font-weight:800;letter-spacing:1px">SKIBIDI SCRIPT</div><div class="mu" id="splashTx">Đang khởi động…</div></div>
<div id="toasts"></div>
<div id="modalWrap"><div id="modal"></div></div>
<div id="app">
  <header id="top">
    <div class="logo" data-act="go" data-to="home"><div class="mk"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 6.6 13.2h4.5L9.4 22l7.8-11.6h-4.7L14.6 2Z"/></svg></div><span>SKIBIDI SCRIPT</span></div>
    <div class="spacer"></div>
    <button class="icobtn" data-act="go" data-to="mailbox" title="Hộp thư"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg><span class="dot" id="dotMail"></span></button>
    <button class="icobtn" data-act="go" data-to="shop" title="Shop"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></button>
    <button class="icobtn" id="avaTop" data-act="me"><span class="avatar" id="avaTopIn" style="width:30px;height:30px;font-size:13px">?</span><span class="dot" id="dotDev"></span></button>
  </header>
  <nav id="bar">
    <button data-act="go" data-to="utils"><span class="ni"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.7 2.7-2-2 2.7-2.7z"/></svg></span>Tiện ích</button>
    <button data-act="go" data-to="audio"><span class="ni"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>Âm thanh</button>
    <button data-act="go" data-to="report"><span class="ni"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg></span>Báo cáo</button>
    <button data-act="go" data-to="chat"><span class="ni"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.7-3.4A8.5 8.5 0 1 1 21 11.5z"/></svg></span>Nhắn tin<span class="dot" id="dotChat" style="position:static;box-shadow:none;margin-left:2px"></span></button>
  </nav>
  <main id="view" style="flex:1;padding-top:6px"></main>
</div>
<script>
"use strict";
/* ===== CẤU HÌNH (chỉ nhà phát triển) ===== */
const CFG={googleClientId:null,maxImg:1500000,maxFile:1000000,maxAudio:1500000};
/* ===== ICON SVG VẼ BẰNG CODE ===== */
const ICO={
tool:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.7 2.7-2-2 2.7-2.7z"/>',

function readImage(file,maxW=900){return new Promise((res,rej)=>{if(!file.type.startsWith("image/"))return rej("Tệp không phải hình ảnh.");
 const r=new FileReader();r.onerror=()=>rej("Không đọc được tệp.");r.onload=()=>{const im=new Image();im.onerror=()=>rej("Hình ảnh không hợp lệ.");
 im.onload=()=>{const sc=Math.min(1,maxW/im.width);const c=document.createElement("canvas");c.width=Math.max(1,im.width*sc);c.height=Math.max(1,im.height*sc);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};im.src=r.result};r.readAsDataURL(file)})}
function readSmall(file,max,typeCheck){return new Promise((res,rej)=>{if(file.size>max)return rej("Tệp quá lớn. Vui lòng chọn tệp nhỏ hơn "+Math.round(max/1e6*10)/10+" MB.");
 if(typeCheck&&!typeCheck(file.type))return rej("Định dạng tệp không được hỗ trợ.");const r=new FileReader();r.onerror=()=>rej("Không đọc được tệp.");r.onload=()=>res(r.result);r.readAsDataURL(file)})}

/* ===== SHA-256 dự phòng khi trình duyệt không có sẵn ===== */
function sha256Pure(bytes){const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const l=bytes.length,bitLen=l*8,padded=new Uint8Array((((l+8)>>6)+1)<<6);padded.set(bytes);padded[l]=0x80;
 const dv=new DataView(padded.buffer);dv.setUint32(padded.length-4,bitLen>>>0);dv.setUint32(padded.length-8,Math.floor(bitLen/4294967296));
 const w=new Uint32Array(64);
 for(let i=0;i<padded.length;i+=64){for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
  for(let t=16;t<64;t++){const a=w[t-15],b=w[t-2];const s0=(a>>>7|a<<25)^(a>>>18|a<<14)^(a>>>3);const s1=(b>>>17|b<<15)^(b>>>19|b<<13)^(b>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
  let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let t=0;t<64;t++){const S1=(e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7);const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[t]+w[t])>>>0;
   const S0=(a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10);const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;
   h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
 return H.map(x=>x.toString(16).padStart(8,"0")).join("")}

const Auth={
 me(){const s=DB.session.get();if(!s)return null;return DB.users.get().find(u=>u.uid===s.uid)||null},
 hash(pw,salt){const data=new TextEncoder().encode(salt+"::"+pw);
  if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",data).then(h=>[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join(""));
  return Promise.resolve(sha256Pure(data))},
 async register(email,pass,name){email=String(email).trim().toLowerCase();name=String(name).trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw"E-mail không hợp lệ.";
  if(pass.length<6)throw"Mật khẩu cần ít nhất 6 ký tự.";
  if(name.length<2||name.length>24)throw"Tên hiển thị cần từ 2 đến 24 ký tự.";
  let out=null;DB.users.tx(us=>{if(us.some(u=>u.email===email))throw"E-mail này đã được đăng ký.";
   const uid=Auth.freeUid(us,name);const salt=uid8()+uid8();
   out={uid,uidChanged:0,email,pass:"",salt,displayName:name,nameChangedAt:0,role:us.length===0?"dev":"user",
    postPerm:1,avatar:"",bio:"",links:[],createdAt:Date.now(),friends:[],reqIn:[],reqOut:[],blocked:[],owned:[],equip:{},seenNotices:[],mailRead:[],glass:null,perf:"balanced",vol:.8};
   us.push(out);return us});
  const h=await Auth.hash(pass,out.salt);DB.users.tx(us=>{const u=us.find(x=>x.uid===out.uid);if(u)u.pass=h;return us});
  DB.session.set({uid:out.uid});return out},
 freeUid(us,name){const base=(name||"user").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,12)||"user";let cand=base,n=1;
  const taken=c=>us.some(u=>u.uid.toLowerCase().replace(/\s/g,"")===c);while(taken(cand))cand=base+(++n);return cand},
 async login(email,pass){email=String(email).trim().toLowerCase();const u=DB.users.get().find(x=>x.email===email);
  if(!u)throw"Tài khoản không tồn tại.";const h=await Auth.hash(pass,u.salt);if(h!==u.pass)throw"Mật khẩu không đúng.";
  DB.session.set({uid:u.uid});return u},
 logout(){DB.session.set(null)},
 isDev(u){return!!u&&u.role==="dev"},
 canPost(u){return!!u&&(u.role==="dev"||u.postPerm===1)},
 rename(u,name){name=String(name).trim();if(name.length<2||name.length>24)throw"Tên hiển thị cần từ 2 đến 24 ký tự.";
  DB.users.tx(us=>{const t=us.find(x=>x.uid===u.uid);if(!t)return us;const now=Date.now();
   if(t.nameChangedAt&&now-t.nameChangedAt<7*864e5)throw"Bạn vừa đổi tên gần đây. Vui lòng thử lại sau "+Math.ceil((7*864e5-(now-t.nameChangedAt))/864e5)+" ngày nữa.";
   t.displayName=name;t.nameChangedAt=now;return us})},
 changeUid(u,nu){nu=String(nu).trim().replace(/\s+/g,"");if(!/^[A-Za-z0-9_.-]{4,20}$/.test(nu))throw"UID cần 4–20 ký tự gồm chữ, số, gạch dưới, chấm hoặc gạch ngang.";
  DB.users.tx(us=>{const t=us.find(x=>x.uid===u.uid);if(!t)return us;
   if(t.uidChanged)throw"UID chỉ được đổi một lần duy nhất.";
   if(us.some(x=>x.uid!==t.uid&&x.uid.toLowerCase().replace(/\s/g,"")===nu.toLowerCase()))throw"UID này đã có người sử dụng.";
   const old=t.uid;t.uid=nu;t.uidChanged=1;
   const rep=a=>Array.isArray(a)?a.map(v=>v===old?nu:v):a;
   us.forEach(o=>{o.friends=rep(o.friends);o.reqIn=rep(o.reqIn);o.reqOut=rep(o.reqOut);o.blocked=rep(o.blocked)});
   DB.convos.tx(cs=>{cs.forEach(c=>{c.members=rep(c.members);c.messages.forEach(m=>{if(m.from===old)m.from=nu})});return cs});
   DB.posts.tx(ps=>{ps.forEach(p=>{if(p.byUid===old)p.byUid=nu});return ps});
   DB.items.tx(ps=>{ps.forEach(p=>{if(p.byUid===old)p.byUid=nu});return ps});
   DB.sugg.tx(ps=>{ps.forEach(p=>{if(p.fromUid===old)p.fromUid=nu});return ps});
   DB.reports.tx(ps=>{ps.forEach(p=>{if(p.fromUid===old)p.fromUid=nu});return ps});
   DB.mails.tx(ps=>{ps.forEach(p=>{if(p.toUid===old)p.toUid=nu});return ps});
   const se=DB.session.get();if(se&&se.uid===old)DB.session.set({uid:nu});
   return us})},
 block(a,b){if(a.uid===b)throw"Không thể thao tác với chính mình.";DB.users.tx(us=>{const t=us.find(x=>x.uid===a.uid);if(t&&!t.blocked.includes(b))t.blocked.push(b);return us})},
 unblock(a,b){DB.users.tx(us=>{const t=us.find(x=>x.uid===a.uid);if(t)t.blocked=t.blocked.filter(v=>v!==b);return us})},
 friendRequest(a,b){if(a.uid===b)throw"Không thể kết bạn với chính mình.";
  DB.users.tx(us=>{const A=us.find(x=>x.uid===a.uid),B=us.find(x=>x.uid===b);if(!A||!B)throw"Không tìm thấy người dùng.";
   if(A.friends.includes(b))throw"Hai bạn đã là bạn bè.";
   if(B.blocked.includes(a.uid)||A.blocked.includes(b))throw"Không thể gửi lời mời đến người này.";
   if(A.reqOut.includes(b))throw"Đã gửi lời mời trước đó.";
   if(B.reqOut.includes(a.uid)){B.reqOut=B.reqOut.filter(v=>v!==a.uid);A.reqIn=A.reqIn.filter(v=>v!==b);A.friends.push(b);B.friends.push(a.uid);return us}
   A.reqOut.push(b);B.reqIn.push(a.uid);return us})},
 acceptReq(a,b){DB.users.tx(us=>{const A=us.find(x=>x.uid===a.uid),B=us.find(x=>x.uid===b);if(!A||!B)return us;
  A.reqIn=A.reqIn.filter(v=>v!==b);B.reqOut=B.reqOut.filter(v=>v!==a.uid);
  if(!A.friends.includes(b))A.friends.push(b);if(!B.friends.includes(a.uid))B.friends.push(a.uid);return us})},
 declineReq(a,b){if(!a)return;DB.users.tx(us=>{const A=us.find(x=>x.uid===a.uid),B=us.find(x=>x.uid===b);if(!A||!B)return us;
  A.reqIn=A.reqIn.filter(v=>v!==b);B.reqOut=B.reqOut.filter(v=>v!==a.uid);return us})},
 unfriend(a,b){DB.users.tx(us=>{const A=us.find(x=>x.uid===a.uid),B=us.find(x=>x.uid===b);if(!A||!B)return us;
  A.friends=A.friends.filter(v=>v!==b);B.friends=B.friends.filter(v=>v!==a.uid);return us})},
 userByUid(q){q=String(q).trim().replace(/\s+/g,"");return DB.users.get().find(u=>u.uid.toLowerCase()===q.toLowerCase())},
 update(uid,fn){DB.users.tx(us=>{const t=us.find(x=>x.uid===uid);if(t)fn(t);return us})}
};
const Chat={
 convoId(a,b){return[a,b].sort().join("~")},
 get(a,b){return DB.convos.get().find(c=>c.id===Chat.convoId(a,b))},
 ensure(a,b){if(!Chat.get(a,b)){DB.convos.tx(cs=>{cs.push({id:Chat.convoId(a,b),members:[a,b],messages:[],blockedBy:[]});return cs})}return Chat.get(a,b)},
 canSend(a,b){const me=Auth.userByUid(a),ot=Auth.userByUid(b);if(!me||!ot)return"Không tìm thấy cuộc trò chuyện.";
  if(me.blocked.includes(b))return"Bạn đã chặn người này nên không thể gửi tin.";
  if(ot.blocked.includes(a))return"Người nhận không nhận tin nhắn mới.";
  if(!me.friends.includes(b))return"Hai bạn cần kết bạn trước khi nhắn tin.";return null},
 send(a,b,msg){const err=Chat.canSend(a,b);if(err)throw err;Chat.ensure(a,b);const id=Chat.convoId(a,b);
  DB.convos.tx(cs=>{const c=cs.find(x=>x.id===id);c.messages.push({id:uid8(),from:a,...msg,ts:Date.now(),readBy:[a]});
   if(c.messages.length>400)c.messages=c.messages.slice(-400);return cs});return true},
 markRead(a,b){const id=Chat.convoId(a,b);if(!Chat.get(a,b))return;DB.convos.tx(cs=>{const c=cs.find(x=>x.id===id);if(c)c.messages.forEach(m=>{if(!m.readBy.includes(a))m.readBy.push(a)});return cs})},
 unread(a){return DB.convos.get().filter(c=>c.members.includes(a)).reduce((n,c)=>n+c.messages.filter(m=>m.from!==a&&!m.readBy.includes(a)).length,0)}
};
const Mail={
 push(toUid,title,body,kind){DB.mails.tx(ms=>{ms.push({id:uid8(),toUid,title,body,kind,ts:Date.now()});if(ms.length>300)ms=ms.slice(-300);return ms})},
 list(uid){return DB.mails.get().filter(m=>m.toUid===uid).sort((a,b)=>b.ts-a.ts)},
 unread(uid){const me=Auth.userByUid(uid);if(!me)return 0;return Mail.list(uid).filter(m=>!(me.mailRead||[]).includes(m.id)).length},

  const me=Auth.me();el.dataset.perf=me?me.perf:"balanced";
  const g=Theme.glass();el.style.setProperty("--g-alpha",g.alpha);el.style.setProperty("--g-blur",(g.mode==="frosted"?Math.max(g.blur,14):g.blur)+"px");
  el.style.setProperty("--g-edge",g.edge);el.style.setProperty("--g-tint",g.tint);
  Theme.event();Theme.bg();Theme.parts();Theme.font(me)},
 glass(){const me=Auth.me();return me&&me.glass?me.glass:DB.glassDef.get()},
 event(){const el=document.documentElement;let ev="default";
  if(Theme.cur==="natural"){const m=DB.media.get();const lock=(m.natural||{}).event||"auto";
   if(lock!=="auto")ev=lock;else{const mo=new Date().getMonth()+1,d=new Date().getDate();
    if(mo===10)ev="halloween";else if((mo===12&&d>=15)||(mo===1&&d<=2))ev="christmas";else if(mo===1||mo===2)ev="tet"}}
  el.dataset.event=ev},
 bg(){const m=DB.media.get()[Theme.cur]||{};const w=$("#bgMedia");w.innerHTML="";
  if(m.bgVideo){const v=document.createElement("video");v.src=m.bgVideo;v.muted=!0;v.loop=!0;v.playsInline=!0;v.onerror=()=>v.remove();v.play().catch(()=>{});w.append(v)}

 parts(){const w=$("#parts");w.innerHTML="";if(Theme.cur!=="natural")return;
  const ev=document.documentElement.dataset.event;const n=+getComputedStyle(document.documentElement).getPropertyValue("--part")||0;
  const cfg={default:{c:"rgba(255,255,255,.75)",s:[3,6]},halloween:{c:"rgba(255,140,46,.8)",s:[4,8]},christmas:{c:"#fff",s:[3,7]},tet:{c:"rgba(240,180,41,.85)",s:[4,8]}}[ev]||{c:"#fff",s:[3,6]};
  for(let i=0;i<n;i++){const p=document.createElement("i");const sz=cfg.s[0]+Math.random()*(cfg.s[1]-cfg.s[0]);
   p.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:${cfg.c};animation-duration:${7+Math.random()*9}s;animation-delay:-${Math.random()*12}s;opacity:${.4+Math.random()*.5}`;w.append(p)}},
 font(me){document.body.dataset.font="";if(!me)return;const f=me.equip&&me.equip.font;if(f){const it=DB.shop.get().find(s=>s.id===f);if(it)document.body.dataset.font=it.preview.value}},
 au:new Audio(),

 case"tl-wipe":askConfirm("XÓA TOÀN BỘ dữ liệu? Hành động không thể hoàn tác.",()=>{Object.keys(localStorage).filter(k=>k.startsWith("skibidi.")).forEach(k=>localStorage.removeItem(k));location.reload()});break;
 }});
function pickFile(cb,accept){const i=document.createElement("input");i.type="file";if(accept)i.accept=accept;i.onchange=()=>i.files[0]&&cb(i.files[0]);i.click()}

function refreshRoom(){const me=Auth.me();if(!me||route.name!=="room")return;const w=$("#msgScroll");if(!w)return;
 const c=Chat.get(me.uid,route.param);const sig=c?c.messages.length+"-"+(c.messages.at(-1)?.ts||0):"0";
 if(w.dataset.sig!==sig){const near=w.scrollTop+w.clientHeight>=w.scrollHeight-60;w.innerHTML=msgListHTML(c,me);w.dataset.sig=sig;
  if(near)w.scrollTop=w.scrollHeight;Chat.markRead(me.uid,route.param);renderDots()}}
setInterval(()=>{if(route.name==="room")refreshRoom()},2500);
