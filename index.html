function flat(v) {
  var out = [];

    Object.keys(v[u] || {}).forEach(function (k) {

  return out.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

/* ---------- Three.js: nền Dynamic (tải khi cần, giải phóng khi đổi) ---------- */
var DYN = { r: null, raf: 0, sc: null, mv: null, rs: null, busy: false };
function stopDyn() {
  cancelAnimationFrame(DYN.raf);
  DYN.raf = 0;
  if (DYN.mv) { removeEventListener("pointermove", DYN.mv); DYN.mv = null; }
  if (DYN.rs) { removeEventListener("resize", DYN.rs); DYN.rs = null; }
  if (DYN.sc) {
    DYN.sc.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    DYN.sc = null;
  }
  if (DYN.r) { DYN.r.dispose(); DYN.r = null; }
}
function startDyn() {
  stopDyn();
  if (!window.THREE) {
    if (DYN.busy) return;
    DYN.busy = true;
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    s.onload = function () { DYN.busy = false; if (window.THREE) { if (pref.bg === "dynamic") startDyn(); } else toast("Không tải được Three.js, dùng nền tĩnh."); };
    s.onerror = function () { DYN.busy = false; toast("Không tải được Three.js, dùng nền tĩnh."); };
    document.head.appendChild(s);
    return;
  }
  var T = THREE, cv = $("#fx3");
  var weak = pref.lite || (navigator.deviceMemory && navigator.deviceMemory <= 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
  var r;
  try { r = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: false, powerPreference: "low-power" }); }
  catch (e) { toast("Thiết bị không hỗ trợ WebGL."); return; }
  r.setPixelRatio(Math.min(devicePixelRatio || 1, weak ? 1 : 1.5));
  r.setSize(innerWidth, innerHeight, false);
  DYN.r = r;
  var sc = new T.Scene();
  var cam = new T.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
  cam.position.z = 30;
  DYN.sc = sc;
  var N = weak ? 260 : 800;
  var pos = new Float32Array(N * 3), col = new Float32Array(N * 3), vel = new Float32Array(N);
  var pal = [[0.16, 0.84, 0.77], [0.49, 0.36, 1], [0.9, 0.4, 0.9]];
  for (var i = 0; i < N; i++) {
    pos[i * 3] = (Math.random() - 0.5) * 80;
    pos[i * 3 + 1] = (Math.random() - 0.5) * 50;
    pos[i * 3 + 2] = (Math.random() - 0.5) * 60;
    vel[i] = 0.2 + Math.random();
    col.set(pal[i % 3], i * 3);
  }
  var g = new T.BufferGeometry();
  g.setAttribute("position", new T.BufferAttribute(pos, 3));
  g.setAttribute("color", new T.BufferAttribute(col, 3));
  sc.add(new T.Points(g, new T.PointsMaterial({
    size: 0.34, vertexColors: true, transparent: true, opacity: 0.85,
    depthWrite: false, blending: T.AdditiveBlending
  })));
  var mx = 0, my = 0, last = 0, fps = weak ? 30 : 60;
  DYN.mv = function (e) { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; };
  DYN.rs = function () { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
  addEventListener("pointermove", DYN.mv, { passive: true });
  addEventListener("resize", DYN.rs);
  function tick(t) {
    DYN.raf = requestAnimationFrame(tick);
    if (document.hidden || t - last < 1000 / fps - 1) return;
    last = t;
    var a = g.attributes.position.array;
    for (var k = 0; k < N; k++) {
      a[k * 3 + 2] += vel[k] * 0.12;
      if (a[k * 3 + 2] > 30) a[k * 3 + 2] = -30;
    }
    g.attributes.position.needsUpdate = true;
    cam.position.x += (mx * 8 - cam.position.x) * 0.03;
    cam.position.y += (-my * 5 - cam.position.y) * 0.03;
    cam.lookAt(0, 0, 0);
    r.render(sc, cam);
  }
  if (RM) { r.render(sc, cam); } else { DYN.raf = requestAnimationFrame(tick); }
}

$("#poList").addEventListener("click", function (e) {
  var b = e.target.closest("[data-pdel]");
  if (b && db && uidNow()) db.ref("nox_pending/" + uidNow() + "/" + b.dataset.pdel).remove().then(loadMine).catch(function () { toast("Không hủy được."); });
});
$("#poSend").addEventListener("click", function () {
  var u = uidNow();
  if (!u || !db) { toast("Cần đăng nhập."); return; }
  var c = catOf($("#poCat").value), name = clean($("#poName").value).trim();
  if (!c || !name) { toast("Nhập tên bài."); return; }
  var p = { cat: c.id, name: name.slice(0, 80), desc: clean($("#poDesc").value).slice(0, 300), by: clean(myName()).slice(0, 60), createdAt: SVT() };
  var url = $("#poUrl").value.trim(), code = $("#poCode").value.slice(0, 20000);
  if (url && !safeUrl(url)) { toast("Link phải bắt đầu bằng http(s)://"); return; }
  if (!url && !code.trim()) { toast("Cần link hoặc nội dung."); return; }
  if (url) p.url = url;
  if (code.trim()) p.code = code;
  db.ref("nox_pending/" + u).push(p).then(function () {
    $("#poName").value = $("#poDesc").value = $("#poUrl").value = $("#poCode").value = "";
    toast("Đã gửi, chờ Dev duyệt.");
    loadMine();
  }).catch(function () { toast("Gửi thất bại (kiểm tra quyền Firebase)."); });
});

/* ---------- Báo cáo & góp ý ---------- */
function loadReports() {
  var u = uidNow();
  if (!u || !db) { $("#rpList").innerHTML = ""; return; }
  db.ref("nox_reports/" + u).limitToLast(20).once("value").then(function (s) {
    var v = s.val() || {};
    $("#rpList").innerHTML = Object.keys(v).reverse().map(function (k) {
      var r = v[k];
      return '<div class="pcard"><b>' + esc(r.type || "Góp ý") + '</b><p>' + esc(r.text) + '</p>'
        + '<small>' + (r.read ? "Đã đọc" : "Chưa đọc") + '</small>'
        + (r.reply ? '<p class="rep">Phản hồi: ' + esc(r.reply) + '</p>' : "") + '</div>';
    }).join("");
  }).catch(function () {});
}
function openReport() {
  closeMenu();
  closePops();
  if (!state.user) { toast("Đăng nhập để gửi báo cáo."); openAuth(); return; }
  openPop("#mdReport");
  loadReports();
}
$("#rpSend").addEventListener("click", function () {
  var u = uidNow(), t = clean($("#rpText").value, 1500).trim();
  if (!u || !db) return;
  if (t.length < 5) { toast("Nội dung quá ngắn."); return; }
  db.ref("nox_reports/" + u).push({ type: $("#rpType").value, text: t, email: state.user.email, read: false, createdAt: SVT() })
    .then(function () { $("#rpText").value = ""; toast("Đã gửi, cảm ơn bạn."); loadReports(); })
    .catch(function () { toast("Gửi thất bại."); });
});

/* ---------- Dev: Chờ duyệt + Báo cáo ---------- */
function setTabLabel(t, txt) { TABS.forEach(function (x) { if (x[0] === t) x[1] = txt; }); }
function badge() {
  setTabLabel("pending", "Chờ duyệt (" + pendAll.length + ")");
  setTabLabel("reqs", "Đề xuất DM (" + reqAll.filter(function (r) { return r.status === "pending"; }).length + ")");
  setTabLabel("reports", "Báo cáo (" + repAll.filter(function (r) { return !r.read; }).length + ")");
  if ($("#dev").classList.contains("on")) {
    var cur = document.querySelector("#dev .tab.on");
    buildTabs();
    showTab(cur ? cur.dataset.t : "content");
  }
}
function renderPending() {
  var box = $("#pdList");
  if (!pendAll.length) { box.innerHTML = '<div class="utilNote" style="color:#b4bed3">Không có bài chờ duyệt.</div>'; return; }
  box.innerHTML = pendAll.map(function (x) {
    var c = catOf(x.cat);
    var id = esc(x.uid + "|" + x.key);
    return '<div class="pcard"><b>' + esc(x.name) + '</b><small>' + esc(c ? c.label : x.cat) + ' · ' + esc(x.by || "") + '</small>'
      + (x.desc ? '<p>' + esc(x.desc) + '</p>' : "")
      + (x.code ? '<pre class="cprev">' + esc(String(x.code).slice(0, 300)) + '</pre>' : "")
      + (x.url ? '<div class="url">' + esc(x.url) + '</div>' : "")
      + '<div class="cfoot"><button class="btn btn-p" data-ap="' + id + '">Duyệt</button><button class="btn btn-g" data-rj="' + id + '">Từ chối</button></div></div>';
  }).join("");
}
function renderReports() {
  var box = $("#rpAll");
  if (!repAll.length) { box.innerHTML = '<div class="utilNote" style="color:#b4bed3">Chưa có báo cáo.</div>'; return; }
  box.innerHTML = repAll.map(function (r) {
    var id = esc(r.uid + "|" + r.key);
    return '<div class="pcard"><b>' + esc(r.type || "Góp ý") + '</b><small>' + esc(r.email || "") + ' · ' + (r.read ? "đã đọc" : "chưa đọc") + '</small>'
      + '<p>' + esc(r.text) + '</p>' + (r.reply ? '<p class="rep">Đã phản hồi: ' + esc(r.reply) + '</p>' : "")
      + '<div class="fld"><input data-rin="' + id + '" placeholder="Phản hồi…" maxlength="500"></div>'
      + '<div class="cfoot"><button class="btn btn-p" data-rrep="' + id + '">Phản hồi</button>'
      + (r.read ? "" : '<button class="btn btn-g" data-rread="' + id + '">Đánh dấu đã đọc</button>') + '</div></div>';
  }).join("");
}
$("#pdList").addEventListener("click", function (e) {
  if (!state.dev || !db) return;
  var ap = e.target.closest("[data-ap]"), rj = e.target.closest("[data-rj]");
  if (ap) {
    var a = ap.dataset.ap.split("|");
    var x = pendAll.find(function (i) { return i.uid === a[0] && i.key === a[1]; });
    var c = x && catOf(x.cat);
    if (!c) { toast("Danh mục không còn tồn tại."); return; }
    var nk = db.ref(ND + "/" + c.id).push().key;
    var it = { name: x.name, desc: x.desc || "", by: x.by || "", ownerUid: x.uid, createdAt: SVT() };
    if (x.code) it.code = x.code;
    if (x.url) it.url = x.url;
    var up = {};
    up[ND + "/" + c.id + "/" + nk] = it;
    up["nox_pending/" + x.uid + "/" + x.key] = null;
    db.ref().update(up).then(function () { toast("Đã duyệt & công khai."); }).catch(function () { toast("Duyệt thất bại (kiểm tra rules)."); });
  }
  if (rj && confirm("Từ chối bài này?")) {
    db.ref("nox_pending/" + rj.dataset.rj.split("|").join("/")).remove().then(function () { toast("Đã từ chối."); }).catch(function () { toast("Thất bại."); });
  }
});
$("#rpAll").addEventListener("click", function (e) {
  if (!state.dev || !db) return;
  var rep = e.target.closest("[data-rrep]"), rd = e.target.closest("[data-rread]");
  if (rd) db.ref("nox_reports/" + rd.dataset.rread.split("|").join("/")).update({ read: true }).catch(function () { toast("Thất bại."); });
  if (rep) {
    var id = rep.dataset.rrep, inp = document.querySelector('[data-rin="' + id + '"]');
    var t = clean(inp ? inp.value : "", 500).trim();
    if (!t) { toast("Nhập nội dung phản hồi."); return; }
    db.ref("nox_reports/" + id.split("|").join("/")).update({ reply: t, read: true, repliedAt: SVT() })
      .then(function () { toast("Đã phản hồi."); }).catch(function () { toast("Thất bại."); });
  }
});
function devWatch() {
  if (!state.dev || !db) { devUnwatch(); return; }
  if (devRefs.length) return;
  var p = db.ref("nox_pending"), r = db.ref("nox_reports"), q = db.ref("nox_catreq");
  p.on("value", function (s) { pendAll = flat(s.val()); renderPending(); badge(); }, function () { toast("Không đọc được hàng chờ."); });
  r.on("value", function (s) { repAll = flat(s.val()); renderReports(); badge(); }, function () { toast("Không đọc được báo cáo."); });
  q.on("value", function (s) { reqAll = flat(s.val()); renderReqs(); badge(); }, function () { toast("Không đọc được đề xuất."); });
  devRefs = [p, r, q];
}
function devUnwatch() {
  devRefs.forEach(function (x) { x.off(); });
  devRefs = [];
  pendAll = [];
  repAll = [];
  reqAll = [];
}

/* ---------- Liên kết chia sẻ #/p/<danh-mục>/<khóa> ---------- */
var hashDone = false;
function tryHash() {
  var m = location.hash.match(/^#\/p\/([^/]+)\/([^/]+)$/);
  if (!m || hashDone) return;
  var c = decodeURIComponent(m[1]), k = decodeURIComponent(m[2]);
  if (catOf(c)) listenItems(c);
  if (catOf(c) && ((state.items[c] || {}).list || []).some(function (x) { return x.key === k; })) {
    hashDone = true;
    openDetail(c, k);
  }
}
addEventListener("hashchange", function () { hashDone = false; tryHash(); });
var _afterData = afterData;
afterData = function () { _afterData(); tryHash(); };
/* ---------- Menu & theo dõi tài khoản ---------- */
$("#mUtil").addEventListener("click", function () { closeMenu(); openUtil(); });
$("#mRep").addEventListener("click", openReport);
$("#mSet").addEventListener("click", openSettings);
var _applyUser = applyUser;
applyUser = function () {
  _applyUser();
  devWatch();
  if (uidNow()) loadProf(); else prof = null;
};

/* ---------- Khởi động ---------- */
applyPref();
devWatch();
</script>
