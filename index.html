/* ===== Màu: đen – trắng ===== */
:root,[data-theme=light]{color-scheme:light;--bg:#f4f4f5;--s1:#fff;--s2:#f0f0f1;--bd:#e4e4e7;--bd2:#cfcfd4;--tx:#0a0a0a;--mu:#6b6b72;--acc:#0a0a0a;--acc-tx:#fff;--er:#d92d20;--ok:#0f8a4b;--warn:#b86e00;--dot:#ff3b30;--ph:linear-gradient(135deg,#e4e4e7,#c4c4ca);--sh:0 1px 2px rgba(0,0,0,.04),0 12px 32px -14px rgba(0,0,0,.16);--ov:rgba(0,0,0,.45);--hdr:rgba(255,255,255,.82)}

/* margin:auto => hộp luôn nằm giữa màn hình (cả ngang lẫn dọc); nếu nội dung cao hơn màn hình thì vẫn cuộn được, không bị cắt mất phần đầu */
.box{position:relative;margin:auto;background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:20px;width:100%;max-width:640px;box-shadow:var(--sh);animation:pop .3s cubic-bezier(.2,.8,.2,1)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}

.gm2 .mu{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== Chat (nhóm + hòm thư) ===== */
.modal.room{padding:0;align-items:stretch}
.rbox{position:relative;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;height:100dvh;background:var(--s1);animation:pop .3s cubic-bezier(.2,.8,.2,1)}

.rh>div,.thh>div{min-width:0;flex:1;line-height:1.3}.rh b,.thh b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtools{display:flex;gap:2px}.rtools .ic,.thh .ic,.rh .ic{border-color:transparent;background:none}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.mg{display:flex;gap:8px;max-width:86%;align-items:flex-end}
.mg.me{align-self:flex-end;flex-direction:row-reverse}
.mb{background:var(--s2);padding:8px 12px;border-radius:18px 18px 18px 6px;word-break:break-word;min-width:0}
.mg.me .mb{background:var(--acc);color:var(--acc-tx);border-radius:18px 18px 6px 18px}
.mt{white-space:pre-wrap}
.mb time{display:block;font-size:10px;opacity:.6;margin-top:2px}
.mn{display:block;font-size:12px;opacity:.7;margin-bottom:1px}
.mb .gal{margin-top:6px}
.cmp{display:flex;gap:6px;align-items:center;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--s1)}
.cmp input{flex:1;border-radius:99px}
.cmp .ic{border-color:transparent;background:none}
.thr{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-top:8px;background:var(--s1);border-radius:18px;justify-content:flex-start}
.thr .av{width:42px;height:42px;font-size:16px}
.thr>div{flex:1;min-width:0;line-height:1.35}.thr b{display:flex;align-items:center;gap:6px}
.thr .pv{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thr.un .pv{color:var(--tx);font-weight:600}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--dot);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.thread{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:22px;overflow:hidden;height:calc(100dvh - 140px);min-height:380px}

.pcard{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:22px;margin-bottom:22px}
.pcard .pi{flex:1;min-width:200px}
.pcard h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pst{display:flex;gap:22px;margin:12px 0}.pst div{line-height:1.2}.pst b{display:block;font-size:18px}
.sec{padding:16px 0;border-top:1px solid var(--bd)}.sec:first-child{border-top:0;padding-top:6px}
.sec h3{font-size:14px;font-weight:700;margin-bottom:8px}
.sec .row{margin-top:8px}
.prow{display:flex;gap:14px;align-items:center}
.ln{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cb{padding:10px 12px 12px}.ti{font-size:14px}.ds{font-size:12px}.mu{font-size:11px}h2{font-size:20px}.mg{max-width:92%}}

/* ===== FIREBASE AUTH: đăng ký / đăng nhập / Google / hồ sơ chạy thẳng trên trình duyệt (không cần backend /api) =====
   Dữ liệu hồ sơ: pub/users/{uid} = {name,pic,bio,createdAt} · pub/names/{tênviếtthường} = uid · pub/roles/{uid} = "dev" (chỉ sửa trong Console) */
let fbAuth=null,fbDb=null;
function fbInit(){
  if(fbAuth)return true;
  if(!window.firebase||!firebase.auth||!firebase.database)return false;
  if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
  fbAuth=firebase.auth();fbDb=firebase.database();return true;
}
const fbErr=(status,msg)=>{const e=new Error(msg);e.status=status;return e};
function mapFb(e,google){
  const c=(e&&e.code)||"";console.warn("[firebase]",c,e&&e.message);
  if(google&&["auth/invalid-credential","auth/invalid-oauth-client-id","auth/invalid-idp-response","auth/argument-error","auth/unauthorized-domain"].includes(c))return fbErr(403,t("fb.google"));
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials","auth/invalid-email"].includes(c))return fbErr(401,t("auth.wrong"));
  if(["auth/email-already-in-use","auth/credential-already-in-use","auth/provider-already-linked"].includes(c))return fbErr(409,t("auth.exists"));
  if(c==="auth/account-exists-with-different-credential")return fbErr(409,t("fb.diff"));
  if(c==="auth/too-many-requests")return fbErr(429,t("e.429"));
  if(c==="auth/network-request-failed")return fbErr(0,t("e.gen"));
  if(c==="auth/operation-not-allowed")return fbErr(403,t("fb.off"));
  if(c==="auth/user-disabled")return fbErr(403,t("e.403"));
  if(c==="auth/requires-recent-login")return fbErr(401,t("fb.recent"));
  if(c==="auth/weak-password")return fbErr(400,t("v.pw.weak"));
  return fbErr(0,(e&&e.message)||t("e.gen"));
}
async function fbMe(u){
  const [p,r]=await Promise.all([dbGet("pub/users/"+u.uid).catch(()=>null),dbGet("pub/roles/"+u.uid).catch(()=>null)]);
  const pv=u.providerData.map(x=>x.providerId);
  return{userId:u.uid,name:(p&&p.name)||u.displayName||(u.email||"user").split("@")[0],pic:(p&&p.pic)||u.photoURL||"",bio:(p&&p.bio)||"",role:r==="dev"?"dev":"user",email:u.email||"",createdAt:(p&&p.createdAt)||0,hasPassword:pv.includes("password"),googleLinked:pv.includes("google.com")};
}
const nameKey=n=>"pub/names/"+encodeURIComponent(String(n).toLowerCase());
async function nameFree(n,uid){const v=await dbGet(nameKey(n)).catch(()=>null);return !v||v===uid}
async function claimName(n,uid){
  try{await fbDb.ref("pub/names/"+String(n).toLowerCase()).set(uid)}catch(e){
    if(await nameFree(n,uid))throw fbErr(403,t("fb.rules"));
    throw fbErr(409,t("auth.nametaken"));
  }
}
async function fbRegister(b){
  if(!await nameFree(b.name))throw fbErr(409,t("auth.nametaken"));
  let cr;try{cr=await fbAuth.createUserWithEmailAndPassword(b.email,b.password)}catch(e){throw mapFb(e)}
  const u=cr.user;
  try{await claimName(b.name,u.uid)}catch(e){await u.delete().catch(()=>{});throw e}
  try{await fbDb.ref("pub/users/"+u.uid).set({name:b.name,pic:"",bio:"",createdAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn("[profile]",e)}
  try{await u.updateProfile({displayName:b.name})}catch(e){}
  return fbMe(u);
}
async function fbLogin(b){
  let cr;try{cr=await fbAuth.signInWithEmailAndPassword(b.email,b.password)}catch(e){throw mapFb(e)}
  return fbMe(cr.user);
}
async function fbGoogle(credential){
  let r;try{r=await fbAuth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(credential))}catch(e){throw mapFb(e,true)}
  const u=r.user;
  const p=await dbGet("pub/users/"+u.uid).catch(()=>null);
  if(!p){
    let base=((u.email||"user").split("@")[0]).replace(/[^\p{L}\p{N}_]/gu,"_").slice(0,18);
    if(base.length<3)base=(base+"user").slice(0,18);
    let name=base,ok=false;
    for(let i=0;i<6&&!ok;i++){
      if(i)name=base.slice(0,19)+Math.floor(1000+Math.random()*9000);
      if(!await nameFree(name,u.uid))continue;
      try{await claimName(name,u.uid);ok=true}catch(e){if(e.status!==409)throw e}
    }
    if(!ok)throw fbErr(409,t("auth.nametaken"));
    try{await fbDb.ref("pub/users/"+u.uid).set({name,pic:u.photoURL||"",bio:"",createdAt:firebase.database.ServerValue.TIMESTAMP})}catch(e){console.warn("[profile]",e)}
    try{await u.updateProfile({displayName:name})}catch(e){}
  }
  return fbMe(u);
}
async function localApi(path,method,body){
  const k=method+" "+path;
  const um=path.match(/^\/users\/([^/]+)$/);
  if(!(k==="POST /auth/register"||k==="POST /auth/login"||k==="POST /auth/google"||k==="POST /auth/logout"||k==="GET /me"||k==="POST /me/link-google"||k==="POST /me/profile"||k==="POST /me/name"||k==="POST /me/password"||(method==="GET"&&um)))return undefined;
  if(!fbInit())throw fbErr(0,t("fb.noload"));
  const u=fbAuth.currentUser;
  if(um){
    const id=decodeURIComponent(um[1]);
    const [p,r]=await Promise.all([dbGet("pub/users/"+id),dbGet("pub/roles/"+id).catch(()=>null)]);
    if(!p)throw fbErr(404,t("e.404"));
    return{userId:id,name:p.name,pic:p.pic||"",bio:p.bio||"",role:r==="dev"?"dev":"user",createdAt:p.createdAt||0,postCount:0,likeCount:0};
  }
  switch(k){
    case "POST /auth/register":return fbRegister(body);
    case "POST /auth/login":return fbLogin(body);
    case "POST /auth/google":return fbGoogle(body.credential);
    case "POST /auth/logout":await fbAuth.signOut();return{ok:true};
  }
  if(!u)throw fbErr(401,t("e.expired"));
  switch(k){
    case "GET /me":return fbMe(u);
    case "POST /me/link-google":
      try{await u.linkWithCredential(firebase.auth.GoogleAuthProvider.credential(body.credential))}catch(e){throw mapFb(e,true)}
      await u.reload();return fbMe(fbAuth.currentUser);
    case "POST /me/profile":{
      const d={bio:String(body.bio||"").slice(0,200),pic:body.pic||""};
      try{await fbDb.ref("pub/users/"+u.uid).update(d)}catch(e){throw fbErr(403,t("fb.rules"))}
      return d;
    }
    case "POST /me/name":{
      const n=String(body.name||"").trim(),old=me&&me.name;
      if(!await nameFree(n,u.uid))throw fbErr(409,t("n.taken"));
      await claimName(n,u.uid);
      try{await fbDb.ref("pub/users/"+u.uid+"/name").set(n)}catch(e){throw fbErr(403,t("fb.rules"))}
      if(old&&old.toLowerCase()!==n.toLowerCase())fbDb.ref("pub/names/"+old.toLowerCase()).remove().catch(()=>{});
      try{await u.updateProfile({displayName:n})}catch(e){}
      return{name:n};
    }
    case "POST /me/password":
      try{
        if(me&&me.hasPassword!==false){
          await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,body.current||""));
          await u.updatePassword(body.password);
        }else await u.linkWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,body.password));
      }catch(e){throw mapFb(e)}
      return{ok:true};
  }
}
async function api(path,method="GET",body){
  const L=await localApi(path,method,body);
  if(L!==undefined)return L;
  let r;
  try{r=await fetch(API+path,{method,credentials:"include",headers:{"Content-Type":"application/json","X-Skibidi":"1"},body:body?JSON.stringify(body):undefined})}
  catch(e){console.warn("[api] network",method,path,e);const er=new Error(t("e.gen"));er.net=true;throw er}
  const raw=await r.text();let j=null;try{j=JSON.parse(raw)}catch(e){}
  if(!r.ok)console.warn("[api]",method,path,r.status,raw.slice(0,300));
  if(r.status===401&&me&&!path.startsWith("/auth/")){me=null;myVotes={};setUnread(0);renderAuth();throw new Error(t("e.expired"))}
  if(!r.ok){
    const sv=j&&j.error?String(j.error):"";let m;
    if(r.status>=500)m=t("e.server")+(sv?" ("+sv+")":" ["+r.status+"]");
    else if(r.status===404&&!j)m=t("e.unavail");
    else{m=t("e."+r.status)!=="e."+r.status?t("e."+r.status):t("e.code",r.status);m+=sv?": "+sv:""}
    const er=new Error(m);er.status=r.status;throw er;
  }
  if(j===null){const er=new Error(t("e.bad"));er.status=502;throw er}
  return j;
}

  const p=v.split("@");
  if(p.length>2)return t("v.em.at2");
  if(p[1]!=="gmail.com")return t("v.em.dom");
  if(p[0].length<6||p[0].length>30)return t("v.em.len");
  if(!/^[a-z0-9.]+$/.test(p[0]))return t("v.em.chars");
  if(/^\.|\.$|\.\./.test(p[0]))return t("v.em.dots");
  return"";
}
function pwCheck(p){
  const r={len:p.length>=8,up:/\p{Lu}/u.test(p),sp:/[^\p{L}\p{N}\s]/u.test(p),ns:!/\s/.test(p)};
  const extra=[/\p{Ll}/u.test(p),/\d/.test(p),p.length>=12].filter(Boolean).length;
  let lv=p?1:0;
  if(r.len&&r.up&&r.sp&&r.ns){lv=2;if(extra===3)lv=3}
  return{r,lv};
}
function pwErr(p){
  if(!p)return t("v.pw.empty");
  if(/\s/.test(p))return t("v.pw.space");
  if(pwCheck(p).lv<2)return t("v.pw.weak");
  return"";
}
function onName(force){

function onPw(force){

function onPw2(force){

async function authGo(){

  if(now<lockUntil)return setMsg("aMsg",t("auth.locked",Math.ceil((lockUntil-now)/1000)),"bad");
  const eN=reg?onName(1):"",eE=onEmail(1),eP=onPw(1),eP2=reg?onPw2(1):"";

const viewHash=()=>"#/"+({home:curGame?"g/"+curGame:curType?"c/"+curType:"",games:"games",world:"world",liked:"liked",mine:"mine",inbox:"inbox"+(viewArg?"/"+encodeURIComponent(viewArg):""),profile:"u/"+encodeURIComponent(viewArg)}[view]||"");
function go(h){

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/").map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});let k=p[0];
  if(k!=="post"&&openId)closeDetail(true);
  closeRoom();
  if(["liked","mine","inbox"].includes(k)&&!me){openAuth("login");history.replaceState(null,"","#/");k=""}
  if((k==="games"||k==="world")&&navHidden(k)&&!isDev()){history.replaceState(null,"","#/");k=""}
  if(k==="games"||k==="world"||k==="liked"||k==="mine")show(k);
  else if(k==="inbox")show("inbox",p[1]||"");
  else if(k==="u"&&p[1])show("profile",p[1]);

async function loadPosts(silent){
  const el=$("posts"),k=curGame+"|"+curType+"|"+limit;loadKey=k;
  if(!(silent&&all.length))region(el,"loading");
  renderHead();
  try{
    let qs=`?orderBy="createdAt"&limitToLast=${limit}`;
    if(curGame)qs=`?orderBy="gameId"&equalTo=${JSON.stringify(curGame)}&limitToLast=${limit}`;
    else if(curType)qs=`?orderBy="type"&equalTo=${JSON.stringify(curType)}&limitToLast=${limit}`;
    let d;
    try{d=await dbGet("pub/posts",qs)}
    catch(e){
      /* Firebase báo lỗi 400 khi chưa khai báo ".indexOn" cho createdAt/type/gameId.
         Thử lại bằng truy vấn theo khóa (không cần index) và lọc ở phía trình duyệt. */
      if(e.status!==400)throw e;
      d=await dbGet("pub/posts",`?orderBy="$key"&limitToLast=${limit*4}`);
    }
    d=d||{};
    if(k!==loadKey)return;
    all=Object.entries(d).filter(([,v])=>v&&typeof v==="object").map(([id,v])=>({id,...v}));
    renderPosts();
  }catch(e){if(k===loadKey)region(el,"error",e,()=>loadPosts())}
}

function shrink(file){
  return new Promise((ok,no)=>{
    const i=new Image(),u=URL.createObjectURL(file);
    i.onload=()=>{
      URL.revokeObjectURL(u);let d="";
      for(const[max,q]of[[1000,.82],[800,.65],[600,.55]]){
        const r=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");
        c.width=Math.round(i.width*r);c.height=Math.round(i.height*r);c.getContext("2d").drawImage(i,0,0,c.width,c.height);
        d=c.toDataURL("image/jpeg",q);if(d.length<520000)break;
      }
      ok(d);
    };
    i.onerror=()=>no(new Error(t("img.bad")));i.src=u;
  });
}

const roomSub=()=>{$("rSub").textContent=t("g.members",roomG.memberCount||0)};
function closeRoom(){stopPoll("room");if(!roomG)return;roomG=null;closeM($("mRoom"))}
async function fetchRoom(first){
  const g=roomG;if(!g)return;
  try{
    const after=roomMsgs.length?roomMsgs[roomMsgs.length-1].createdAt:0;
    const r=await api("/world/groups/"+encodeURIComponent(g.id)+"/messages"+(after?"?after="+after:""));
    if(roomG!==g)return;
    if(r.group)Object.assign(g,r.group);
    const ms=(r.messages||[]).filter(m=>!roomMsgs.some(x=>x.id===m.id));
    if(ms.length||first){roomMsgs=roomMsgs.concat(ms);paintList($("rList"),roomMsgs,true,"c.empty",first);roomSub()}
  }catch(e){
    if(roomG!==g)return;
    if(e.status===403){g.joined=false;closeRoom();renderGroups();return toast(e.message)}
    if(first){$("rList").innerHTML=`<div class="st" style="min-height:160px"><b>${esc(t("e.load"))}</b><button class="pri" onclick="fetchRoom(true)">${esc(t("reload"))}</button></div>`}
  }
}
const renderRGalImgs=()=>{$("rGal").innerHTML=thumbs(roomImgs,"rmRoomImg")};
function rmRoomImg(i){roomImgs.splice(i,1);renderRGalImgs()}
function addRoomImg(){if(roomImgs.length>=4)return toast(t("w.max4"));pickFile(v=>{if(roomImgs.length<4){roomImgs.push(v);renderRGalImgs()}})}
async function sendRoom(){

}
async function leaveRoom(){

async function pwRoom(){

const openRoomHeadRefresh=()=>{if(roomG){$("rName").innerHTML=esc(roomG.name)+(roomG.locked?" "+svg("lock",13):"")}renderGroups()};
async function delRoom(){

let inboxWith="",threadMsgs=[],threadWith=null;
async function loadInbox(){
  const el=$("inboxBody");inboxWith="";region(el,"loading");
  try{
    const r=await api("/inbox");setUnread(r.unread||0);
    const th=r.threads||[];
    if(!th.length)return region(el,"empty",t("in.none"));
    region(el,"success");
    el.innerHTML=th.map(x=>`<button class="thr${x.unread?" un":""}" onclick="go('inbox/'+encodeURIComponent(${jsq(x.withId)}))">${avatar(x.withName,x.withPic)}<div><b>${esc(x.withName||x.withId)}${devTag(x.withRole)}</b><span class="mu pv">${esc(x.last||"")}</span></div><span class="mu">${x.lastAt?esc(ago(x.lastAt)):""}</span>${x.unread?`<span class="cnt">${x.unread>9?"9+":x.unread}</span>`:""}</button>`).join("");
  }catch(e){region(el,"error",e,loadInbox)}
}
async function openThread(uid){
  const el=$("inboxBody");inboxWith=uid;region(el,"loading");
  try{
    const r=await api("/inbox/"+encodeURIComponent(uid));
    if(inboxWith!==uid||view!=="inbox")return;
    threadMsgs=r.messages||[];threadWith=r.with||{userId:uid,name:uid};
    region(el,"success");
    el.innerHTML=`<div class="thread"><div class="thh"><button class="ic" onclick="go('inbox')" aria-label="${esc(t("back"))}">${svg("back")}</button><div class="au lk" onclick="openProfile(${jsq(uid)})" style="flex:1">${avatar(threadWith.name,threadWith.pic)}<div><b>${esc(threadWith.name||uid)}${devTag(threadWith.role)}</b></div></div></div><div class="msgs" id="tList"></div><div class="cmp"><input id="tIn" maxlength="1000" placeholder="${esc(t("in.ph"))}" onkeydown="if(event.key==='Enter')sendThread()"><button class="pri ic" id="tSend" onclick="sendThread()" aria-label="${esc(t("send"))}">${svg("send")}</button></div></div>`;
    paintList($("tList"),threadMsgs,false,"in.empty",true);
    pollUnread();startPoll("thread",5000,pollThread);
  }catch(e){region(el,"error",e,()=>openThread(uid))}
}
async function pollThread(){
  const uid=inboxWith;if(!uid)return;
  try{
    const r=await api("/inbox/"+encodeURIComponent(uid));if(inboxWith!==uid||!$("tList"))return;
    const ms=r.messages||[];
    if(ms.length!==threadMsgs.length||(ms.length&&ms[ms.length-1].id!==threadMsgs[threadMsgs.length-1].id)){threadMsgs=ms;paintList($("tList"),threadMsgs,false,"in.empty")}
  }catch(e){}
}
async function sendThread(){
  const i=$("tIn"),text=i.value.trim();if(!text||!inboxWith)return;
  const b=$("tSend");b.disabled=true;
  try{
    const m=await api("/inbox/send","POST",{toId:inboxWith,text});
    i.value="";if(m&&m.id&&!threadMsgs.some(x=>x.id===m.id))threadMsgs.push(m);
    paintList($("tList"),threadMsgs,false,"in.empty",true);
  }catch(e){toast(e.message)}
  b.disabled=false;i.focus();
}

const RK=["bug","link","abuse","account","idea","other"],RS=["low","mid","high"];

  const text=$("rpText").value.trim();

      <div class="pw" style="margin-top:8px"><input id="pwNew" type="password" maxlength="64" autocomplete="new-password" placeholder="${esc(t("s.pass.new"))}"><button type="button" class="eye" onclick="eye('pwNew',this)">${svg("eye")}</button></div>

async function saveName(){

async function savePass(){

}
function devReply(uid){closeM($("mDev"));go("inbox/"+encodeURIComponent(uid))}
async function devDone(id){try{await api("/dev/reports/"+id,"DELETE");devRender()}catch(e){toast(e.message)}}
async function devSettings(){
  const hn=siteCfg.hiddenNav||{};
  try{await api("/dev/settings","POST",{moderation:$("sMod").checked,announcement:$("sAnn").value,hiddenNav:hn});siteCfg.announcement=$("sAnn").value;if(view==="home")renderHead();toast(t("saved"))}catch(e){toast(e.message)}
}
async function toggleNav(k,show){
  try{
    if(k.startsWith("c:")){
      const c=k.slice(2),d={name:catName(c),img:catImg(c),actions:catActions(c),hidden:!show};
      const r=await api("/dev/categories/"+c,"POST",d);cats[c]=r&&typeof r==="object"&&r.name?r:{...cats[c],...d};
    }else{
      const hn={...(siteCfg.hiddenNav||{}),[k]:!show};
      let s={};try{s=await api("/dev/settings")}catch(e){}
      await api("/dev/settings","POST",{moderation:s.moderation!==false,announcement:s.announcement||"",hiddenNav:hn});siteCfg.hiddenNav=hn;
    }
    renderNav();renderPop();toast(t("saved"));
  }catch(e){toast(e.message);devRender()}
}
const catData=it=>({name:it.querySelector('[data-k=name]').value.trim(),img:it.querySelector('[data-k=img]').value.trim(),actions:[...it.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value)});
function catOk(d){
  if(!d.name)return"Hãy nhập tên mục";
  if(d.img&&!imgSrc(d.img))return"Ảnh không hợp lệ (cần https:// hoặc tải ảnh lên)";
  return"";
}
async function devAddCat(b){
  const d=catData(b.closest(".item")),er=catOk(d);if(er)return toast(er);
  if(!d.actions.length)d.actions=["detail"];
  try{
    const r=await api("/categories","POST",d);
    let c=r;try{c=await api("/dev/categories/"+r.id,"POST",d)}catch(e){}
    cats[r.id]=c&&typeof c==="object"?c:r;fillCats();devRender();toast("Đã thêm mục "+d.name);
  }catch(e){toast(e.message)}
}
async function saveCat(b){
  const it=b.closest(".item"),c=it.dataset.id,d=catData(it),er=catOk(d);if(er)return toast(er);
  if(!d.actions.length)d.actions=["detail"];
  d.hidden=catHidden(c);
  try{cats[c]=await api("/dev/categories/"+c,"POST",d);fillCats();devRender();toast(t("saved"))}catch(e){toast(e.message)}
}
async function delCat(b){
  const c=rid(b);if(!await yes({title:"Xóa mục này?",ok:t("del"),danger:true}))return;
  try{await api("/dev/categories/"+c,"DELETE");delete cats[c];fillCats();devRender()}catch(e){toast(e.message)}
}
const devSet=async(id,b)=>{try{await api("/dev/posts/"+id,"POST",b);devRender();loadPosts()}catch(e){toast(e.message)}};
const devDel=async id=>{if(!await yes({title:"Xóa vĩnh viễn?",ok:t("del"),danger:true}))return;try{await api("/posts/"+id,"DELETE");devRender();loadPosts()}catch(e){toast(e.message)}};
async function devGame(id,patch){
  try{
    if(!patch){
      const d={name:$("gN").value.trim(),img:$("gI").value.trim(),desc:$("gD").value,order:+$("gO").value||0};
      if(!d.name)return toast("Hãy nhập tên game");
      if(d.img&&!imgSrc(d.img))return toast("Ảnh không hợp lệ (cần https:// hoặc tải ảnh lên)");
      await api("/dev/games","POST",d);
    }else await api("/dev/games","POST",{id,...patch});
    devRender();loadGames();
  }catch(e){toast(e.message)}
}
async function devRename(b){const n=await ask({title:"Tên mới",input:"text",value:b.closest(".item").dataset.n,max:40,ok:t("save")});if(n&&n.trim())devGame(rid(b),{name:n.trim()})}
async function devGameDel(id){if(!await yes({title:"Xóa game?",ok:t("del"),danger:true}))return;try{await api("/dev/games/"+id,"DELETE");devRender();loadGames()}catch(e){toast(e.message)}}

/* ===== KHỞI ĐỘNG ===== */
applyTheme(themePref);applyStatic();applyIcons();
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pollUnread()});
const qp=new URLSearchParams(location.search).get("q");if(qp)$("q").value=qp;
setInterval(pollUnread,30000);
(async()=>{
  await restore();renderAuth();renderNav();renderPop();
  loadCats();loadCfg();loadGames();route();pollUnread();
})();
</script>
</body>
</html>
