<!DOCTYPE html>
<!-- SKIBIDI SCRIPT WEB v4.1 — Fix spin + clock x5 + new loader -->
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKIBIDI SCRIPT</title>
<meta name="theme-color" content="#0a0e16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%230e1420'/%3E%3Cpath d='M65 35C63 28 57 25 50 25C42 25 36 29 36 36C36 44 44 46 50 49C57 52 64 55 64 63C64 70 58 75 50 75C42 75 36 71 34 64' fill='none' stroke='%2329d6c5' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--acc:#7c5cff;--acc2:#29d6c5;--bg0:#0a0e16;--bg1:#141c30;--panel:#151d33;--panel2:#10162a;--txt:#f4f7fb;--sub:#a7b1c9;--line:rgba(255,255,255,.09);--r:20px;--danger:#ff7b7b;--ok:#3ddc97;--g-blur:18px;--g-op:.32;--g-light:.55;--g-bd:.65;--g-tint:150,180,255;--ez:cubic-bezier(.22,1,.36,1);--pop:cubic-bezier(.34,1.56,.64,1)}
body.t-glass{--panel:rgba(var(--g-tint),calc(var(--g-op)*.55));--panel2:rgba(var(--g-tint),calc(var(--g-op)*.3));--line:rgba(255,255,255,calc(.12 + var(--g-bd)*.2));--bg0:#0d1526;--bg1:#1b2b4a}
body.t-turbo{--acc:#ff5c7a;--acc2:#ffc94d;--panel:#191430;--panel2:#130f24;--bg0:#150826;--bg1:#2d0f45;--r:26px}
body.t-nat{--panel:rgba(245,248,252,.82);--panel2:rgba(235,242,248,.66);--txt:#152238;--sub:#4c5b74;--line:rgba(30,50,80,.14);--acc:#2f8a5b;--acc2:#e8a33d;--bg0:#8fd0ff;--bg1:#eaf7ff}
body.t-nat.night{--panel:rgba(18,26,44,.78);--panel2:rgba(14,20,36,.62);--txt:#eef3fa;--sub:#9fb0cc;--line:rgba(255,255,255,.1);--bg0:#0a1226;--bg1:#16223c}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg0)}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:color .4s}
body.modal-open{overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(128,140,170,.35);border-radius:99px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
img{max-width:100%}
/* ===== NỀN ===== */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgSky{position:absolute;inset:0;background:linear-gradient(var(--bg0),var(--bg1));transition:background 1.5s}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform;animation:orbA 30s ease-in-out infinite alternate}
.orb:nth-child(2){animation-duration:36s!important;animation-delay:-9s}
.orb:nth-child(3){animation-duration:26s!important;animation-delay:-4s}
@keyframes orbA{0%{transform:translate(-4vw,-3vh) scale(1)}50%{transform:translate(5vw,4vh) scale(1.12)}100%{transform:translate(-3vw,6vh) scale(.96)}}
body.t-nox .orb{opacity:.26;animation:none}
body.perf-low .orb{animation:none}
#natWrap{position:absolute;inset:0;display:none}
body.t-nat #natWrap{display:block}
body.t-nat #orbWrap{display:none}
#stars{position:absolute;inset:0;opacity:0;transition:opacity 1.5s}
.night #stars{opacity:1}
.st{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
#sunMoon{position:absolute;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);transition:left 1.4s linear,top 1.4s linear,background 1s,box-shadow 1s}
#sunMoon.sun{background:radial-gradient(circle at 35% 35%,#fff6d8,#ffd76a);box-shadow:0 0 60px 18px rgba(255,220,130,.35)}
#sunMoon.moon{background:radial-gradient(circle at 35% 35%,#f4f7fb,#b9c4dd);box-shadow:0 0 46px 12px rgba(190,205,255,.3)}
body.ev-halloween #sunMoon.moon{background:radial-gradient(circle at 38% 36%,#ffe2a8,#ff8a2a 75%);box-shadow:0 0 90px 26px rgba(255,130,30,.4)}
#natSvg{position:absolute;left:0;right:0;bottom:0;width:100%;height:52vh}
#fog{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;background:linear-gradient(180deg,transparent,rgba(200,210,225,.22),transparent)}
#wxCanvas{position:absolute;inset:0}
#natBgImg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
#themeImg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .8s;z-index:2}
body.hasBgImg #themeImg{opacity:1}
#natSvg .m1{fill:var(--nm1,#1b2a4a)}#natSvg .m2{fill:var(--nm2,#12203b)}
#natSvg .grassB{fill:var(--grB,#1d4a2c)}#natSvg .grassF{fill:var(--grF,#12301f)}
#natSvg .trees{fill:var(--tr,#0d2418)}
body.szn-autumn{--grB:#6d4a1f;--grF:#4a3014;--tr:#3a2410;--nm1:#3a2c4a;--nm2:#241a30}
body.szn-summer{--nm1:#1c3a55;--nm2:#12283c}
body.ev-halloween{--nm1:#241530;--nm2:#170d20;--grB:#2a1a10;--grF:#1a100a;--tr:#120a08}
body.ev-christmas{--grB:#b8c8d8;--grF:#9fb2c6;--tr:#22303e}
body.ev-tet{--nm1:#2a3a5c;--nm2:#1a2740}
/* ===== KÍNH LỎNG ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 26px -12px rgba(0,0,0,.45)}
body.t-glass .card,body.t-glass .bar,body.t-glass #bnav{position:relative;-webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.6) brightness(1.08);backdrop-filter:blur(var(--g-blur)) saturate(1.6) brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,calc(var(--g-light)*.7)),inset 0 0 0 1px rgba(255,255,255,calc(var(--g-bd)*.22)),inset 0 -14px 30px -18px rgba(255,255,255,calc(var(--g-light)*.5)),0 14px 34px -14px rgba(0,0,0,.5)}
body.t-glass .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.1px;pointer-events:none;background:conic-gradient(from 210deg,rgba(255,255,255,.9),rgba(150,205,255,calc(var(--g-bd)*.5)) 16%,rgba(255,255,255,.05) 40%,rgba(255,190,235,calc(var(--g-bd)*.45)) 76%,rgba(255,255,255,.9));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
body.t-glass .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 60% at 20% 0%,rgba(255,255,255,calc(var(--g-light)*.28)),transparent 55%)}
body.t-glass .card>*{position:relative;z-index:1}
/* ===== HEADER / NAV ===== */
#hdr{position:fixed;top:12px;left:14px;right:14px;z-index:100;display:flex;align-items:center;gap:8px}
.bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:18px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;letter-spacing:.03em;padding:4px 6px}
.logo{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(120deg,var(--acc),var(--acc2))}
.logo svg{width:22px;height:22px}
.clockTx{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.85;padding:0 6px;white-space:nowrap}
.ibtn{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;position:relative;transition:transform .25s var(--pop),background .2s}
.ibtn:hover{background:rgba(255,255,255,.08)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:19px;height:19px}
.dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;display:none}
.ibtn.hasdot .dot,.nitem.hasdot .dot{display:block}
#avBtn{border-radius:50%;overflow:visible}
#bnav{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:100;display:flex;justify-content:center;pointer-events:none}
#bnav .bar{pointer-events:auto;gap:2px;max-width:96vw;overflow-x:auto;scrollbar-width:none}
#bnav .bar::-webkit-scrollbar{display:none}
.nitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 13px;border-radius:15px;font-size:10.5px;font-weight:700;color:var(--sub);position:relative;transition:color .2s,background .2s}
.nitem svg{width:20px;height:20px}
.nitem.on{color:var(--txt);background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 30%,transparent),color-mix(in srgb,var(--acc2) 30%,transparent))}
#bnav .nitem .dot{top:4px;right:8px}
@media(max-width:560px){.brand span.tx{display:none}.clockTx{display:none}}
/* ===== MAIN ===== */
#main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:86px 16px 130px}
.hero{padding:30px 26px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(26px,5.5vw,42px);font-weight:800;line-height:1.08}
.hero p{color:var(--sub);font-size:14px;line-height:1.7;max-width:56ch}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.icard{padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .3s var(--pop);animation:cin .45s var(--ez) backwards;animation-delay:calc(var(--i,0)*40ms)}
.icard:hover{transform:translateY(-4px)}
.icard h3{font-size:14.5px;font-weight:700}
.icard .desc{color:var(--sub);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .thumb{border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--acc) 14%,transparent);aspect-ratio:16/8;display:grid;place-items:center}
.icard .thumb img{width:100%;height:100%;object-fit:cover}
.cfoot{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--sub)}
.empty{padding:26px;text-align:center;color:var(--sub);font-size:13px}
.sechead{display:flex;align-items:center;gap:10px;margin:20px 2px 10px}
.sechead h2{font-size:16px;font-weight:800;flex:1}
.searchbar{display:flex;align-items:center;gap:8px;margin-top:10px;padding:0 14px;border-radius:15px;background:color-mix(in srgb,var(--txt) 7%,transparent);border:1px solid var(--line)}
.searchbar svg{width:17px;height:17px;opacity:.7;flex:none}
.searchbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--txt);font-size:14px;padding:13px 0}
/* ===== BUTTONS / INPUTS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px;padding:11px 16px;border-radius:14px;transition:transform .25s var(--pop),opacity .2s;min-height:42px}
.btn:active{transform:scale(.94)}
.btn svg{width:15px;height:15px}
.btn-p{color:#fff;background:linear-gradient(120deg,var(--acc),var(--acc2));box-shadow:0 6px 18px -6px color-mix(in srgb,var(--acc) 60%,transparent)}
.btn-g{background:color-mix(in srgb,var(--txt) 8%,transparent);border:1px solid var(--line)}
.btn-d{color:#fff;background:linear-gradient(120deg,#e5484d,#b52a30)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:12px;min-height:34px;border-radius:11px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{padding:12px 14px;border-radius:14px;font-size:14px;color:var(--txt);background:color-mix(in srgb,var(--txt) 7%,transparent);border:1px solid var(--line);outline:none;min-height:44px;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc2)}
.fld textarea{min-height:92px;resize:vertical}
.fld input[type=range]{padding:0;accent-color:var(--acc2);min-height:0;border:none;background:none}
.fld input[type=color]{padding:4px;height:44px}
.fld select option{color:#111}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-radius:16px;background:color-mix(in srgb,var(--txt) 6%,transparent);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.srow svg{width:17px;height:17px;flex:none}
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;z-index:1;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--txt) 20%,transparent);transition:background .25s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .3s var(--pop)}
.sw input:checked+i{background:var(--acc2)}.sw input:checked+i::after{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--sub);background:color-mix(in srgb,var(--txt) 7%,transparent);border:1px solid var(--line)}
.seg button.on{color:#fff;background:linear-gradient(120deg,var(--acc),var(--acc2));border-color:transparent}
.tabsbar{display:flex;gap:5px;overflow-x:auto;padding:5px;border-radius:16px;background:color-mix(in srgb,var(--txt) 6%,transparent);border:1px solid var(--line);scrollbar-width:none}
.tabsbar::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:12px;font-size:13px;font-weight:700;color:var(--sub);transition:color .2s,background .2s}
.tab.on{color:#fff;background:linear-gradient(120deg,var(--acc),var(--acc2))}
/* ===== POPUP ===== */
#ov{position:fixed;inset:0;z-index:170;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px)}
#ov.on{opacity:1;pointer-events:auto}
.pop{position:fixed;left:50%;top:50%;z-index:180;width:min(580px,94vw);max-height:min(86vh,820px);display:none;flex-direction:column;transform:translate(-50%,-50%) scale(.95);opacity:0}
.pop.on{display:flex;animation:pin .35s var(--ez) forwards}
@keyframes pin{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.pop .card{display:flex;flex-direction:column;max-height:inherit;overflow:hidden}
.p-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;flex:none}
.p-h h3{flex:1;font-size:17px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-b{overflow-y:auto;padding:4px 18px 20px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
#popAuth{width:min(430px,92vw)}
#popCfg,#popDev{width:min(720px,96vw);height:min(88vh,860px);max-height:none}
#popChat{width:min(560px,96vw);height:min(84vh,780px);max-height:none}
.chatBody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.5;word-break:break-word;align-self:flex-start;background:color-mix(in srgb,var(--txt) 9%,transparent);border:1px solid var(--line)}
.msg.me{align-self:flex-end;color:#fff;background:linear-gradient(120deg,var(--acc),var(--acc2));border:none}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.msg img{border-radius:10px;margin-top:4px;cursor:zoom-in;max-height:180px}
.chatIn{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex:none;align-items:center}
.chatIn input{flex:1;min-width:0;background:color-mix(in srgb,var(--txt) 7%,transparent);border:1px solid var(--line);border-radius:13px;outline:none;color:inherit;font-size:14px;padding:11px 14px}
.ibtn.rec{background:#e5484d!important;animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{opacity:.6}}
/* ===== PROFILE ===== */
.pfHead{display:flex;gap:16px;align-items:center;padding:22px;flex-wrap:wrap}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;background-size:cover;background-position:center}
.pfInfo{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.pfInfo .nm{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uidTag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--acc2) 20%,transparent);border:1px solid color-mix(in srgb,var(--acc2) 40%,transparent)}
.nm-glow{text-shadow:0 0 14px var(--acc2)}
.nm-rainbow{background:linear-gradient(90deg,#ff5c7a,#ffc94d,#3ddc97,#5cb8ff);-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rb 4s linear infinite alternate;background-size:200%}
@keyframes rb{to{background-position:200%}}
.fr-gold{box-shadow:0 0 0 3px #ffd76a,0 0 18px rgba(255,215,106,.5)}
.fr-neon{box-shadow:0 0 0 2.5px var(--acc2),0 0 16px var(--acc2)}
.fr-heart{box-shadow:0 0 0 3px #ff6b9d,0 0 16px rgba(255,107,157,.55)}
.pfMeta{color:var(--sub);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* ===== LOADER CHÍNH (mới) ===== */
#boot{position:fixed;inset:0;z-index:700;display:grid;place-items:center;background:radial-gradient(120% 110% at 50% -10%,var(--bg1),var(--bg0));overflow:hidden;transition:opacity .6s,visibility 0s .6s}
#boot.hide{opacity:0;pointer-events:none;visibility:hidden}
#boot.hide *{animation-play-state:paused!important}
#boot.err .spin{animation:none;border-top-color:var(--danger)!important;border-right-color:var(--danger)!important}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:1;padding:24px;text-align:center}
.bring{position:relative;width:118px;height:118px;display:grid;place-items:center}
.bring .arc{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--acc2) calc(var(--bp,0)*1%),rgba(255,255,255,.09) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));transition:background .5s}
.bring .spin{position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc2);border-right-color:var(--acc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blogo{width:60px;height:60px;border-radius:19px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 12px 32px -8px color-mix(in srgb,var(--acc) 75%,transparent);animation:bpulse 2.2s ease-in-out infinite}
.blogo svg{width:36px;height:36px}
@keyframes bpulse{50%{transform:scale(1.08)}}
.bname{font-size:15px;font-weight:800;letter-spacing:.34em;background:linear-gradient(90deg,#fff 20%,var(--acc2) 50%,#fff 80%);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
@keyframes shimmer{to{background-position:-200%}}
.bbar{width:min(240px,60vw);height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s var(--ez);box-shadow:0 0 12px var(--acc2)}
.bstep{font-size:12.5px;color:var(--sub);min-height:18px}
.borb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.45;animation:orbA 24s ease-in-out infinite alternate}
body.perf-low .borb{animation:none}
/* loading khu vực: 3 chấm nhún */
.loadArea{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px;color:var(--sub);font-size:13px}
.ldots{display:flex;gap:6px}
.ldots i{width:7px;height:7px;border-radius:50%;background:var(--acc2);animation:bd 1s ease-in-out infinite}
.ldots i:nth-child(2){animation-delay:.15s}.ldots i:nth-child(3){animation-delay:.3s}
@keyframes bd{40%{transform:translateY(-6px);opacity:.45}}
.skel{border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

 acx(){if(!this.ac){const AC=window.AudioContext||window.webkitAudioContext;this.ac=new AC();this.master=this.ac.createGain();this.master.gain.value=0;this.master.connect(this.ac.destination)}if(this.ac.state==="suspended")this.ac.resume();return this.ac},
 noise(ac){const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;return s},
 chain(ac,type,freq,gain){const s=this.noise(ac),f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(this.master);s.start();this.layers.push(s)},
 stop(){this.layers.forEach(n=>{try{n.stop()}catch(_){}});this.layers=[];this.timers.forEach(clearInterval);this.timers=[];this.type="off"},
 set(type){if(!state.snd||type===this.type)return;const ac=this.acx();this.stop();this.type=type;if(type==="none"){this.master.gain.setTargetAtTime(0,ac.currentTime,.3);return}
  this.master.gain.setTargetAtTime(state.vol/100,ac.currentTime,.5);
  if(type==="rain")this.chain(ac,"lowpass",1400,.3);
  if(type==="wind"||type==="fog")this.chain(ac,"bandpass",400,.12);
  if(type==="birds"){const note=(t,f0,f1,dur,vol,pan)=>{const o=ac.createOscillator(),g=ac.createGain(),p=ac.createStereoPanner?ac.createStereoPanner():null;o.type="sine";o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.2);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);let out=g;if(p){p.pan.value=pan;g.connect(p);out=p}out.connect(this.master);o.start(t);o.stop(t+dur+.03)};
   const song=()=>{if(document.hidden||Math.random()<.3)return;const t=ac.currentTime+.05,b=2600+Math.random()*1800,pan=Math.random()*1.6-.8;for(let i=0;i<5;i++)note(t+i*.07,b*(1+(i%2)*.18),b*1.1,.05,.05,pan)};song();this.timers.push(setInterval(song,2300))}}};

function compressImg(file,maxKB,cb){if(!file||!file.type.startsWith("image/"))return toast("Vui lòng chọn tệp hình ảnh.",1);const img=new Image(),rd=new FileReader();rd.onload=()=>{img.onload=()=>{const M=900,s=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);let q=.8,d=cv.toDataURL("image/jpeg",q);while(d.length/1.37>maxKB&&q>.35){q-=.12;d=cv.toDataURL("image/jpeg",q)}if(d.length/1.37>maxKB)return toast("Ảnh quá lớn sau khi nén. Hãy chọn ảnh nhỏ hơn.",1);cb(d)};img.onerror=()=>toast("Không đọc được ảnh này.",1);img.src=rd.result};rd.readAsDataURL(file)}
function anyFile(file,maxKB,cb){if(!file)return;if(file.size/1024>maxKB)return toast("Tệp vượt quá "+maxKB+"KB. Hãy chọn tệp nhỏ hơn.",1);const rd=new FileReader();rd.onload=()=>cb({name:file.name,data:rd.result});rd.readAsDataURL(file)}

function makeRecorder(onDone,onState){
 let mr=null,stream=null,chunks=[];
 const start=()=>navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{stream=st;mr=new MediaRecorder(st);
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());onState(false);
   const b=new Blob(chunks,{type:mr.mimeType||"audio/webm"});chunks=[];
   if(b.size/1024>500){toast("Bản ghi quá dài (tối đa khoảng 1 phút).",1);return}
   if(b.size<2000)return;const rd=new FileReader();rd.onload=()=>onDone(rd.result);rd.readAsDataURL(b)};
  mr.start();onState(true)}).catch(()=>{onState(false);toast("Không truy cập được micro.",1)});
 return{start,stop:function(){if(mr&&mr.state!=="inactive")mr.stop();else onState(false)},isActive:()=>mr&&mr.state==="recording"}}

function renderDevItems(catId){const c=catOf(catId),w=$("#dvItems");if(!c||!w){if(w)w.innerHTML="";return}
 R(c.node).get().then(s=>{const v=s.val()||{},ks=Object.keys(v);
  w.innerHTML=ks.length?ks.map(k=>'<div class="rowItem" style="margin-bottom:6px"><span class="grow">'+esc(v[k].name)+'<small>'+ago(v[k].createdAt)+'</small></span><button class="btn btn-g btn-sm" data-died="'+c.id+'|'+k+'">Sửa</button><button class="btn btn-d btn-sm" data-didd="'+c.id+'|'+k+'">Xóa</button></div>').join(""):'<div class="card empty">Danh mục đang trống.</div>';
  $$("#dvItems [data-died]").forEach(b=>b.onclick=()=>{const[cc,id]=b.dataset.died.split("|");editItem(cc,id)});
  $$("#dvItems [data-didd]").forEach(b=>b.onclick=()=>confirmD("Xóa bài đăng này?",()=>deleteItem(...b.dataset.didd.split("|")),true))})}
function renderShopAdmin(){const w=$("#shAdmin");if(!w)return;
 w.innerHTML=state.shopArr.length?state.shopArr.map(it=>'<div class="rowItem" style="margin-bottom:6px"><span class="grow">'+esc(it.name)+'<small>'+it.type+' · '+(it.devOnly?"Riêng":"Miễn phí")+(it.hidden?" · Đang ẩn":"")+'</small></span><button class="btn btn-g btn-sm" data-shed="'+it.id+'">Sửa</button><button class="btn btn-d btn-sm" data-shdel="'+it.id+'">Xóa</button></div>').join(""):'<div class="card empty">Chưa có vật phẩm nào.</div>';
 $$("#shAdmin [data-shed]").forEach(b=>b.onclick=()=>{const it=state.shop[b.dataset.shed];$("#shId").value=it.id;$("#shName").value=it.name||"";$("#shDesc").value=it.desc||"";$("#shType").value=it.type;$("#shVal").value=it.value||"";$("#shDev").checked=!!it.devOnly;$("#shHid").checked=!!it.hidden;$("#shNew").style.display="";$("#shFormT").textContent="Sửa vật phẩm"});
 $$("#shAdmin [data-shdel]").forEach(b=>b.onclick=()=>confirmD("Xóa vật phẩm này khỏi Shop?",()=>R("shop/"+b.dataset.shdel).remove().then(()=>toast("Đã xóa vật phẩm.")),true))}
/* Hành động dev: đề xuất + hộp thư */
document.addEventListener("click",e=>{if(!state.dev)return;
 const ap=e.target.closest("[data-dap]");if(ap)approveProp(ap.dataset.dap,$("#pn_"+ap.dataset.dap)?$("#pn_"+ap.dataset.dap).value:"");
 const ch=e.target.closest("[data-dch]");if(ch)reviewProp(ch.dataset.dch,"changes",$("#pn_"+ch.dataset.dch)?$("#pn_"+ch.dataset.dch).value:"");
 const re=e.target.closest("[data-dre]");if(re)reviewProp(re.dataset.dre,"rejected",$("#pn_"+re.dataset.dre)?$("#pn_"+re.dataset.dre).value:"");
 const ed=e.target.closest("[data-ded]");if(ed)editProposal(ed.dataset.ded);
 const de=e.target.closest("[data-ddel]");if(de)confirmD("Xóa đề xuất này?",()=>R("proposals/"+de.dataset.ddel).remove(),true);
 const rr=e.target.closest("[data-rr]");if(rr){const k=rr.dataset.rr;
  R("reports/"+k).get().then(s=>{const r=s.val();if(!r)return;const note=$("#rr_"+k)?$("#rr_"+k).value.trim():"";
   R("reports/"+k).update({status:"read"}).then(()=>{
    const boxMsg={title:"Phản hồi về "+(r.type==="idea"?"góp ý":"báo cáo"),body:note||"Nội dung của bạn đã được xem xét. Cảm ơn bạn!",at:Date.now(),read:false};
    if(r.sender&&r.senderBoxKey)R("mybox/"+r.sender.id+"/"+r.senderBoxKey).update(boxMsg);
    else R("mybox/"+r.sender.id).push(boxMsg);
    toast("Đã gửi phản hồi.");devPane("mail")})})}
 const rdd=e.target.closest("[data-rd]");if(rdd)R("reports/"+rdd.dataset.rd+"/status").set("read").then(()=>{devPane("mail")});
 const rx=e.target.closest("[data-rx]");if(rx)confirmD("Xóa nội dung này khỏi hộp thư?",()=>R("reports/"+rx.dataset.rx).remove().then(()=>{devPane("mail")}),true)});
async function approveProp(key,note){const p=(await R("proposals/"+key).get()).val();if(!p)return;
 let catId=p.cat;
 if(catId==="__new"){const id="c"+Date.now().toString(36);
  await R("cats/"+id).set({id,label:clean(p.newCat,24),mode:p.url?"url":"code"});catId=id}
 const c=catOf(catId);if(!c)return toast("Danh mục không tồn tại.",1);
 const ref=R(c.node).push();
 await ref.set({name:p.name,desc:p.desc||"",img:p.img||"",url:p.url||"",code:p.code||"",ownerId:p.sender.id,ownerName:p.sender.name,createdAt:Date.now(),updatedAt:Date.now()});
 R("userPosts/"+p.sender.id+"/"+c.id+"_"+ref.key).set(true).catch(()=>{});
 R("meta/count_items").transaction(n=>(n||0)+1);
 R("proposals/"+key).update({status:"approved",targetId:ref.key,targetCat:c.id});
 const boxMsg={status:"approved",body:note||"Đề xuất của bạn đã được duyệt và đăng.",read:false};
 if(p.boxKey)R("mybox/"+p.sender.id+"/"+p.boxKey).update(boxMsg).catch(()=>{});
 R("mybox/"+p.sender.id).push({type:"proposal",pid:key,title:"Đề xuất đã được duyệt",body:note||"Đề xuất của bạn đã được duyệt và đăng.",at:Date.now(),status:"approved"}).catch(()=>{});
 toast("Đã duyệt và đăng nội dung!")}
function reviewProp(key,status,note){R("proposals/"+key).get().then(s=>{const p=s.val();
 R("proposals/"+key).update({status,reviewNote:note||""}).then(()=>{
  if(p&&p.sender){const body=(status==="changes"?"Cần chỉnh sửa: ":"Đề xuất bị từ chối. ")+(note||"Vui lòng xem lại nội dung.");
   const boxMsg={status,body,read:false};
   if(p.boxKey)R("mybox/"+p.sender.id+"/"+p.boxKey).update(boxMsg).catch(()=>{});
   R("mybox/"+p.sender.id).push({type:"proposal",pid:key,title:"Đề xuất: "+p.name,body,at:Date.now(),status}).catch(()=>{})}
  toast("Đã cập nhật đề xuất.")})})}
function editProposal(key){R("proposals/"+key).get().then(s=>{const p=s.val();openGeneric("Chỉnh sửa đề xuất",
 '<div class="fld"><label>Tiêu đề</label><input id="epN" value="'+esc(p.name)+'"></div><div class="fld"><label>Mô tả</label><textarea id="epD">'+esc(p.desc||"")+'</textarea></div><div class="fld"><label>Liên kết</label><input id="epU" value="'+esc(p.url||"")+'"></div><div class="fld"><label>Nội dung</label><textarea id="epC">'+esc(p.code||"")+'</textarea></div><button class="btn btn-p" id="epGo">Lưu</button>');
 $("#epGo").onclick=()=>R("proposals/"+key).update({name:clean($("#epN").value,80),desc:$("#epD").value.slice(0,600),url:clean($("#epU").value,500),code:$("#epC").value.slice(0,20000)}).then(()=>{closePop();toast("Đã cập nhật đề xuất.")})})}
/* ================= LISTENERS TOÀN CỤC ================= */
function loadCfgs(){
 R("cats").on("value",s=>{const v=s.val()||{};state.cats=BASE.concat(Object.values(v).map(c=>({id:c.id,label:c.label,mode:c.mode||"url",node:"custom"})))});
 R("shop").on("value",s=>{state.shop=s.val()||{};state.shopArr=Object.values(state.shop)});
 R("settings/themes").on("value",s=>{state.tcfg=s.val()||{};applyTheme()});
 R("settings/notice").on("value",s=>{const n=s.val();state.notice=n;
  if(n&&n.on){const dk="ssw_seen_"+n.v;if(!localStorage.getItem(dk)){localStorage.setItem(dk,"1");openGeneric(n.title||"Thông báo",'<p style="color:var(--sub);font-size:13.5px;line-height:1.7;white-space:pre-wrap">'+esc(n.body)+'</p><button class="btn btn-p" data-close>Đã hiểu</button>')}}});
 R("settings/utilNote").on("value",s=>{state.utilNote=s.val()||""});
 R("meta/perf").on("value",s=>{if(s.exists()&&!localStorage.getItem("ssw_perf")){state.perf=s.val();applyTheme()}})}
/* ================= BOOT (luôn kết thúc — fix xoay vô hạn) ================= */
function setBoot(txt,p){const t=$("#bootTxt"),b2=$("#bootBar");if(t)t.textContent=txt;if(b2)b2.style.width=(p*100)+"%";const r=document.querySelector(".bring");if(r)r.style.setProperty("--bp",p*100)}
let bootDone=false;
function hideBoot(){if(bootDone)return;bootDone=true;const b=$("#boot");if(!b)return;b.classList.add("hide");setTimeout(()=>{b.style.display="none"},700)}
function bootFail(msg){const b=$("#boot");if(!b)return;b.classList.add("err");setBoot("",0);
 const t=$("#bootTxt");if(t)t.textContent=msg;
 const w=document.querySelector(".bwrap");if(w&&!$("#bootRetry"))w.insertAdjacentHTML("beforeend",'<button class="btn btn-p" id="bootRetry">Thử lại</button>');
 const r=$("#bootRetry");if(r)r.onclick=()=>location.reload()}
(async function boot(){injectIcons();applyTheme();tickClock();
 if(typeof firebase==="undefined"||!db)return bootFail("Không thể kết nối dịch vụ. Vui lòng kiểm tra mạng và thử lại.");
 try{setBoot("Đang khởi tạo…",.15);
  await Promise.race([authReady,new Promise((_,rj)=>setTimeout(()=>rj(0),6000))]);
  setBoot("Đang tải dữ liệu giao diện…",.55);
  await Promise.race([Promise.all([R("settings/themes").get(),R("cats").get(),R("shop").get(),R("settings/notice").get(),R("settings/utilNote").get()]),new Promise((_,rj)=>setTimeout(()=>rj(0),8000))]);
  setBoot("Sẵn sàng!",1);
  setTimeout(()=>{hideBoot();route()},400)}
 catch(e){bootFail("Không thể tải dữ liệu. Vui lòng thử lại.")}
 /* an toàn tuyệt đối: không bao giờ treo màn hình loading */
 setTimeout(()=>{hideBoot();route()},12000)})();
/* Dừng mọi hoạt cảnh khi rời tab — tiết kiệm pin, hết giật */
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){stopWx();if(SND.master&&SND.ac)SND.master.gain.setTargetAtTime(0,SND.ac.currentTime,.2);if(!BGM.paused)BGM.pause()}
 else{startWx();if(state.snd){if(SND.master&&SND.ac)SND.master.gain.setTargetAtTime(state.vol/100,SND.ac.currentTime,.2);refreshBgm()}}});
</script>
